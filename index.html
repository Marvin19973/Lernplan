<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Klausuren-Dashboard – SS26</title>
<style>
  :root {
    --bg: #0e1016;
    --card: #171a24;
    --card-border: #262a38;
    --text-primary: #eef0f5;
    --text-secondary: #9096ab;
    --text-muted: #666c80;
    --accent: #5b8def;
    --green: #34d399;
    --amber: #f5a623;
    --pill-bg: #1f2433;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1.25rem 4rem;
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #app { max-width: 1100px; margin: 0 auto; }
  .top-label { font-size: 11px; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 8px; }
  h1 { font-size: 26px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { font-size: 14px; color: var(--text-secondary); margin: 0 0 1.75rem; }

  .next-exam {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    background: var(--card); border: 1px solid var(--card-border); border-radius: 12px;
    padding: 0.9rem 1.2rem; margin-bottom: 1.5rem;
  }
  .next-exam-label { font-size: 11px; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 2px; }
  .next-exam-name { font-size: 16px; font-weight: 600; }
  .next-exam-date { font-size: 13px; color: var(--text-secondary); margin-left: 8px; }
  .next-exam-countdown { font-size: 20px; font-weight: 700; color: var(--amber); white-space: nowrap; }
  .next-exam-countdown span { font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-left: 4px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .tab-btn {
    background: var(--card); border: 1px solid var(--card-border); color: var(--text-secondary);
    padding: 0.55rem 1rem; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  .view { display: none; }
  .view.active { display: block; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 1.25rem 1.35rem 1.5rem; }
  .card-title { font-size: 15px; font-weight: 700; margin: 0 0 2px; }
  .card-sub { font-size: 12.5px; color: var(--text-secondary); margin: 0 0 12px; }
  .progress-bar-track { height: 6px; background: var(--pill-bg); border-radius: 4px; overflow: hidden; margin-bottom: 6px; }
  .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .progress-pct { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
  .lernplan-item { padding: 5px 0; border-bottom: 1px dashed var(--card-border); }
  .lernplan-item:last-child { border-bottom: none; }
  .lernplan-row { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; }
  .lernplan-item input[type=checkbox] { margin-top: 2px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
  .lernplan-item label { cursor: pointer; flex: 1; }
  .lernplan-item.checked label { color: var(--text-muted); text-decoration: line-through; }
  .lernplan-toggle { flex-shrink: 0; font-size: 11px; font-weight: 600; color: var(--accent); cursor: pointer; white-space: nowrap; margin-top: 1px; }
  .lernplan-answer { display: none; margin: 6px 0 2px 26px; font-size: 12.5px; color: var(--text-secondary); background: var(--pill-bg); border-radius: 8px; padding: 0.6rem 0.75rem; line-height: 1.55; }
  .lernplan-answer.show { display: block; }

  .day-group { margin-bottom: 22px; }
  .day-group-title { font-size: 13px; letter-spacing: 0.05em; color: var(--text-muted); margin: 0 0 10px; text-transform: uppercase; }
  .day-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; padding: 0.9rem 1.1rem; margin-bottom: 10px; }
  .day-card-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .day-date { font-size: 13.5px; font-weight: 700; }
  .day-tag { font-size: 11px; color: var(--text-muted); }
  .day-task { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; padding: 4px 0; }
  .day-task input[type=checkbox] { margin-top: 2px; accent-color: var(--green); cursor: pointer; }
  .day-task label { cursor: pointer; flex: 1; }
  .day-task.checked label { color: var(--text-muted); text-decoration: line-through; }
  .day-entry { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--card-border); }
  .day-entry:first-of-type { margin-top: 0; padding-top: 0; border-top: none; }
  .day-entry-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .day-badge { flex-shrink: 0; font-size: 10px; font-weight: 700; letter-spacing: 0.03em; padding: 2px 7px; border-radius: 6px; }
  .day-badge-stat { background: rgba(91,141,239,0.18); color: #8fb4ff; }
  .day-badge-mv { background: rgba(52,211,153,0.18); color: var(--green); }
  .day-badge-strat { background: rgba(245,166,35,0.18); color: var(--amber); }
  .day-badge-puo { background: rgba(167,139,250,0.18); color: #a78bfa; }

  .quiz-tab-row { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
  .quiz-tab { background: var(--card); border: 1px solid var(--card-border); border-radius: 10px; padding: 0.6rem 0.9rem; cursor: pointer; min-width: 150px; }
  .quiz-tab.active { border-color: var(--accent); }
  .quiz-tab-title { font-size: 13px; font-weight: 700; margin: 0; }
  .quiz-tab-sub { font-size: 11px; color: var(--text-secondary); margin: 2px 0 0; }
  .quiz-tab-stats { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

  .quiz-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 1.4rem; }
  .quiz-q-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; font-size: 15px; font-weight: 600; margin-bottom: 1rem; line-height: 1.4; }
  .quiz-calc-badge { flex-shrink: 0; background: var(--pill-bg); color: var(--amber); font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
  .quiz-opts { display: flex; flex-direction: column; gap: 8px; }
  .quiz-opt { display: flex; align-items: center; gap: 10px; background: var(--pill-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 0.65rem 0.85rem; cursor: pointer; font-size: 13.5px; }
  .quiz-opt:hover { border-color: var(--accent); }
  .quiz-dot { flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: #2a2f40; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
  .quiz-opt.disabled-look { cursor: default; }
  .quiz-opt.correct { border-color: var(--green); background: rgba(52,211,153,0.12); }
  .quiz-opt.correct .quiz-dot { background: var(--green); color: #06251c; }
  .quiz-opt.wrong { border-color: #f16565; background: rgba(241,101,101,0.1); }
  .quiz-opt.wrong .quiz-dot { background: #f16565; color: #350a0a; }
  .quiz-opt.selected { border-color: var(--accent); background: rgba(91,141,239,0.12); }
  .quiz-opt.selected .quiz-dot { background: var(--accent); color: #0d1524; }
  .quiz-match-badge { flex-shrink: 0; background: var(--pill-bg); color: #a78bfa; font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
  .quiz-match-rows { display: flex; flex-direction: column; gap: 10px; }
  .quiz-match-row { display: flex; align-items: center; gap: 12px; background: var(--pill-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 0.65rem 0.85rem; }
  .quiz-match-def { flex: 1; font-size: 13.5px; line-height: 1.4; }
  .quiz-match-select { flex-shrink: 0; min-width: 190px; max-width: 260px; background: var(--card); color: var(--text-primary); border: 1px solid var(--card-border); border-radius: 8px; padding: 0.4rem 0.5rem; font-size: 13px; }
  .quiz-match-row.correct { border-color: var(--green); background: rgba(52,211,153,0.12); }
  .quiz-match-row.wrong { border-color: #f16565; background: rgba(241,101,101,0.1); }
  .quiz-match-row.wrong .quiz-match-select { border-color: #f16565; }
  .quiz-match-correct-hint { font-size: 12px; color: var(--green); margin-top: 4px; }
  .quiz-explain { display: none; margin-top: 1rem; font-size: 13px; color: var(--text-secondary); background: var(--pill-bg); border-radius: 10px; padding: 0.8rem 0.9rem; line-height: 1.5; }
  .quiz-explain.show { display: block; }
  .quiz-summary { text-align: center; padding: 2rem 1rem; font-size: 15px; color: var(--text-secondary); }
  .quiz-reset-btn { display: inline-block; margin-top: 12px; color: var(--accent); cursor: pointer; font-weight: 600; font-size: 13px; }
  .quiz-diagram-wrap { margin-bottom: 1rem; background: var(--pill-bg); border-radius: 10px; padding: 0.8rem; overflow-x: auto; }
  .quiz-diagram-wrap svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
  .quiz-diagram-wrap table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .quiz-diagram-wrap td, .quiz-diagram-wrap th { border: 1px solid var(--card-border); padding: 6px 9px; text-align: left; }
  .quiz-diagram-wrap tr:nth-child(even) { background: rgba(255,255,255,0.02); }

  .flashcard-progress-text { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .flashcard-actions { margin-top: 1rem; text-align: center; }
  .flashcard-btn { display: none; background: var(--accent); color: white; border: none; border-radius: 10px; padding: 0.6rem 1.4rem; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .flashcard-btn.show { display: inline-block; }
  .flashcard-hint { margin-top: 1rem; font-size: 12.5px; color: var(--text-muted); text-align: center; }
  .flashcard-stats { margin-top: 10px; font-size: 12px; color: var(--text-muted); text-align: center; }

  .info-box { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; padding: 1rem 1.2rem; font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 1.2rem; }
  .info-box b { color: var(--text-primary); }

  .kk-controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 1rem; font-size: 13px; }
  .kk-controls select { background: var(--pill-bg); color: var(--text-primary); border: 1px solid var(--card-border); border-radius: 8px; padding: 0.4rem 0.6rem; font-size: 13px; }
  .kk-controls label { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); cursor: pointer; }
  .kk-controls input[type=checkbox] { accent-color: var(--accent); cursor: pointer; }
  .kk-shuffle-btn { background: var(--pill-bg); border: 1px solid var(--card-border); color: var(--text-primary); border-radius: 8px; padding: 0.4rem 0.8rem; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .kk-progress-text { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .kk-progress-inline { font-size: 12.5px; color: var(--text-muted); }
  .kk-stage { perspective: 1400px; margin-bottom: 1rem; }
  .kk-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 2rem 1.6rem; min-height: 170px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer; }
  .kk-card.mastered { border-color: var(--green); }
  .kk-side-label { font-size: 10.5px; letter-spacing: 0.1em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; }
  .kk-front-text { font-size: 16px; font-weight: 700; line-height: 1.5; }
  .kk-back-text { font-size: 13.5px; color: var(--text-secondary); line-height: 1.6; text-align: left; }
  .kk-tap-hint { margin-top: 14px; font-size: 11.5px; color: var(--text-muted); }
  .kk-actions { display: flex; gap: 10px; justify-content: center; }
  .kk-btn { flex: 1; max-width: 220px; padding: 0.7rem; border-radius: 10px; border: 1px solid var(--card-border); background: var(--pill-bg); font-weight: 700; font-size: 13px; cursor: pointer; color: var(--text-primary); }
  .kk-btn.again { color: #f16565; border-color: #f16565; }
  .kk-btn.know { color: var(--green); border-color: var(--green); }
  .kk-flip-hint { text-align: center; font-size: 12.5px; color: var(--text-muted); margin-bottom: 1rem; }
  .kk-mastery-bar { display: flex; height: 6px; border-radius: 4px; overflow: hidden; background: var(--pill-bg); margin-bottom: 6px; }
  .kk-mastery-fill { background: var(--green); height: 100%; }
  .kk-mastery-text { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }

  .course-select { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .course-btn { background: var(--card); border: 1px solid var(--card-border); color: var(--text-secondary); padding: 0.5rem 0.9rem; border-radius: 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .course-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
</style>
</head>
<body>
<div id="app">
  <div class="course-select" id="courseSelect">
    <button class="course-btn" data-course="stat">Statistik</button>
    <button class="course-btn" data-course="mv">Marketing &amp; Vertrieb</button>

  </div>
  <div class="top-label" id="topLabel">&nbsp;</div>
  <h1 id="mainH1">&nbsp;</h1>
  <p class="subtitle" id="mainSubtitle">&nbsp;</p>

  <div class="next-exam">
    <div>
      <div class="next-exam-label">NÄCHSTE KLAUSUR</div>
      <span class="next-exam-name" id="examName">&nbsp;</span>
      <span class="next-exam-date" id="examDateLabel">&nbsp;</span>

  <div class="tabs">

  <div class="view active" id="view-module">

    <div class="grid" id="moduleGrid"></div>

  <div class="view" id="view-tagesplan">
    <div class="info-box" id="infoTagesplan">Gesamtplan über <b>alle 4 Klausuren</b>, chronologisch nach Kalendertag sortiert – unabhängig von der Kurs-Auswahl oben immer vollständig sichtbar. <span class="day-badge day-badge-stat">Statistik</span> <span class="day-badge day-badge-mv">M&amp;V</span> <span class="day-badge day-badge-strat">Strat.</span> <span class="day-badge day-badge-puo">P&amp;O</span> zeigen, zu welchem Kurs eine Aufgabe gehört.</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://lusgeshniirqehnfytnl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_PxTl1rdS-GVDLxp5NYQ1og_qun86eXD';
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

/* ============================================================
   MODULES / lernplan checkable items
   ============================================================ */
/* ---------- STAT DATA ---------- */
const MODULES_STAT = [
  { id: 'a', title: 'Teil A · Beschreibende Statistik', sub: 'Grundbegriffe, Lage-/Streuungsmaße, Histogramm, Boxplot, Regression', lernplan: [
    { id: 'a-1', text: 'Grundgesamtheit, Stichprobe, statistische Einheit, Merkmal – Definitionen', a: 'Grundgesamtheit (Population): Menge aller relevanten Objekte. Stichprobe: untersuchte Teilmenge davon. Statistische Einheiten: die Elemente der Grundgesamtheit (Merkmalsträger). Merkmal: die interessierende Eigenschaft, deren Ausprägungen an den Einheiten gemessen werden.' },
    { id: 'a-2', text: 'Skalenniveaus: nominal, ordinal, metrisch – Unterschiede + Beispiele', a: 'Nominal: nur Gleichheit/Ungleichheit unterscheidbar, keine Rangfolge (z.B. Haarfarbe, Geschlecht). Ordinal: Rangfolge vorhanden, Abstände nicht interpretierbar (z.B. Schulnoten, Zufriedenheit). Metrisch: Abstände sinnvoll interpretierbar, arithmetisches Mittel bildbar (z.B. Gewicht, Einkommen). Zusätzlich diskret vs. stetig bei metrischen Merkmalen.' },
    { id: 'a-3', text: 'Arithmetisches Mittel, Median, Modus – wann welches Lagemaß verwenden?', a: 'Arithmetisches Mittel x̄ = (1/n)Σxi: nur bei metrischen Daten, empfindlich gegenüber Ausreißern. Median x̃ (mittlerer Wert der geordneten Daten, bei geradem n: Mittelwert der beiden mittleren Werte): ab Ordinalskala, robust gegenüber Ausreißern. Modus (häufigster Wert): auf jedem Skalenniveau anwendbar, auch bei nominalen Daten.' },
    { id: 'a-4', text: 'Empirische Varianz und Standardabweichung – exakte Formel (ACHTUNG Divisor!)', a: 'In der Beschreibenden Statistik (Teil A) gilt für die empirische Varianz DIVISOR n: s²x = 1/n · Σ(xi − x̄)² = 1/n·Σxi² − x̄² (Verschiebungssatz). Empirische Standardabweichung sx = √s²x. WICHTIG: In der Schließenden Statistik (Teil D) wird für die Stichprobenvarianz σ̂² dagegen der Divisor n−1 verwendet: σ̂² = 1/(n−1)·Σ(Xi − X̄)² – das ist eine ANDERE Formel für einen ANDEREN Zweck (Erwartungstreue als Schätzer)! Genau diese Verwechslung (n statt n−1 bzw. umgekehrt) ist eine der häufigsten Fehlerquellen in der Klausur – immer zuerst prüfen, ob die Aufgabe rein deskriptiv ist (Teil A, Divisor n) oder eine Schätzung im stochastischen Modell verlangt (Teil D, Divisor n−1).' },
    { id: 'a-5', text: 'Boxplot: welche 5 Kenngrößen werden dargestellt und wie liest man sie ab?', a: 'Minimum, unteres Quartil (0,25-Quantil), Median, oberes Quartil (0,75-Quantil), Maximum. Die Box reicht vom unteren zum oberen Quartil, der Strich in der Box ist der Median. Bei geradem Stichprobenumfang n ist der Median der Mittelwert der beiden mittleren Beobachtungen (Ordnungsstatistiken x₍n/2₎ und x₍n/2+1₎) – NICHT einfach ein einzelner abgelesener Wert!' },
    { id: 'a-6', text: 'Histogramm: Zusammenhang zwischen Balkenhöhe, Klassenbreite und Häufigkeit', a: 'Beim Histogramm gilt: Höhe × Klassenbreite = relative Häufigkeit der Klasse (Fläche = relative Häufigkeit, nicht die Höhe allein!). Bei Angabe eines Proportionalitätsfaktors c gilt entsprechend: absolute Häufigkeit n(Kj) = Höhe × Breite × c bzw. nach der im Aufgabentyp verwendeten Normierung.' },
    { id: 'a-7', text: 'Lorenz-Kurve und Konzentrationsmaße (Gini-Koeffizient) – Grundidee', a: 'Die Lorenz-Kurve stellt den kumulierten Anteil einer Merkmalssumme (y-Achse) gegen den kumulierten Anteil der Merkmalsträger (x-Achse) dar. Bei Gleichverteilung verläuft sie auf der Diagonalen (45°-Linie), bei maximaler Konzentration verläuft sie entlang der Achsen. Der Gini-Koeffizient misst die Fläche zwischen Diagonale und Lorenz-Kurve (normiert), je größer desto ungleicher verteilt.' },
    { id: 'a-8', text: 'Lineare Regression: Methode der kleinsten Quadrate – was wird minimiert?', a: 'Die Regressionsgerade ŷ(x) = â + b̂x minimiert die Summe der quadrierten (vertikalen) Residuen Σ(yi − ŷ(xi))² über alle möglichen Geraden. Die Steigung lässt sich aus dem Bravais-Pearson-Korrelationskoeffizienten und den empirischen Varianzen sx²/sy² berechnen: b̂ = sxy/sx² (sxy = empirische Kovarianz).' },
  ]},
  { id: 'b', title: 'Teil B · Wahrscheinlichkeitsrechnung', sub: 'Grundlagen, diskrete/stetige Verteilungen, bedingte Wahrscheinlichkeit, Unabhängigkeit', lernplan: [
    { id: 'b-1', text: 'Wahrscheinlichkeitsraum (Ω, A, P) – die drei Bestandteile', a: 'Ω: Ergebnismenge (alle möglichen Ausgänge). A: Ereignisalgebra/σ-Algebra (Menge der betrachteten Ereignisse, Teilmengen von Ω). P: Wahrscheinlichkeitsmaß, das jedem Ereignis aus A eine Wahrscheinlichkeit in [0,1] zuordnet, mit P(Ω)=1 und Additivität für disjunkte Ereignisse (Kolmogorow-Axiome).' },
    { id: 'b-2', text: 'Wichtige diskrete Verteilungen und ihre Kenngrößen', a: 'Binomialverteilung bin(n,p): E(X)=np, Var(X)=np(1−p), Anzahl Erfolge bei n unabhängigen Versuchen. Poissonverteilung: Modell für seltene Ereignisse, E(X)=Var(X)=λ. Geometrische Verteilung: Anzahl Versuche bis zum ersten Erfolg. Hypergeometrische Verteilung: Ziehen ohne Zurücklegen.' },
    { id: 'b-3', text: 'Riemann-Dichte vs. Verteilungsfunktion – Zusammenhang', a: 'Die Verteilungsfunktion F(x)=P(X≤x) ist das Integral der Dichte: F(x)=∫_{-∞}^x f(t)dt. Umgekehrt ist die Dichte (wo differenzierbar) die Ableitung der Verteilungsfunktion: f(x)=F′(x). Es gilt ∫_{-∞}^{∞} f(x)dx = 1.' },
    { id: 'b-4', text: 'Wichtige stetige Verteilungen: Normal-, Exponential-, Gleichverteilung', a: 'Normalverteilung N(µ,σ²): Dichte glockenförmig um µ, Streuung σ². Exponentialverteilung Exp(ϑ): Dichte f(x)=(1/ϑ)e^(−x/ϑ) für x≥0, Modell für Wartezeiten, gedächtnislos. Stetige Gleichverteilung auf [a,b]: konstante Dichte 1/(b−a).' },
    { id: 'b-5', text: 'Bedingte Wahrscheinlichkeit und Satz von Bayes', a: 'Bedingte Wahrscheinlichkeit: P(A|B) = P(A∩B)/P(B) für P(B)>0. Satz von Bayes: P(A|B) = P(B|A)·P(A) / P(B), erlaubt das "Umdrehen" der Bedingung – zentral z.B. bei medizinischen Tests (Sensitivität/Spezifität → Wahrscheinlichkeit bei positivem Test tatsächlich erkrankt zu sein).' },
    { id: 'b-6', text: 'Stochastische Unabhängigkeit von Ereignissen – Definition', a: 'Zwei Ereignisse A, B heißen stochastisch unabhängig, wenn P(A∩B) = P(A)·P(B) gilt (äquivalent: P(A|B)=P(A), sofern P(B)>0). Für mehr als zwei Ereignisse muss diese Produktregel für JEDE Teilmenge gelten (nicht nur paarweise) – paarweise Unabhängigkeit impliziert nicht vollständige (stochastische) Unabhängigkeit.' },
  ]},
  { id: 'c', title: 'Teil C · Zufallsvariablen', sub: 'Verteilungsfunktion, mehrdim. ZV, Erwartungswert/Varianz/Kovarianz, Grenzwertsätze', lernplan: [
    { id: 'c-1', text: 'Zufallsvariable – formale Definition und Verteilungsfunktion', a: 'Eine Zufallsvariable X ist eine (messbare) Abbildung X: Ω → R. Ihre Verteilungsfunktion F(x)=P(X≤x) ist monoton wachsend, rechtsseitig stetig, mit lim(x→−∞)F(x)=0 und lim(x→∞)F(x)=1.' },
    { id: 'c-2', text: 'Quantilfunktion – Definition und Nutzen', a: 'Die Quantilfunktion (verallgemeinerte Inverse der Verteilungsfunktion) liefert zu einem Niveau p∈(0,1) den Wert xp mit F(xp)≥p (bzw. das kleinste solche x). Genutzt z.B. zur Bestimmung von Median (p=0,5) und Quartilen sowie bei der Konstruktion von Konfidenzintervallen.' },
    { id: 'c-3', text: 'Mehrdimensionale Zufallsvariablen: gemeinsame, Rand- und bedingte Verteilung', a: 'Gemeinsame Verteilung P(X=i,Y=j) beschreibt das Zusammenspiel zweier Zufallsvariablen. Randverteilung P(X=i)=Σj P(X=i,Y=j) (Summe über alle j). Bedingte Verteilung P(X=i|Y=j) = P(X=i,Y=j)/P(Y=j). In Tabellenaufgaben: Zeilen-/Spaltensummen liefern die Randverteilungen.' },
    { id: 'c-4', text: 'Transformationen von Zufallsvariablen – Grundprinzip', a: 'Für Y=g(X) mit streng monotonem, differenzierbarem g lässt sich die Dichte von Y aus der Dichte von X berechnen: f_Y(y) = f_X(g⁻¹(y)) · |d/dy g⁻¹(y)|. Für lineare Transformationen Y=aX+b gilt einfacher: E(Y)=aE(X)+b, Var(Y)=a²Var(X).' },
    { id: 'c-5', text: 'Erwartungswert und Varianz: diskret vs. stetig – exakte Formeln', a: 'Diskret: E(X)=Σxi·P(X=xi), Var(X)=E(X²)−(E(X))²=Σ(xi−E(X))²·P(X=xi). Stetig: E(X)=∫x·f(x)dx, Var(X)=∫x²f(x)dx − (E(X))². Bei unbeschränktem Träger (z.B. [a,∞)) genau auf Integrationsgrenzen UND Vorzeichen achten – Verschiebungssatz Var(X)=E(X²)−(E(X))² ist meist einfacher als direktes Ausrechnen von E((X−µ)²).' },
    { id: 'c-6', text: 'Kovarianz und Korrelation – Formeln und Var(X+Y)', a: 'Kovarianz Cov(X,Y)=E(XY)−E(X)E(Y). Korrelationskoeffizient ρ=Cov(X,Y)/(σX·σY), immer in [−1,1]. Wichtige Rechenregel: Var(X+Y) = Var(X) + Var(Y) + 2·Cov(X,Y) (bei Unabhängigkeit ist Cov(X,Y)=0, dann Var(X+Y)=Var(X)+Var(Y)). Vorsicht beim Vorzeichen des Kovarianzterms – er wird ADDIERT, nicht subtrahiert.' },
    { id: 'c-7', text: 'Bedingte Erwartungswerte – Grundidee', a: 'E(X|Y=y) ist der Erwartungswert von X unter der Bedingung, dass Y den Wert y angenommen hat, berechnet mit der bedingten Verteilung von X gegeben Y=y. Es gilt der Satz vom iterierten Erwartungswert: E(X) = E(E(X|Y)).' },
    { id: 'c-8', text: 'Gesetz der großen Zahlen und Zentraler Grenzwertsatz – Aussage und Bedeutung', a: 'Gesetz der großen Zahlen: das Stichprobenmittel X̄n konvergiert (stochastisch) gegen den wahren Erwartungswert µ, je größer n. Zentraler Grenzwertsatz (ZGS): für großes n ist √n·(X̄n−µ)/σ approximativ standardnormalverteilt, unabhängig von der ursprünglichen Verteilung – Grundlage für approximative Konfidenzintervalle und Tests bei unbekannter Verteilung (z.B. bei Binomialverteilung mit großem n).' },
  ]},
  { id: 'd', title: 'Teil D · Schließende Statistik', sub: 'Punktschätzung, MLE, Konfidenzintervalle, Hypothesentests, Regression', lernplan: [
    { id: 'd-1', text: 'Die drei Grundtypen der Inferenzstatistik', a: 'Punktschätzungen: ein einzelner Wert für einen unbekannten Parameter (z.B. p̂). Intervallschätzungen (Konfidenzintervalle): ein Bereich, in dem der wahre Parameter mit hoher Wahrscheinlichkeit liegt. Hypothesentests: Entscheidung, ob eine Hypothese über den Parameter (z.B. µ≤µ0) anhand der Daten verworfen werden kann.' },
    { id: 'd-2', text: 'Erwartungstreue und Konsistenz eines Schätzers – Definitionen', a: 'Erwartungstreue (unverzerrt): E(T̂) = ϑ für alle ϑ (der Schätzer trifft im Mittel den wahren Wert). Konsistenz: die Folge von Schätzern T̂n konvergiert (stochastisch) gegen ϑ, je größer der Stichprobenumfang n wird. Beide Eigenschaften sind wichtige Gütekriterien, aber unabhängig voneinander (ein Schätzer kann konsistent, aber nicht erwartungstreu sein, oder umgekehrt).' },
    { id: 'd-3', text: 'Maximum-Likelihood-Schätzung: Vorgehen in 4 Schritten', a: '1) Likelihood-Funktion L(ϑ) = Produkt der Dichten/Zähldichten aller Beobachtungen aufstellen. 2) Log-Likelihood l(ϑ) = ln(L(ϑ)) bilden (Produkt wird zur Summe, einfacher zu differenzieren). 3) l(ϑ) nach ϑ ableiten und Nullsetzen (notwendige Bedingung fürs Maximum). 4) Nach ϑ auflösen → Maximum-Likelihood-Schätzer ϑ̂ (Maximum ggf. über zweite Ableitung/Randverhalten bestätigen).' },
    { id: 'd-4', text: 'Invarianzeigenschaft des ML-Schätzers – was bedeutet sie?', a: 'Ist ϑ̂ der ML-Schätzer für ϑ, so ist γ(ϑ̂) der ML-Schätzer für eine (beliebige) Funktion γ(ϑ) des Parameters – man kann also einfach die geschätzte Größe ϑ̂ in γ einsetzen, ohne die ML-Schätzung für γ(ϑ) separat neu herzuleiten. Beispiel: ist ϑ̂ ML-Schätzer für ϑ bei Exp(1/ϑ), so ist γ(ϑ̂)=1/ϑ̂ der ML-Schätzer für den Kehrwert γ(ϑ)=1/ϑ.' },
    { id: 'd-5', text: 'Konfidenzintervall – Grundprinzip und Interpretation', a: 'Ein (1−α)-Konfidenzintervall [û,ô] für einen Parameter ϑ erfüllt P(ϑ∈[û,ô]) ≥ 1−α. WICHTIG zur Interpretation: das Intervall ist zufällig (hängt von der Stichprobe ab), nicht der Parameter – die Aussage bezieht sich auf die Überdeckungswahrscheinlichkeit bei wiederholter Stichprobenziehung, nicht auf eine Wahrscheinlichkeit für den festen (aber unbekannten) Parameter selbst.' },
    { id: 'd-6', text: 'Einseitige vs. zweiseitige Konfidenzintervalle', a: 'Zweiseitiges KI: [û,ô] mit beiden Grenzen, Niveau 1−α wird symmetrisch auf beide Seiten aufgeteilt (i.d.R. je α/2). Einseitiges KI: nur eine Grenze wird angegeben (obere ODER untere Grenze), die andere ist ∓∞ – das gesamte Niveau α geht in die eine Richtung, daher liegt die einzelne Grenze bei gleichem Gesamtniveau "näher" am Schätzwert als die entsprechende Grenze des zweiseitigen Intervalls.' },
    { id: 'd-7', text: 'Konfidenzintervall für µ bei bekanntem σ² (Normalverteilung)', a: 'Zweiseitiges (1−α)-KI: [x̄ − σ/√n·u_(1−α/2), x̄ + σ/√n·u_(1−α/2)]. Einseitiges oberes KI: (−∞, x̄ + σ/√n·u_(1−α)]. Einseitiges unteres KI: [x̄ − σ/√n·u_(1−α), ∞). u_β ist das β-Quantil der Standardnormalverteilung.' },
    { id: 'd-8', text: 'Nötiger Stichprobenumfang bei vorgegebener KI-Länge', a: 'Für das KI bei bekanntem σ ist die Länge des zweiseitigen KI L = 2·σ/√n·u_(1−α/2) (unabhängig von den Beobachtungen selbst!). Nach n aufgelöst: n ≥ (2·σ·u_(1−α/2)/L)². Da n ganzzahlig sein muss, wird stets AUFGERUNDET (nie abgerundet), damit die geforderte maximale Länge tatsächlich eingehalten wird.' },
    { id: 'd-9', text: 'Hypothesentest – Aufbau (H0/H1, Teststatistik, Ablehnbereich)', a: 'Nullhypothese H0 (Status quo, wird nur bei starker Evidenz verworfen) vs. Alternativhypothese H1. Es wird eine Teststatistik T berechnet und mit einer kritischen Schranke c verglichen. Fehler 1. Art: H0 fälschlich verwerfen (Wahrscheinlichkeit ≤ Signifikanzniveau α). Fehler 2. Art: H0 fälschlich nicht verwerfen. Der Ablehnbereich ist der Wertebereich der Teststatistik, bei dem H0 verworfen wird.' },
    { id: 'd-10', text: 'Gauß-Test (bekanntes σ²): Teststatistik und Entscheidungsregel', a: 'Modell: X1,...,Xn iid ~ N(µ,σ²), σ² bekannt. Teststatistik: X* = √n·(x̄−µ0)/σ. Für H0: µ≤µ0 vs. H1: µ>µ0 → verwerfe H0, falls X* > u_(1−α). Für H0: µ≥µ0 vs. H1: µ<µ0 → verwerfe H0, falls X* < u_α = −u_(1−α). Für zweiseitiges H0: µ=µ0 vs. H1: µ≠µ0 → verwerfe H0, falls |X*| > u_(1−α/2).' },
    { id: 'd-11', text: 't-Test (unbekanntes σ²): Unterschied zum Gauß-Test', a: 'Ist σ² unbekannt, wird σ in der Teststatistik durch die Stichprobenstandardabweichung σ̂ ersetzt ("Studentisieren"): T = √n·(x̄−µ0)/σ̂. T ist dann t-verteilt mit n−1 Freiheitsgraden (statt standardnormalverteilt), daher werden die kritischen Werte aus der t-Verteilungstabelle (mit n−1 Freiheitsgraden) statt der Standardnormalverteilung abgelesen. Die Entscheidungsregeln sind sonst analog zum Gauß-Test.' },
    { id: 'd-12', text: 'Gepaarter t-Test (verbundene Stichproben) vs. Zweistichproben-t-Test', a: 'Gepaarter t-Test: die Daten liegen als Paare (Xi,Yi) derselben Untersuchungseinheit vor (z.B. Vorher-Nachher-Messung). Man bildet die Differenzen Di=Xi−Yi und wendet den gewöhnlichen Einstichproben-t-Test auf die Differenzen an (Test auf E(D)=0). Zweistichproben-t-Test (unabhängige Stichproben): zwei getrennte, unabhängige Gruppen werden verglichen, benötigt zusätzlich eine gepoolte Varianzschätzung aus beiden Teilstichproben.' },
    { id: 'd-13', text: 'Binomialtests – wann verwendet man sie?', a: 'Binomialtests werden verwendet, wenn die Stichprobenvariablen bin(1,p)-verteilt sind (0/1-Merkmal, z.B. Anteil defekter Teile) und eine Hypothese über den unbekannten Anteil p getestet werden soll. Da die Binomialverteilung diskret ist, werden die kritischen Schranken direkt aus der Verteilungsfunktion der Binomialverteilung bestimmt (exakter Test), nicht approximativ über die Normalverteilung – außer bei sehr großem n, wo die Normalapproximation (ZGS) verwendet werden kann.' },
    { id: 'd-14', text: 'Lineares Regressionsmodell: Punktschätzung, KI und Tests im Überblick', a: 'Im linearen Regressionsmodell werden die Koeffizienten (Achsenabschnitt und Steigung) mittels Kleinste-Quadrate-Methode geschätzt (analog zu Teil A8, jetzt aber im stochastischen Modell mit Verteilungsannahmen für die Fehlerterme). Darauf aufbauend lassen sich Konfidenzintervalle für die Koeffizienten sowie Hypothesentests (z.B. auf Steigung = 0, d.h. kein linearer Zusammenhang) mit t-verteilten Teststatistiken konstruieren.' },
  ]},
];

        "(1/10) · [(6-7)²+(7-7)²+(10-7)²+(5-7)²+(7-7)²+(11-7)²+(8-7)²+(4-7)²+(6-7)²+(6-7)²]", "(1/9) · [(6-7)²+(7-7)²+(10-7)²+(5-7)²+(7-7)²+(11-7)²+(8-7)²+(4-7)²+(6-7)²+(6-7)²]", "(1/10) · [6+7+10+5+7+11+8+4+6+6]", "10 · [(6-7)²+(7-7)²+(10-7)²+(5-7)²+(7-7)²+(11-7)²+(8-7)²+(4-7)²+(6-7)²+(6-7)²]"
      ], correct: 0, calc: true, explain: "x̄ = 70/10 = 7. Summe der quadrierten Abweichungen = 1+0+9+4+0+16+1+9+1+1 = 42. s² = 42/10 = 4,2 (Divisor n, da Teil A / Beschreibende Statistik). Mit Divisor n−1 (Option B) käme fälschlich 42/9 ≈ 4,667 heraus – das wäre die Formel für die Stichprobenvarianz aus Teil D, hier aber falsch." },
    { le: 'a', q: "Bei einem Datensatz mit geradem Stichprobenumfang n=10 sind die geordneten Werte (Ordnungsstatistiken) x(5)=8 und x(6)=13. Wie lautet der Median?", opts: [
        "10,5 (Mittelwert von x(5) und x(6))", "8 (der kleinere der beiden mittleren Werte)", "13 (der größere der beiden mittleren Werte)", "Der Median ist bei geradem n nicht definiert"
      ], correct: 0, calc: true, explain: "Bei geradem n ist der Median der Mittelwert der beiden mittleren Ordnungsstatistiken: (x(5)+x(6))/2 = (8+13)/2 = 10,5. Nur einen der beiden Werte zu nehmen (Option B/C) ist ein häufiger Ablesefehler bei Boxplots." },
    { le: 'a', q: "Welche Aussagen zum Boxplot treffen zu? (mehrere richtig)", multi: true, opts: [
        "Die Box selbst reicht vom unteren zum oberen Quartil (0,25- bis 0,75-Quantil)", "Der Strich in der Box markiert den Median", "Die Whisker (Antennen) reichen typischerweise bis zum Minimum bzw. Maximum (bzw. bis zu einer definierten Ausreißergrenze)", "Der Boxplot zeigt das arithmetische Mittel als Strich in der Box, nicht den Median"
      ], correct: [0,1,2], explain: "Ein Boxplot stellt Minimum, unteres Quartil, Median, oberes Quartil und Maximum dar. Die Box geht vom unteren zum oberen Quartil, der Median-Strich liegt in der Box, die Whisker markieren i.d.R. Minimum/Maximum bzw. Ausreißergrenzen. Der Strich in der Box ist der MEDIAN, nicht das arithmetische Mittel." },
    { le: 'a', q: "Für eine Stichprobe vom Umfang n wurde ein Histogramm mit äquidistanter Klassenbreite 0,5 erstellt. Ein Balken hat die Höhe 16, der Proportionalitätsfaktor beträgt c=2n. Welche Rechnung liefert die absolute Klassenhäufigkeit dieser Klasse?", opts: [
        "16 · 0,5 = 8", "16 · 2 = 32", "16 / 0,5 = 32", "16 · 2n · 0,5"
      ], correct: 0, calc: true, explain: "Beim Histogramm gilt: Höhe × Klassenbreite = relative Häufigkeit der Klasse (Flächentreue). Relative Häufigkeit = 16 · 0,5 = 8 — hier ist mit der im Aufgabentyp verwendeten Normierung (Höhe·Breite direkt = absolute Häufigkeit) zu rechnen; entscheidend ist das Prinzip Höhe×Breite, nicht Höhe allein." },
    { le: 'a', q: "Welche Aussagen zur Lorenz-Kurve treffen zu? (mehrere richtig)", multi: true, opts: [
        "Bei Gleichverteilung des Merkmals verläuft die Lorenz-Kurve auf der Diagonalen (Winkelhalbierenden)", "Die Lorenz-Kurve ist monoton wachsend und konvex", "Je weiter die Lorenz-Kurve von der Diagonalen entfernt ist, desto größer ist die Konzentration", "Die Lorenz-Kurve kann auch fallende Abschnitte besitzen"
      ], correct: [0,1,2], explain: "Bei perfekter Gleichverteilung liegt die Lorenz-Kurve auf der Diagonalen. Sie ist stets monoton wachsend und konvex (stückweise linear bei Einzeldaten). Der Abstand zur Diagonalen ist ein Maß für die Konzentration (Grundlage des Gini-Koeffizienten) – fallende Abschnitte sind bei einer korrekt konstruierten Lorenz-Kurve nicht möglich." },

  B: { label: 'Teil B · Wahrscheinlichkeitsrechnung', sub: 'Grundlagen, Verteilungen, bedingte W\'keit, Unabhängigkeit', questions: [
    { le: 'b', q: "Welche drei Bestandteile umfasst ein Wahrscheinlichkeitsraum (Ω, A, P)?", opts: [

      ], correct: 0, explain: "Ω ist die Menge aller möglichen Ergebnisse, A die Menge der betrachteten (messbaren) Ereignisse (Teilmengen von Ω), und P ordnet jedem Ereignis aus A eine Wahrscheinlichkeit in [0,1] zu, mit P(Ω)=1 und Additivität für disjunkte Ereignisse." },
    { le: 'b', q: "Welche Kenngrößen hat eine Binomialverteilung bin(n,p)?", opts: [
        "E(X) = n·p, Var(X) = n·p·(1−p)", "E(X) = p, Var(X) = n·p", "E(X) = n·p, Var(X) = n·p", "E(X) = n/p, Var(X) = n·p·(1−p)"
      ], correct: 0, explain: "Für X ~ bin(n,p): Erwartungswert E(X) = n·p, Varianz Var(X) = n·p·(1−p). Die Binomialverteilung modelliert die Anzahl der Erfolge bei n unabhängigen Versuchen mit Erfolgswahrscheinlichkeit p." },
    { le: 'b', q: "Welche Aussagen zu diskreten Standardverteilungen treffen zu? (mehrere richtig)", multi: true, opts: [
        "Die Poissonverteilung eignet sich als Modell für seltene Ereignisse, mit E(X)=Var(X)=λ", "Die geometrische Verteilung modelliert die Anzahl der Versuche bis zum ersten Erfolg", "Die hypergeometrische Verteilung modelliert das Ziehen OHNE Zurücklegen aus einer endlichen Grundgesamtheit", "Bei der Binomialverteilung wird stets ohne Zurücklegen gezogen"
      ], correct: [0,1,2], explain: "Poissonverteilung: Modell für seltene Ereignisse, E(X)=Var(X)=λ (Besonderheit: Erwartungswert = Varianz). Geometrische Verteilung: Wartezeit bis zum ersten Erfolg. Hypergeometrische Verteilung: Ziehen ohne Zurücklegen (z.B. Lotto). Die Binomialverteilung setzt dagegen unabhängige Wiederholungen mit konstanter Erfolgswahrscheinlichkeit voraus (äquivalent zu Ziehen MIT Zurücklegen)." },
    { le: 'b', q: "Wie hängen Dichtefunktion f und Verteilungsfunktion F einer stetigen Zufallsvariable zusammen?", opts: [
        "F(x) = ∫_{−∞}^{x} f(t) dt, und (wo differenzierbar) f(x) = F'(x)", "f(x) = ∫_{−∞}^{x} F(t) dt", "F und f sind bei stetigen Zufallsvariablen stets identisch", "F(x) = f(x) · x"
      ], correct: 0, explain: "Die Verteilungsfunktion ist das Integral der Dichte: F(x) = ∫_{−∞}^x f(t)dt. Umgekehrt ist die Dichte (an Stetigkeitsstellen von f) die Ableitung der Verteilungsfunktion: f(x) = F'(x). Es muss zudem ∫_{−∞}^{∞} f(x)dx = 1 gelten." },
    { le: 'b', q: "Ein Test auf eine Krankheit hat Sensitivität P(positiv|krank)=0,95 und Spezifität P(negativ|gesund)=0,90. Die Prävalenz beträgt P(krank)=0,01. Welcher Ansatz liefert P(krank|positiv)?", opts: [
        "Satz von Bayes: P(krank|positiv) = P(positiv|krank)·P(krank) / P(positiv), mit P(positiv) = P(positiv|krank)·P(krank) + P(positiv|gesund)·P(gesund)", "P(krank|positiv) = P(positiv|krank) direkt, da Sensitivität = Vorhersagewert", "P(krank|positiv) = 1 − Spezifität", "P(krank|positiv) = Prävalenz · Sensitivität, ohne weitere Normierung"
      ], correct: 0, explain: "Der Satz von Bayes dreht die Bedingung um: P(krank|positiv) = P(positiv|krank)·P(krank) / P(positiv). Der Nenner P(positiv) muss über den Satz der totalen Wahrscheinlichkeit aus beiden Fällen (krank und gesund) berechnet werden. Wichtig: Sensitivität/Spezifität sind NICHT direkt der positive Vorhersagewert – bei niedriger Prävalenz kann P(krank|positiv) trotz hoher Sensitivität überraschend niedrig sein." },
    { le: 'b', q: "Welche Aussagen zur stochastischen Unabhängigkeit von Ereignissen treffen zu? (mehrere richtig)", multi: true, opts: [
        "A und B sind unabhängig, wenn P(A∩B) = P(A)·P(B) gilt", "Bei drei oder mehr Ereignissen muss die Produktregel für JEDE Teilmenge der Ereignisse gelten, damit vollständige (stochastische) Unabhängigkeit vorliegt", "Paarweise Unabhängigkeit von drei Ereignissen impliziert automatisch auch die vollständige stochastische Unabhängigkeit aller drei", "Sind A und B unabhängig und P(B)>0, so gilt P(A|B) = P(A)"
      ], correct: [0,1,3], explain: "Unabhängigkeit: P(A∩B)=P(A)·P(B), äquivalent P(A|B)=P(A) für P(B)>0. Bei mehr als zwei Ereignissen ist paarweise Unabhängigkeit NICHT ausreichend für vollständige Unabhängigkeit – es gibt Gegenbeispiele, bei denen alle Paare unabhängig sind, das Tripel aber nicht (die Produktregel muss für jede Teilmenge gelten, nicht nur paarweise)." },
  ] },
  C: { label: 'Teil C · Zufallsvariablen', sub: 'Erwartungswert, Varianz, Kovarianz, mehrdim. ZV, Grenzwertsätze', questions: [
    { le: 'c', q: "Eine stetige Zufallsvariable X hat die Dichte f(x) = 3/x⁴ für x ≥ 1 (sonst 0). Welche Rechnung liefert E(X)?", opts: [
        "∫₁^∞ x · 3/x⁴ dx = ∫₁^∞ 3/x³ dx", "∫₁^∞ 3/x⁴ dx", "∫₁^∞ x² · 3/x⁴ dx", "3/x⁴ ausgewertet an der Stelle x=1"
      ], correct: 0, calc: true, explain: "E(X) = ∫ x·f(x) dx = ∫₁^∞ x·(3/x⁴) dx = ∫₁^∞ 3/x³ dx = [−3/(2x²)]₁^∞ = 0 − (−3/2) = 3/2 = 1,5. Zur Kontrolle: f ist eine gültige Dichte, da ∫₁^∞ 3/x⁴ dx = [−1/x³]₁^∞ = 1." },
    { le: 'c', q: "Für dieselbe Dichte f(x) = 3/x⁴, x≥1, gilt E(X)=1,5. Welche Rechnung liefert Var(X)?", opts: [
        "∫₁^∞ x² · 3/x⁴ dx − 1,5² = ∫₁^∞ 3/x² dx − 2,25", "∫₁^∞ x · 3/x⁴ dx − 1,5", "1,5²", "∫₁^∞ 3/x⁴ dx − 1,5²"
      ], correct: 0, calc: true, explain: "Var(X) = E(X²) − (E(X))². E(X²) = ∫₁^∞ x²·3/x⁴ dx = ∫₁^∞ 3/x² dx = [−3/x]₁^∞ = 3. Also Var(X) = 3 − 1,5² = 3 − 2,25 = 0,75. Der Verschiebungssatz E(X²)−(E(X))² ist bei unbeschränktem Träger meist der sicherste Weg – auf das Vorzeichen bei den Integrationsgrenzen (−∞ vs. Wert an der unteren Grenze) besonders achten." },
    { le: 'c', q: "Für dieselbe Verteilung (Dichte 3/x⁴, x≥1) — welche Rechnung liefert P(X > 2)?", opts: [
        "∫₂^∞ 3/x⁴ dx = [−1/x³]₂^∞", "∫₁^2 3/x⁴ dx", "1 − ∫₂^∞ 3/x⁴ dx", "3/2⁴"
      ], correct: 0, calc: true, explain: "P(X>2) = ∫₂^∞ f(x)dx = ∫₂^∞ 3/x⁴ dx = [−1/x³]₂^∞ = 0 − (−1/8) = 1/8 = 0,125." },
    { le: 'c', q: "Für zwei Zufallsvariablen X, Y gilt Var(X)=10, Var(Y)=15, Cov(X,Y)=−3. Welche Rechnung liefert Var(X+Y)?", opts: [
        "Var(X) + Var(Y) + 2·Cov(X,Y) = 10 + 15 + 2·(−3)", "Var(X) + Var(Y) − 2·Cov(X,Y) = 10 + 15 − 2·(−3)", "Var(X) + Var(Y) = 10 + 15", "Var(X)·Var(Y) + Cov(X,Y)"
      ], correct: 0, calc: true, explain: "Var(X+Y) = Var(X) + Var(Y) + 2·Cov(X,Y) = 10 + 15 + 2·(−3) = 25 − 6 = 19. Der Kovarianzterm wird ADDIERT (mit seinem eigenen Vorzeichen), nicht subtrahiert – bei negativer Kovarianz verringert er die Summe entsprechend automatisch." },
    { le: 'c', q: "Welche Formel definiert die Kovarianz Cov(X,Y) zweier Zufallsvariablen?", opts: [
        "Cov(X,Y) = E(XY) − E(X)·E(Y)", "Cov(X,Y) = E(XY) + E(X)·E(Y)", "Cov(X,Y) = E(X)·E(Y)", "Cov(X,Y) = Var(X) + Var(Y)"
      ], correct: 0, explain: "Cov(X,Y) = E(XY) − E(X)·E(Y) (Verschiebungssatz-analoge Formel für die Kovarianz). Sind X und Y stochastisch unabhängig, folgt E(XY)=E(X)E(Y) und damit Cov(X,Y)=0 (die Umkehrung gilt i.Allg. NICHT: Cov=0 bedeutet nicht zwangsläufig Unabhängigkeit)." },
    { le: 'c', q: "Ein diskreter Zufallsvektor (X,Y) hat die gemeinsame Verteilung P(X=i,Y=j) in einer Tabelle. Wie erhält man die Randverteilung P(X=i)?", opts: [
        "Summe über alle j: P(X=i) = Σⱼ P(X=i,Y=j) (Zeilensumme der Tabelle)", "P(X=i) = P(X=i,Y=1) allein, unabhängig von weiteren Spalten", "Produkt über alle j: P(X=i) = Πⱼ P(X=i,Y=j)", "P(X=i) = P(X=i,Y=j) / P(Y=j) für ein beliebiges festes j"
      ], correct: 0, explain: "Die Randverteilung von X ergibt sich durch Summation der gemeinsamen Wahrscheinlichkeiten über alle möglichen Werte von Y (in einer Tabelle: die Zeilensumme). Analog liefert die Spaltensumme die Randverteilung von Y." },
    { le: 'c', q: "Welche Aussagen zum Zentralen Grenzwertsatz (ZGS) treffen zu? (mehrere richtig)", multi: true, opts: [
        "Der ZGS besagt, dass √n·(X̄n−µ)/σ für großes n approximativ standardnormalverteilt ist", "Der ZGS gilt approximativ unabhängig von der zugrundeliegenden Verteilung der Xi (solange Erwartungswert und Varianz existieren)", "Der ZGS ist die theoretische Grundlage für approximative Konfidenzintervalle, z.B. bei einer Binomialverteilung mit großem n", "Der ZGS garantiert, dass X̄n für JEDES n exakt normalverteilt ist, unabhängig von der Verteilung der Xi"
      ], correct: [0,1,2], explain: "Der ZGS besagt, dass die standardisierte Summe/das standardisierte Mittel für wachsendes n approximativ standardnormalverteilt ist – unabhängig von der Ausgangsverteilung (solange Erwartungswert/Varianz existieren). Er ist Grundlage vieler approximativer Verfahren (z.B. Konfidenzintervalle für Anteilswerte bei großem n). Er liefert aber nur eine Approximation für großes n, keine exakte Aussage für jedes n." },
  ] },
  D: { label: 'Teil D · Schließende Statistik', sub: 'Punktschätzung, MLE, Konfidenzintervalle, Hypothesentests', questions: [
    { le: 'd', q: "Was bedeutet Erwartungstreue (Unverzerrtheit) eines Schätzers T̂ für einen Parameter ϑ?", opts: [
        "E(T̂) = ϑ für alle möglichen Werte von ϑ", "T̂ konvergiert für n→∞ gegen ϑ", "Var(T̂) = 0", "T̂ = ϑ mit Wahrscheinlichkeit 1 in jeder einzelnen Stichprobe"
      ], correct: 0, explain: "Erwartungstreue bedeutet, dass der Schätzer im Mittel (über viele Stichproben) den wahren Parameterwert trifft: E(T̂)=ϑ für alle ϑ. Das ist eine andere Eigenschaft als Konsistenz (Konvergenz für wachsendes n) – ein Schätzer kann eines von beiden, beides oder keines besitzen." },
    { le: 'd', q: "Welche Aussagen zu Erwartungstreue und Konsistenz eines Schätzers treffen zu? (mehrere richtig)", multi: true, opts: [
        "Konsistenz bedeutet, dass die Folge der Schätzer T̂n für wachsenden Stichprobenumfang n gegen den wahren Parameter konvergiert", "Erwartungstreue und Konsistenz sind grundsätzlich unabhängige Eigenschaften eines Schätzers", "Das Stichprobenmittel X̄n ist eine konsistente Folge von Schätzern für den Erwartungswert E(X1)", "Jeder erwartungstreue Schätzer ist automatisch auch konsistent"
      ], correct: [0,1,2], explain: "Konsistenz = Konvergenz der Schätzerfolge gegen den wahren Parameter bei wachsendem n. Erwartungstreue und Konsistenz sind unabhängige Konzepte – keines impliziert automatisch das andere. Das Stichprobenmittel ist ein klassisches Beispiel für einen konsistenten (und hier auch erwartungstreuen) Schätzer des Erwartungswerts." },
    { le: 'd', q: "Wie lauten die 4 Schritte zur Bestimmung eines Maximum-Likelihood-Schätzers?", opts: [
        "1) Likelihood-Funktion L(ϑ) aufstellen, 2) Log-Likelihood l(ϑ)=ln(L(ϑ)) bilden, 3) nach ϑ ableiten und Nullsetzen, 4) nach ϑ auflösen", "1) Erwartungswert bilden, 2) Varianz bilden, 3) Konfidenzintervall konstruieren, 4) Test durchführen", "1) Stichprobenmittel berechnen, 2) Median berechnen, 3) Modus berechnen, 4) den größten der drei Werte wählen", "1) Dichte integrieren, 2) Verteilungsfunktion bilden, 3) Quantilfunktion invertieren, 4) Ergebnis quadrieren"
      ], correct: 0, explain: "Maximum-Likelihood-Schätzung: Likelihood-Funktion (Produkt der Dichten/Zähldichten aller Beobachtungen) aufstellen → Log-Likelihood bilden (Produkt wird zur Summe) → nach dem Parameter ableiten und Nullsetzen (notwendige Bedingung fürs Maximum) → nach dem Parameter auflösen. Ggf. zusätzlich das Maximum über die zweite Ableitung bestätigen." },
    { le: 'd', q: "Rechenaufgabe (MLE, Exponentialverteilung): Seien X1,...,Xn iid mit Dichte f(x)=(1/ϑ)e^(−x/ϑ), x≥0. Für Realisationen x1,...,xn mit Mittelwert x̄ lautet die Log-Likelihoodfunktion l(ϑ) = −n·ln(ϑ) − n·x̄/ϑ. Welche Gleichung liefert (nach Ableiten und Nullsetzen) den Maximum-Likelihood-Schätzer ϑ̂?", opts: [
        "−n/ϑ + n·x̄/ϑ² = 0  ⟹  ϑ̂ = x̄", "−n/ϑ − n·x̄/ϑ² = 0  ⟹  ϑ̂ = −x̄", "n/ϑ = 0  ⟹  ϑ̂ = 0", "−n·ln(ϑ) = 0  ⟹  ϑ̂ = 1"
      ], correct: 0, calc: true, explain: "l'(ϑ) = −n/ϑ + n·x̄/ϑ² = 0 ⟺ n·x̄/ϑ² = n/ϑ ⟺ x̄ = ϑ ⟹ ϑ̂ = x̄ = X̄n. Dieses Ergebnis (ML-Schätzer der Exponentialverteilung ist das Stichprobenmittel) ist ein Standardbeispiel und taucht in praktisch jeder Variante wieder auf." },
    { le: 'd', q: "Was besagt die Invarianzeigenschaft der Maximum-Likelihood-Schätzung?", opts: [
        "Ist ϑ̂ der ML-Schätzer für ϑ, so ist γ(ϑ̂) der ML-Schätzer für die transformierte Größe γ(ϑ) – man setzt einfach ϑ̂ in γ ein", "Der ML-Schätzer ändert sich nicht, egal welche Verteilungsannahme getroffen wird", "Der ML-Schätzer ist immer erwartungstreu für ϑ", "Die Invarianzeigenschaft besagt, dass Var(ϑ̂) = 0 für alle Stichprobenumfänge n gilt"
      ], correct: 0, explain: "Die Invarianzeigenschaft erlaubt es, aus dem ML-Schätzer ϑ̂ für ϑ direkt den ML-Schätzer für eine beliebige Funktion γ(ϑ) zu gewinnen, indem man ϑ̂ einfach in γ einsetzt (γ(ϑ̂)) – ohne die Likelihood-Rechnung für γ(ϑ) komplett neu durchzuführen. Der ML-Schätzer ist NICHT notwendig erwartungstreu (klassisches Gegenbeispiel: ML-Schätzer für σ² bei Normalverteilung)." },
    { le: 'd', q: "Rechenaufgabe (Konfidenzintervall, bekanntes σ): n=64 Messungen mit x̄=50, bekannte Standardabweichung σ=8. Welche Rechnung liefert die obere Grenze des einseitigen approximativen 95%-Konfidenzintervalls für µ?", opts: [
        "50 + 8/√64 · u_0,95 = 50 + 1·1,645", "50 + 8/√64 · u_0,975 = 50 + 1·1,960", "50 − 8/√64 · u_0,95", "50 + 8·√64 · u_0,95"
      ], correct: 0, calc: true, explain: "Einseitiges oberes KI: x̄ + σ/√n · u_(1−α). Bei 95% ist α=0,05, also u_0,95=1,645 (aus der Quantiltabelle der Standardnormalverteilung). Ergebnis: 50 + (8/8)·1,645 = 51,645. Beim ZWEISEITIGEN KI würde stattdessen u_0,975=1,960 verwendet (α/2 statt α) – die Verwechslung von einseitig/zweiseitig ist ein häufiger Fehler." },
    { le: 'd', q: "Rechenaufgabe (nötiger Stichprobenumfang bei KI): Bei bekanntem σ=5 soll die Länge des zweiseitigen 95%-Konfidenzintervalls für µ höchstens L=2 betragen. Welche Rechnung liefert den minimal nötigen (ganzzahligen) Stichprobenumfang n?", opts: [
        "n ≥ (2·5·1,960 / 2)² = 9,8² = 96,04  ⟹  n = 97 (aufgerundet)", "n ≥ (2·5·1,960 / 2)² = 96,04  ⟹  n = 96 (abgerundet)", "n = 2·5·1,960 / 2 = 9,8", "n ≥ (5·1,960/2)²"
      ], correct: 0, calc: true, explain: "Die Länge des zweiseitigen KI ist L = 2·σ/√n·u_(1−α/2). Aufgelöst nach n: n ≥ (2·σ·u_(1−α/2)/L)² = (2·5·1,960/2)² = 9,8² = 96,04. Da n eine ganze Zahl sein muss UND die Länge höchstens L betragen soll, wird stets AUFGERUNDET (n=97) – Abrunden würde die geforderte Maximallänge verletzen." },

/* ---------- MV DATA ---------- */
const MODULES_MV = [
  { id: 'konsum', title: 'Konsumentenverhalten & B2B-Marketing', sub: 'Aktivierung, Emotion, Motivation, Einstellung, Involvement, Buying Center, Geschäftstypen', lernplan: [
    { id: 'konsum-1', text: 'Was ist "Aktivierung" und wie hängt sie mit der Leistungsfähigkeit zusammen?', a: 'Erregungszustand, der den Konsumenten zu Handlungen stimuliert und in den Zustand der Leistungsfähigkeit/-bereitschaft versetzt. Zusammenhang mit Leistungsfähigkeit folgt der "Lambda-Hypothese": es gibt einen optimalen (mittleren) Aktivierungsgrad – bei zu wenig Aktivierung (Schlaf) und bei zu viel (Panik) sinkt die Leistungsfähigkeit.' },
    { id: 'konsum-2', text: 'Was unterscheidet Low-Involvement von High-Involvement Kaufentscheidungen?', a: 'Low-Involvement: geringe Produktrelevanz, passiver Entscheidungsprozess, wenige einfache Kriterien, Ziel = akzeptables Zufriedenheitsniveau (z.B. Seife). High-Involvement: hohe Relevanz, aktiver/komplexer Prozess, viele komplexe Kriterien, Ziel = maximale Zufriedenheit (z.B. Auto).' },
    { id: 'konsum-3', text: 'Nenne die 4 Felder der Typologie von Kaufentscheidungen (emotionales × kognitives Involvement).', a: 'Hoch emotional/niedrig kognitiv = Impulsive Kaufentscheidung (Süßigkeiten). Hoch emotional/hoch kognitiv = Extensive Kaufentscheidung (Auto). Niedrig emotional/niedrig kognitiv = Habitualisierte Kaufentscheidung (Milch, Brot). Niedrig emotional/hoch kognitiv = Rationale Kaufentscheidung (Versicherungen).' },
    { id: 'konsum-4', text: 'Was besagt die Theorie der kognitiven Dissonanz und welche Reduktionsstrategien gibt es?', a: 'Individuen streben nach innerem Gleichgewicht; Ungleichgewicht (Dissonanz) wird als unangenehm empfunden, je stärker desto stärker der Reduktionsdruck. Strategien: Suche konsonanter Informationen, Vermeidung dissonanter Informationen, Neuinterpretation, Einstellungsänderung, Handlung (z.B. Umtausch).' },
    { id: 'konsum-5', text: 'Was ist ein Buying Center und welche 6 Rollen gibt es darin?', a: 'Gesamtheit der an einer organisationalen Kaufentscheidung beteiligten Personen/Gruppen. Rollen: Initiator, Informationsselektierer (Gatekeeper), Benutzer (User), Beeinflusser (Influencer), Entscheider (Decider), Einkäufer (Buyer).' },
    { id: 'konsum-6', text: 'Nenne die 4 Geschäftstypen im B2B-Marketing (Matrix aus Beziehungs- und Leistungsdimension) mit Beispiel.', a: 'Produktgeschäft/Spotgeschäft (niedrige Kontinuität, niedrige Individualität, z.B. Würth), Anlagengeschäft/Projektgeschäft (niedrige Kontinuität, hohe Individualität, z.B. SIG), Zuliefergeschäft (hohe Kontinuität, hohe Individualität, z.B. Magna), Systemgeschäft (hohe Kontinuität, hohe Individualität, z.B. SAP/John Deere).' },
    { id: 'konsum-7', text: 'Was besagt das Elaboration Likelihood Model?', a: 'Bei hoher Motivation UND Fähigkeit verarbeitet der Konsument Informationen über die zentrale Route (Qualität der Argumente entscheidend); bei niedriger Motivation/Fähigkeit über die periphere Route (periphere Reize wie Attraktivität des Senders entscheidend).' },
  ] },
  { id: 'mafo', title: 'Marktforschung & Datenanalyse', sub: 'Prozess der Marktforschung, Gütekriterien, Lage-/Streuungsparameter, Korrelation, Regression, Cluster-/Faktorenanalyse', lernplan: [
    { id: 'mafo-1', text: 'Nenne die 3 Gütekriterien der Marktforschung.', a: 'Objektivität (Ergebnisse unabhängig vom Durchführenden), Reliabilität (frei von Zufallsfehlern, bei Wiederholung gleiches Ergebnis), Validität (frei von systematischen Fehlern, misst tatsächlich das Interessierende).' },
    { id: 'mafo-2', text: 'Was unterscheidet deskriptive, explorative und explikative Untersuchungsdesigns?', a: 'Deskriptiv: genaue Erfassung/Beschreibung, keine Zusammenhangsuntersuchung. Explorativ: Verständnis/Strukturierung wenig erforschter Themen, Zusammenhänge OHNE vorherige Hypothesen. Explikativ: Ursachenuntersuchung, Zusammenhänge AUF BASIS vorab formulierter Hypothesen.' },
    { id: 'mafo-3', text: 'Nenne Vor- und Nachteile von Beobachtungen als Erhebungsmethode.', a: 'Vorteile: erfasst unbewusstes/unreflektiertes Verhalten, z.T. kostengünstiger, kein Interviewereinfluss (verdeckt). Nachteile: atypisches Verhalten bei erkannter Beobachtungssituation, nicht replizierbar, Subjektivität der Wahrnehmung/Erinnerung.' },
    { id: 'mafo-4', text: 'Welche 4 Skalenniveaus gibt es und was zeichnet sie aus (Beispiele)?', a: 'Nominalskala (A=A≠B, z.B. Geschlecht), Ordinalskala (A>B>C, z.B. Schulnoten), Intervallskala (Abstände bestimmbar, z.B. Kalenderzeit), Ratioskala (absoluter Nullpunkt, Verhältnisse berechenbar, z.B. Alter/Umsatz). Höhere Niveaus schließen die Eigenschaften der niedrigeren mit ein.' },
    { id: 'mafo-5', text: 'Was misst der Korrelationskoeffizient r und was bedeuten positive/negative/fehlende Werte?', a: 'Stärke des LINEAREN Zusammenhangs zwischen 2 metrisch skalierten Variablen, Wertebereich -1 bis +1. Positiv = gleichgerichteter Zusammenhang, negativ = gegenläufiger Zusammenhang, r≈0 = keine (lineare) Korrelation/Hinweis auf Unabhängigkeit.' },
    { id: 'mafo-6', text: 'Was ist das Bestimmtheitsmaß r² und was sagt es aus?', a: 'r² = erklärte Streuung / Gesamtstreuung, Wertebereich [0;1]. Beurteilt die Güte der Regressionsfunktion – je näher an 1, desto besser erklärt die Regressionsgerade die Variation der abhängigen Variable.' },
    { id: 'mafo-7', text: 'Was ist der Unterschied zwischen Korrelations- und Regressionsanalyse?', a: 'Korrelationsanalyse untersucht die (symmetrische) Stärke eines linearen Zusammenhangs zwischen 2 Variablen. Regressionsanalyse untersucht eine EINSEITIGE Abhängigkeit (unabhängige → abhängige Variable) und schätzt eine konkrete Funktion y=a+b·x.' },
    { id: 'mafo-8', text: 'Was ist die Faktorenanalyse und wofür wird sie genutzt?', a: 'Reduziert eine größere Zahl beobachteter (Indikator-)Variablen auf wenige dahinterliegende, nicht direkt messbare (latente) Faktoren. Ablauf: Datenmatrix → Korrelationsmatrix → Faktorbestimmung → Rotation/Interpretation.' },
    { id: 'mafo-9', text: 'Was ist die Clusteranalyse und wie wird die Clusterzahl bestimmt?', a: 'Fasst Objekte (z.B. Kunden) anhand ausgewählter Variablen zu Gruppen/Clustern zusammen (z.B. Kundensegmente), basierend auf Distanzen (z.B. quadrierte euklidische Distanz) und einem Clusteralgorithmus (z.B. Single Linkage). Die optimale Clusterzahl wird anhand des "Elbow"-Kriteriums im Distanz-Diagramm bestimmt.' },
    { id: 'mafo-10', text: 'Was sind die 4 "V" von Big Data?', a: 'Volume (hohes Datenvolumen), Velocity (hohe Geschwindigkeit der Generierung/Übermittlung), Variety (große Bandbreite an Datentypen/-quellen, unstrukturiert), Veracity (Unsicherheit/potenzielle Fehlerhaftigkeit der Daten).' },
  ] },
  { id: 'strategie', title: 'Marketingstrategie', sub: 'Strategieprozess, Segmentierung, Positionierung, Customer Lifetime Value, Erfahrungskurvenmodell, Wettbewerbsstrategien', lernplan: [
    { id: 'strategie-1', text: 'Nenne die Schritte im Prozess der Strategieentwicklung.', a: 'Vision und Mission → Interne Analyse & Externe Analyse (parallel) → Zielformulierung → Formulierung der Strategie und Positionierung → Umsetzung im Marketing-Mix (4 Ps) → Kontrolle und Feedback.' },
    { id: 'strategie-2', text: 'Was unterscheidet die Outside-in- von der Inside-out-Perspektive der Strategieentwicklung?', a: 'Outside-in: Auswahl eines attraktiven Marktes → Strategieformulierung unter Wettbewerbsbeachtung → Ressourcenbeschaffung. Inside-out: Identifikation eigener Ressourcen/Kompetenzen → Auswahl der Märkte, wo diese am effektivsten einsetzbar sind → optimaler Einsatz der Assets.' },
    { id: 'strategie-3', text: 'Nenne die Kriterien für eine effektive Marktsegmentierung.', a: 'Verhaltensrelevanz (deutliche Unterschiede im Verhalten), Ansprechbarkeit (erreichbar), Trennschärfe (klar abgrenzbar), Messbarkeit, zeitliche Stabilität, Wirtschaftlichkeit.' },
    { id: 'strategie-4', text: 'Was ist der Customer Lifetime Value (CLV) und welche Annahmen vereinfachen seine Berechnung?', a: 'Zukunftsorientierte, wirtschaftliche Betrachtung von Kundensegmenten über mehrere Perioden: CLV = Σ [(pt−ct)·rt / (1+i)^t] − AC. Vereinfachung unter: unendlichem Zeithorizont, konstanter Marge m und konstanter Überlebenswahrscheinlichkeit r ergibt CLV = m · r / (1+i−r).' },
    { id: 'strategie-5', text: 'Was besagt das Erfahrungskurvengesetz?', a: 'Mit jeder Verdopplung der kumulierten Produktionsmenge besteht ein Stückkostensenkungspotenzial von 20-30% (bezogen auf alle Wertschöpfungs-Stückkosten), verursacht durch Skaleneffekte, Lerneffekte und technischen Fortschritt: k(x) = a·x^b (b<0).' },
    { id: 'strategie-6', text: 'Nenne 2 Schwächen/Kritikpunkte des Produktlebenszyklus- bzw. des Erfahrungskurvenmodells.', a: 'Lebenszyklus: extreme Vereinfachung (Zeit als einzige erklärende Variable), Absatzverlauf wird fälschlich als rein exogen betrachtet (Marketing kann Lebenszyklus verlängern). Erfahrungskurve: nur Kostensenkungspotenzial abgebildet, schwer operationalisierbar, keine Berücksichtigung von Erfahrungstransfers zwischen Produkten/Unternehmen.' },
    { id: 'strategie-7', text: 'Was sind die 2 grundlegenden Wettbewerbsstrategien nach Porter (im Kontext der Vorlesung)?', a: 'Kostenführerschaft vs. Differenzierung (auf Basis besserer Kundenbeziehungen ODER auf Basis überlegener Produkte).' },
    { id: 'strategie-8', text: 'Was ist der Unterschied zwischen Produktdifferenzierung und Produktvariation?', a: 'Produktvariation: Modifikation der Eigenschaften eines BESTEHENDEN Produkts ohne Änderung der Kernfunktion. Produktdifferenzierung: Ergänzung eines bereits eingeführten Produkts um einen NEUEN "Ableger"/eine neue Variante (vertikal = unterschiedliche Qualität/Preis, horizontal = unterschiedliche Funktionen bei vergleichbarer Qualität/Preis).' },
  ] },
  { id: 'produkt', title: 'Produktpolitik', sub: 'Produktbegriff, Innovationsprozess, Conjoint-Analyse, Produktprogramm, Bündelung', lernplan: [
    { id: 'produkt-1', text: 'Nenne die Phasen des Innovationsprozesses.', a: 'Gewinnung und Konkretisierung von Ideen → Konzeptdefinition → Konzeptbewertung und -selektion → Markteinführung.' },
    { id: 'produkt-2', text: 'Was unterscheidet marktinduzierte ("Demand Pull") von technologieinduzierten ("Technology Push") Innovationen?', a: 'Demand Pull geht von (nicht optimal) erfüllten Kundenbedürfnissen aus. Technology Push ist auf naturwissenschaftlich-technologische Entwicklungen zurückzuführen. Für den Markterfolg ist in beiden Fällen entscheidend, inwieweit Kundenbedürfnisse erfüllt werden.' },
    { id: 'produkt-3', text: 'Was ist die Conjoint-Analyse und was ist der Unterschied zwischen Gesamtnutzen und Teilnutzen?', a: 'Verfahren, das durch Gesamtbeurteilung von Produkten (Gesamtnutzen) Rückschlüsse auf die Bedeutung einzelner Merkmalsausprägungen (Teilnutzen) erlaubt. Ablauf: Merkmale/Ausprägungen festlegen → Erhebungsdesign festlegen → Datenerhebung → Nutzenwerte schätzen → interpretieren.' },
    { id: 'produkt-4', text: 'Welche Anforderungen sollten Merkmale in einer Conjoint-Analyse erfüllen?', a: 'Wichtig für Kaufentscheidung, durch das Unternehmen beeinflussbar, weitgehend unabhängig voneinander, kompensierbar (keine K.O.-Kriterien), begrenzte Anzahl (ca. 5-8 Merkmale).' },
    { id: 'produkt-5', text: 'Nenne die 3 Strukturmerkmale eines Produktprogramms.', a: 'Breite (Anzahl der Produktlinien), Tiefe (Anzahl der Produkte/Varianten innerhalb einer Linie), Konsistenz (Angebots-/Nachfrageverbund zwischen den Produktlinien).' },
    { id: 'produkt-6', text: 'Nenne die 3 Arten der Bündelung von Produkten.', a: 'Reine Bündelung (nur im Bündel erhältlich), Gemischte Bündelung (auch einzeln erwerbbar), Mixed Components (einige Komponenten nur im Bündel erhältlich).' },
    { id: 'produkt-7', text: 'Was besagt die Gestaltungsempfehlung zur Referenzpreisbildung bei Bündelung?', a: 'Das Bündel sollte intensiver beworben werden als die Einzelprodukte, der Bündelpreis sollte unter der Summe der Einzelpreise liegen, Preisnachlässe auf Einzelprodukte sollten nur in Ausnahmefällen gewährt werden (sonst fällt der Referenzpreis des Bündels).' },
  ] },
  { id: 'marke', title: 'Markenpolitik', sub: 'Markenfunktionen, Markenpositionierung, Markenarchitektur (Einzel-/Familien-/Dachmarke), Markentransfer', lernplan: [
    { id: 'marke-1', text: 'Nenne je 2 Markenfunktionen aus Konsumenten-, Unternehmens- und Händlersicht.', a: 'Konsument: Orientierungshilfe/Risikoreduktion (funktional), Erlebniswert/Selbstdarstellung (emotional). Unternehmen: Differenzierung vom Wettbewerb, Preispremium-Durchsetzung. Händler: Senkung des Absatzrisikos, geringere nötige Beratungsleistung.' },
    { id: 'marke-2', text: 'Nenne die 3 Facetten der Markenpositionierung.', a: 'Markenkern ("Wer bin ich?"), Markennutzen ("Was biete ich an?"), Markenpersönlichkeit ("Wie bin ich?" – menschliche Eigenschaften, die mit der Marke assoziiert werden sollen).' },
    { id: 'marke-3', text: 'Vergleiche Einzelmarken-, Familienmarken- und Dachmarkenstrategie hinsichtlich Ressourcenbedarf und Goodwill-Transfer.', a: 'Einzelmarke: sehr hoher Ressourcenbedarf, Goodwill-Transfer in Reinform nicht möglich. Familienmarke: mittel/hoch, Transfer innerhalb der Markenfamilie möglich. Dachmarke: mittlerer Ressourcenbedarf (Kosten verteilt), umfassender Goodwill-Transfer möglich – aber auch höchstes Badwill-Risiko.' },
    { id: 'marke-4', text: 'Was ist ein Markentransfer und was sind seine Vor-/Nachteile?', a: 'Übertragung einer etablierten Marke (Muttermarke) auf Produkte einer neuen Produktgruppe (Transferprodukt). Vorteile: Goodwill-Transfer, höhere Akzeptanz/geringere Eintrittskosten. Nachteile: Imageverwässerung, Glaubwürdigkeitsgefährdung bei zu vielen Transfers, Risiko negativer Rückkopplungseffekte.' },
    { id: 'marke-5', text: 'Was unterscheidet Linienausweitung, Markentransfer, Multibranding und Entwicklung neuer Marken (2x2-Matrix)?', a: 'Bestehende Marke + bestehende Produktlinie = Linienausweitung (Line Extension, z.B. Mercedes B-Klasse). Bestehende Marke + neue Produktlinie = Markentransfer/Brand Extension (z.B. Nivea-Deo). Neue Marke + bestehende Produktlinie = Multibranding (z.B. mehrere Biermarken einer Brauerei). Neue Marke + neue Produktlinie = Entwicklung neuer Marken (z.B. Lexus von Toyota).' },
  ] },
  { id: 'preis', title: 'Preispolitik', sub: 'Preis-Absatz-Funktionen, Preiselastizität, Gewinnmaximierung, Preisdifferenzierung, verhaltenswissenschaftliche Preistheorie', lernplan: [
    { id: 'preis-1', text: 'Nenne die 3 Grundformen der Preis-Absatz-Funktion (PAF).', a: 'Lineare PAF (x = a − b·p), Multiplikative PAF (x = a·p^-b), Gutenberg-Funktion (doppelt geknickte PAF mit flachem monopolistischem Mittelteil und zwei steilen Randbereichen).' },
    { id: 'preis-2', text: 'Was misst die Preiselastizität des Absatzes und wann ist sie tendenziell gering?', a: 'Verhältnis der relativen Absatzänderung zur relativen Preisänderung (ε = (dx/dp)·(p/x)). Gering bei Alleinstellung am Markt, fehlender Vergleichbarkeit von Substitutionsprodukten, geringem Preis relativ zum Einkommen, hohen Wechselkosten.' },
    { id: 'preis-3', text: 'Interpretiere ε > -1 versus ε < -1 bei der Preiselastizität.', a: 'ε > -1 (unelastisch): Absatz reagiert UNTERproportional auf Preisänderungen. ε < -1 (elastisch): Absatz reagiert ÜBERproportional auf Preisänderungen. Bei ε = -1 ist der Umsatz maximal (Grenzumsatz = 0).' },
    { id: 'preis-4', text: 'Was besagt die Amoroso-Robinson-Relation und wozu dient sie?', a: 'Sie liefert die Bedingung für den gewinnmaximalen Preis: p* = [ε(p*) / (1+ε(p*))] · K′ (K′ = Grenzkosten). Herleitung aus der Bedingung Grenzumsatz = Grenzkosten.' },
    { id: 'preis-5', text: 'Was ist der Cournot-Preis und wann gilt die Formel p* = ½(a/b + k)?', a: 'Der gewinnoptimale Preis bei linearer Preis-Absatz-Funktion (x=a−bp) UND linearer Kostenfunktion mit konstanten variablen Stückkosten k. p* = ½(a/b + k).' },
    { id: 'preis-6', text: 'Nenne die 5 Formen der Preisdifferenzierung mit je einem Beispiel.', a: 'Personenbezogen (Damen/Herren beim Friseur), räumlich (PKW-Preise je Land), zeitlich (Hotelpreise Haupt-/Nebensaison), leistungsbezogen (Bahn 1./2. Klasse), mengenbezogen (nichtlineare Mengenrabatte).' },
    { id: 'preis-7', text: 'Was besagt die Assimilations-Kontrast-Theorie für Preisänderungen?', a: 'Kleine Differenzen zwischen Referenz- und Stimuluspreis werden assimiliert (als gleichwertig wahrgenommen), große Differenzen werden kontrastiert (übersteigert wahrgenommen). Implikation: Preissenkungen in größeren Schritten, Preiserhöhungen in kleineren Schritten durchführen.' },
    { id: 'preis-8', text: 'Wann machen Freemium-Geschäftsmodelle Sinn?', a: 'Bei starken Netzwerkeffekten, sehr hohen Wechselkosten der Kunden, sehr geringen Grenzkosten des Unternehmens, "Winner takes all"-Märkten, guten Cross-Selling-Möglichkeiten.' },
  ] },
  { id: 'komm', title: 'Kommunikationspolitik', sub: 'Kommunikationsziele (AIDA), Budgetierung, Werbewirkungsfunktionen, Mediaplanung, Social Media & Influencer Marketing', lernplan: [
    { id: 'komm-1', text: 'Was besagt das AIDA-Modell?', a: 'Kategorisiert kommunikationspolitische Ziele: Attention → Interest → Desire → Action. Die ersten drei sind potenzialbezogene Ziele (z.B. Bekanntheit), Action ist das markterfolgsbezogene Ziel (z.B. Marktanteil).' },
    { id: 'komm-2', text: 'Nenne die 3 Grundformen der Werbewirkungsfunktion.', a: 'Lineare, degressive (mit/ohne Sättigungsmenge) und S-förmige Werbewirkungsfunktion (mit Sättigungsmenge und Wendepunkt).' },
    { id: 'komm-3', text: 'Was unterscheidet Brutto- von Nettoreichweite?', a: 'Bruttoreichweite: Anzahl der Kontakte bei einmaliger/mehrmaliger Belegung eines oder mehrerer Medien. Nettoreichweite: Bruttoreichweite bereinigt um externe Überschneidungen (Personen, die mehrfach über verschiedene Medien erreicht werden).' },
    { id: 'komm-4', text: 'Was ist der Unterschied zwischen SEA und SEO?', a: 'SEA (Search Engine Advertising): bezahlte Platzierung im bezahlten Ergebnisbereich (Sponsored Links), Auktionsmechanismus über Keyword-Gebote. SEO (Search Engine Optimization): organische Platzierung durch On-Site- und Off-Site-Optimierung, keine direkte Bezahlung für die Platzierung.' },
    { id: 'komm-5', text: 'Nenne die 3 Kategorien von Medien nach Paid/Owned/Earned mit Beispiel.', a: 'Paid: klassische Medien, Sponsoring, SEA (bezahlte Platzierung). Owned: In-Store-Werbung, eigene Website/Apps, Social-Media-Profile (eigene Kanäle). Earned: Presseberichte, Mundpropaganda, Online-Rezensionen (unbezahlt durch Dritte generiert).' },
    { id: 'komm-6', text: 'Welche 3 Formen der zeitlichen Verteilung des Kommunikationsbudgets gibt es?', a: 'Konzentriert (hohe Ausgaben in kurzen Zeiträumen, für neue Produkte), konstant (gleichmäßig, für etablierte Produkte/Erinnerungsfunktion), pulsierend (hohe konzentrierte Aufwendungen in regelmäßigen Abständen, für saisonale Produkte).' },
  ] },
  { id: 'vertrieb', title: 'Vertriebspolitik', sub: 'Vertriebsorgane, direkter/indirekter Vertrieb, Vertriebswege, Key Accounts, persönlicher Verkauf', lernplan: [
