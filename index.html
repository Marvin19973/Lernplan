const MODULES_PUO = [
  { id: 'c1', title: 'Kap. 1 · Grundlagen der Organisation', sub: 'Organisationsprobleme, Koordinations-/Kooperationsspiele, Organisationsbegriffe, -theorien', lernplan: [
    { id: 'c1-1', text: "Was sind die 2 grundlegenden Organisationsprobleme und wie unterscheiden sie sich?", a: 'Koordinationsproblem: Überwindung des Nichtwissens, was zu tun ist. Kooperationsproblem (Motivationsproblem): Überwindung des Nichtwollens, Realisierung anreizkompatibler Lösungen.' },
    { id: 'c1-2', text: "Nenne 4 Merkmale von Koordinationssituationen.", a: 'Gleichzeitige Handlungen mehrerer Akteure, interdependente Entscheidungen, keine/geringe Zielkonflikte, Mehrdeutigkeit (2 mögliche Fehler: Koordination kommt nicht zustande, oder Ergebnis ist suboptimal).' },
    { id: 'c1-3', text: "Was unterscheidet Koordinations- von Kooperationsspielen (Zielkonflikt, Lösung)?", a: 'Koordinationsspiele: keine/geringe Interessendivergenzen, meist 2 Nash-Gleichgewichte, lösbar ohne schwerwiegende Eingriffe. Kooperationsspiele (z.B. Gefangenendilemma): ausgeprägte Interessendivergenzen (Free-Rider), 1 pareto-inferiores Nash-Gleichgewicht, starke organisatorische Eingriffe nötig.' },
    { id: 'c1-4', text: "Was unterscheidet den instrumentellen vom institutionellen Organisationsbegriff?", a: 'Instrumentell: Organisation als Gegenmittel für Koordinations-/Motivationsprobleme ("Die Unternehmung HAT eine Organisation"). Institutionell: Organisation als regelgebundenes soziales System zur Zielerreichung ("Die Unternehmung IST eine Organisation").' },
    { id: 'c1-5', text: "Nenne die Definition von Organisationen nach Kieser/Kubicek (1992).", a: 'Organisationen sind soziale Gebilde, die dauerhaft ein Ziel verfolgen und eine formale Struktur aufweisen, mit deren Hilfe Aktivitäten der Mitglieder auf das verfolgte Ziel ausgerichtet werden.' },
    { id: 'c1-6', text: "Nenne 4 Organisationstheorien (Auswahl) mit ihrem jeweiligen Kernfokus.", a: 'Webers Bürokratie-Analyse (Arbeitsteilung/Hierarchie/Dienstwege), Taylorismus/Managementlehre (Zeit-/Bewegungsstudien), Human-Relations-Bewegung (Zufriedenheit/Motivation), Verhaltenswissenschaftliche Entscheidungslehre (Barnard/March/Simon, Koordination individueller Entscheidungen).' },
    { id: 'c1-7', text: "Warum kann der neoklassische Ansatz reale Organisationen nicht erklären?", a: 'Modellannahmen (vollkommener Wettbewerb, vollkommene Information, unbegrenzte Teilbarkeit, keine Mobilitätskosten) sind unrealistisch; im Gleichgewicht (P=GK) entstehen keine "übermäßigen" Gewinne und keine Notwendigkeit für Organisationen als Koordinationsform neben dem Markt.' },
  ] },
  { id: 'c2', title: 'Kap. 2 · Neue Institutionenökonomik', sub: 'Transaktionskosten, Hold-up-Problem, Verfügungsrechte, Skalenerträge, Prinzipal-Agenten-Theorie/LEN-Modell', lernplan: [
    { id: 'c2-1', text: "Nenne die 5 Marktfehler, die die Existenz von Organisationen begründen.", a: 'Positive Informationskosten (TAK), Hold-up-Problem, Externe Effekte, Steigende Skalenerträge, Asymmetrische Informationsverteilungen (ASIV).' },
    { id: 'c2-2', text: "Nenne die 5 Arten externer Transaktionskosten.", a: 'Anbahnungskosten (Partnersuche), Vereinbarungskosten (Verhandlungen), Kontrollkosten (Qualitätsprüfung), Durchsetzungskosten (Gericht), Anpassungskosten (Nachverhandlungen).' },
    { id: 'c2-3', text: "Wann lohnt sich die Internalisierung einer Transaktion (Organisation statt Markt)?", a: 'Wenn die internen TAK geringer sind als die externen TAK, die bei Marktnutzung anfallen würden (interne TAK < externe TAK).' },
    { id: 'c2-4', text: "Was ist die Quasi-Rente und wie hängt sie mit dem Hold-up-Problem zusammen?", a: 'Quasi-Rente = Differenz zwischen dem Wert einer Investition in der aktuellen Verwendung und dem Wert in der nächstbesten Verwendung. Bei transaktionsspezifischen Investitionen ist der Investor in Höhe der Quasi-Rente ausbeutbar (Hold-up-Gefahr) – Organisationen (vertikale Integration) entstehen zur Antizipation von Unterinvestitionsproblemen.' },
    { id: 'c2-5', text: "Was besagt das 'Trauerspiel der Allmende' im Kontext von Verfügungsrechten?", a: 'Bei Gemeinschaftsrechten (kein Privateigentum) übernutzen Akteure gemeinsame Ressourcen, da sie den vollen Ertrag ihrer Nutzung erhalten, aber die Kosten der Übernutzung auf alle verteilt sind – Privateigentum maximiert dagegen das Gesamtvermögen.' },
    { id: 'c2-6', text: "Was unterscheidet Hidden Action von Hidden Information (Folgeproblem, Beispiel)?", a: 'Hidden Action: Agent hat unbeobachtbare Handlungsalternativen → Moral Hazard (z.B. Shirking, AN hält Leistungsanstrengung zurück). Hidden Information: Agent hat unbeobachtbare Charakteristika/Zustände → Adverse Selection (z.B. Verkäufer kennt Mängel des Gebrauchtwagens).' },
    { id: 'c2-7', text: "Welche Lösungsansätze gibt es für Hidden Action bzw. Hidden Information?", a: 'Hidden Action/Moral Hazard: erfolgsabhängige Entlohnung (LEN-Modell). Hidden Information/Adverse Selection: Signaling (durch die besser informierte Seite) und Screening (durch die schlechter informierte Seite).' },
    { id: 'c2-8', text: "Erkläre den grundlegenden Trade-off im LEN-Modell.", a: 'Trade-off zwischen Anreizgestaltung (hoher Beteiligungsparameter β motiviert Arbeitsanstrengung e) und effizienter Risikoverteilung (hohes β wälzt mehr Produktionsrisiko θ auf den risikoaversen Agenten ab). Hidden Action führt zu Wohlfahrtsverlusten (Agency-Kosten) verglichen mit der First-best-Lösung (β=0, e beobachtbar).' },
  ] },
  { id: 'c3', title: 'Kap. 3 · Organisations- und Unternehmensformen', sub: 'Publikumsgesellschaft, Einzelunternehmung, Partnerschaften, Genossenschaften, Franchising, Netzwerke', lernplan: [
    { id: 'c3-1', text: "Was ist das zentrale Zielkonfliktproblem der Publikumsgesellschaft (Prinzipal/Agent)?", a: 'Trennung von Eigentum und Unternehmensführung: Anteilseigner (Prinzipal) wollen Shareholder Value maximieren, Top-Management (Agent) hat u.U. andere Interessen (individuelle Nutzenmaximierer, z.B. Umsatz/Wachstum/Konsuminvestitionen statt Gewinn).' },
    { id: 'c3-2', text: "Vergleiche die Modelle von Baumol (1959) und Marris (1963) zum Managerverhalten.", a: 'Baumol: Manager maximieren Umsatz/Unternehmensgröße statt Gewinn (Mindestgewinn als Nebenbedingung). Marris: Manager maximieren die Wachstumsrate des Unternehmens (dynamische Variante, Vermeidung des Konkurses als Nebenbedingung).' },
    { id: 'c3-3', text: "Was zeigt das Williamson-Modell (1963) zur Größe des Mitarbeiterstabs?", a: 'Manager haben Präferenzen für Investitionen mit Konsumcharakter und wählen eine größere Belegschaft S als die Anteilseigner wünschen würden – die Differenz der diskretionären Gewinne ΠD(SB)-ΠD(SA) = Π(SB)-Π(SA) sind die entstehenden Agency-Kosten.' },
    { id: 'c3-4', text: "Warum hat die Einzelunternehmung keine Managementprobleme, aber eine begrenzte Verbreitung?", a: 'Keine Trennung von Eigentum und Kontrolle (alleiniger Eigentümer = Entscheider) → keine Managementprobleme. Aber: kein externes Eigenkapital, beschränkte Fremdfinanzierung, beschränkte Komplexität möglich.' },
    { id: 'c3-5', text: "Was kennzeichnet die Mikrostruktur von Partnerschaften?", a: 'Up-or-out-Regel, junge Partner mit überdurchschnittlich anstrengenden Aufgaben, relativ kleine Partneranzahl, oft ungleichmäßige Gewinnaufteilung, persönliche gesamtschuldnerische unbeschränkte Haftung.' },
    { id: 'c3-6', text: "Nenne Vorteile und Probleme von Genossenschaften.", a: 'Vorteile: gleichzeitige Zentralisierungs-/Dezentralisierungsvorteile, Verhinderung negativer externer Effekte, Sicherung von Quasirenten. Probleme: Überbeanspruchung gemeinsamer Ressourcen, Trittbrettfahrerprobleme, hohe Gegenwartspräferenzen.' },
    { id: 'c3-7', text: "Wie wird das Opportunismusproblem im Franchising typischerweise entschärft?", a: 'Durch systemspezifische Investitionen von Franchisegeber (FG) und Franchisenehmer (FN), lineare Zahlungsschemata (Anreizgestaltung/Selbsteinordnung), parallele eigene Filialen des FG, weitreichende Kontrollrechte des FG.' },
    { id: 'c3-8', text: "Definiere Unternehmensnetzwerk (Sydow 1995) und nenne 3 Formen.", a: 'Definition: auf Wettbewerbsvorteile zielende Organisationsform mit komplex-reziproken, eher kooperativen, relativ stabilen Beziehungen zwischen rechtlich selbständigen, wirtschaftlich abhängigen Unternehmen. Formen: Konzern, Konsortium, Joint Venture, strategische Allianz, Keiretsu.' },
  ] },
  { id: 'c4', title: 'Kap. 4 · Interne Organisationsstrukturen', sub: 'Aufgabenverteilung, Koordination, Weisungs-/Entscheidungsrechte, Organisatorischer Wandel', lernplan: [
    { id: 'c4-1', text: "Was unterscheidet funktionale von divisionaler Organisation und wann wechselt man?", a: 'Funktional: Gliederung nach Funktionen (Beschaffung/Produktion/Absatz) über alle Produkte hinweg. Divisional: Gliederung nach Produktgruppen/Regionen/Kunden. "Structure follows strategy": mit steigendem Diversifikationsgrad steigen die Koordinationsprobleme der funktionalen Organisation → Wechsel zur divisionalen Organisation.' },
    { id: 'c4-2', text: "Nenne 6 Koordinationsmöglichkeiten in Organisationen.", a: 'Persönliche Weisungen, Selbstabstimmung, Programme, Pläne, Organisationskultur, organisationsinterne Märkte (Verrechnungspreise).' },
    { id: 'c4-3', text: "Nenne die 3 Typen von Verrechnungspreisen mit einem Vor-/Nachteil.", a: 'Marktpreisorientiert (oft wenig realistisch), kostenorientiert (Ist-/Grenz-/Vollkosten, am häufigsten verwendet), Verhandlungslösungen (besserer Informationsstand, aber Opportunismusgefahr).' },
    { id: 'c4-4', text: "Nenne je 2 Vorteile von Zentralisierung und Dezentralisierung.", a: 'Zentralisierung: automatisch abgestimmte Entscheidungen, schnelle Reaktion in Krisen. Dezentralisierung: Entlastung des Top-Managements, höhere Flexibilität/Problemnähe/Innovationskraft.' },
    { id: 'c4-5', text: "Vergleiche Ein-, Stab-, und Mehrliniensystem (je 1 Vor-/Nachteil).", a: 'Einliniensystem: klare Zuständigkeit, aber Überforderung der Instanzen/lange Kommunikationswege. Stabliniensystem: fachliche Entlastung der Instanzen, aber unverantwortete Expertenmacht der Stäbe. Mehrliniensystem: Spezialisierung der Leitung/kürzere Wege, aber unklare Zuständigkeiten/Autoritätskonflikte.' },
    { id: 'c4-6', text: "Nenne die 3 Formen des Projektmanagements mit je einem Vor-/Nachteil.", a: 'Reines Projektmanagement: klare Kompetenzen, aber schwierige Wiedereingliederung. Einfluss-Projektmanagement: kaum organisatorische Umstellung nötig, aber Projektmanager kann sich gegen Linie kaum durchsetzen. Matrix-Projektmanagement: Ressourcen nur bei Bedarf, aber potentielle Ressourcenkonflikte.' },
    { id: 'c4-7', text: "Was besagt der Zusammenhang zwischen Leitungsspanne und Gliederungstiefe?", a: 'Leitungsspanne (span of control) = Anzahl direkt unterstellter Stellen einer Instanz. Steigt die Leitungsspanne, sinkt die Anzahl der Hierarchieebenen (Gliederungstiefe) – es gibt kein pauschal "optimales" Maß, sondern ein situatives Optimum.' },
  ] },
  { id: 'c5', title: 'Kap. 5 · Informationsbewertung', sub: 'Informationswert (IW), Satz von Bayes, A-priori-/A-posteriori-Erwartungswerte', lernplan: [
    { id: 'c5-1', text: "Definiere den Informationswert (IW) und wie er berechnet wird.", a: 'IW = Zusatznutzen aus der Nachfrage nach einem bestimmten Informationssystem = erwartetes Ergebnis MIT zusätzlichen Informationen (E**, a posteriori) minus erwartetes Ergebnis OHNE (E*, a priori): IW = E** − E*.' },
    { id: 'c5-2', text: "Beschreibe die 3 Schritte zur Berechnung des Informationswertes.", a: '1) A-priori-Erwartungswert E* berechnen (größter erwarteter Wert aller Handlungsalternativen ohne weitere Info). 2) A-posteriori-Erwartungswert E** berechnen (a: Nachrichtenwahrscheinlichkeiten qm, b: A-posteriori-Wahrscheinlichkeiten ps/m via Bayes, c: bedingte A-posteriori-Erwartungswerte, d: Gewichtung mit qm). 3) IW = E** − E*.' },
    { id: 'c5-3', text: "Wie lautet der Satz von Bayes in der hier verwendeten Notation?", a: 'ps/m = (ps · qm/s) / qm, wobei qm/s die bedingte Wahrscheinlichkeit (Likelihood) ist, vom I-System Nachricht m zu erhalten, wenn s der wahre Zustand ist, und qm = Σs ps·qm/s die Nachrichtenwahrscheinlichkeit.' },
    { id: 'c5-4', text: "Wann ist der Informationswert eines perfekten I-Systems maximal, und warum kann IW nie negativ sein?", a: 'IWmax = Σs Ps·[max_a e(a,s) − e(a*,s)]: perfekte Information erlaubt für jeden Zustand die jeweils optimale Handlung. IW kann nicht negativ werden, weil man bei jeder Nachricht immer mindestens die a-priori-optimale Handlung a* wählen könnte (man ist durch zusätzliche Info nie schlechter gestellt, maximal gleich gut).' },
    { id: 'c5-5', text: "Nenne 3 Beispiele für Informationssysteme (I-Systeme) im betrieblichen Kontext.", a: 'Stabsstellen, Projektgruppen, Expertisen von Gutachtern, Marktforschungsinstitute, Headhunter, private Arbeitsvermittler, Personalabteilung/Vorgesetzte.' },
  ] },
  { id: 'c6', title: 'Kap. 6 · Rekrutierung', sub: 'Personalbedarfsplanung, Personalauswahl, Adverse Selektion, Signaling/Screening, Abwerbung', lernplan: [
    { id: 'c6-1', text: "Wie wird der Netto-Personalbedarf einer Abteilung ermittelt?", a: 'Brutto-Personalbedarf − Ist-Personalbestand + Abgänge (sicher/statistisch/dispositionsbedingt) − Zugänge (Beförderungen/Ausbildungsabschluss) = Netto-Personalbedarf.' },
    { id: 'c6-2', text: "Nenne die Grundformel der Kennzahlenplanung für den Bruttopersonalbedarf.", a: 'PB = Arbeitsmenge / Leistungsfähigkeit pro Arbeitnehmer, unter den Prämissen: Konstanz von Leistungsprogramm/Produktivität/übrigen Bedarfsdeterminanten, exakte Zeit-/Volumenermittlung, effizient organisiertes Produktionssystem.' },
    { id: 'c6-3', text: "Erkläre Akerlofs 'Market for Lemons' (1970) und den Adverse-Selection-Mechanismus.", a: 'Bei asymmetrischer Information über die Qualität von Gebrauchtwagen zahlen Nachfrager nur den Erwartungswert der Qualität; Anbieter guter Autos ziehen sich zurück, da der Marktpreis unter ihrem Reservationspreis liegt; die Durchschnittsqualität sinkt weiter, bis nur noch die niedrigste Qualitätsstufe übrig bleibt.' },
    { id: 'c6-4', text: "Was unterscheidet Signaling von Screening (wer wird aktiv, Beispiel)?", a: 'Signaling (Spence 1973): Informationsaufdeckung durch die BESSER informierte Seite (AN, z.B. durch Bildungszertifikate). Screening: Informationsaufdeckung durch die SCHLECHTER informierte Seite (AG, z.B. durch Tests/Selbstselektionsmechanismen).' },
    { id: 'c6-5', text: "Nenne die 2 Bedingungen für ein funktionierendes (separierendes) Signaling-Gleichgewicht.", a: 'AN guter Qualität: Nutzen mit Bildung > Nutzen ohne Bildung: w(e*)−c(e*)/2 > w(0). AN schlechter Qualität: Nutzen mit Bildung < Nutzen ohne Bildung: w(e*)−c(e*) < w(0). Sind beide erfüllt, setzen nur gute AN das Signal (sonst: Pooling).' },
    { id: 'c6-6', text: "Was unterscheidet Reliabilität von Validität bei Personalauswahlverfahren?", a: 'Reliabilität (Verlässlichkeit): Führt die Messung immer zum gleichen Resultat (unabhängig von Beobachter/Zufall)? Validität (Gültigkeit): Wie stark korreliert das Testergebnis mit dem eigentlichen Ziel (Eignung für die Stelle)? Reliabilität ist Voraussetzung für Validität.' },
    { id: 'c6-7', text: "Was ist der 'Winner's Curse' bei Abwerbungen und wann sind Abwerbeversuche eher erfolgversprechend?", a: 'Winner\'s Curse: der aktuelle AG kennt seine Mitarbeiter besser als externe AG und kann gute Mitarbeiter mit Gegenangeboten halten – abwerbbare Mitarbeiter sind daher oft gerade jene, die externe AG eigentlich nicht wollen (Gefahr zu hohen Bietens). Erfolgversprechend: nach erfolgreicher Fortbildung, in schrumpfenden Branchen, bei schnellem technologischem Wandel.' },
  ] },
  { id: 'c7', title: 'Kap. 7 · Arbeitnehmer-Stellen-Matching', sub: 'Personalbestandsplanung mit Markov-Ketten, Fähigkeitsmerkmale, Zuordnungsproblem', lernplan: [
    { id: 'c7-1', text: "Beschreibe die 4 Schritte der Personalbestandsplanung mit Markov-Ketten.", a: '1) Erfassung der Ist-Verteilung/Übergänge zum Stichtag. 2) Ermittlung der relativen Veränderung (Übergänge/Ausgangsbestand). 3) Aufstellung der Matrix der Übergangswahrscheinlichkeiten. 4) Prognose der zukünftigen Verteilung durch Multiplikation von Ist-Bestand und Übergangswahrscheinlichkeiten (ohne Neueinstellungen).' },
    { id: 'c7-2', text: "Nenne die 4 Kategorien von Fähigkeitsmerkmalen der Arbeitnehmer.", a: 'Identifizierende Merkmale (z.B. Name), kenntnisbezogene Merkmale (Ausbildung, Werdegang), physische Merkmale (Zustand, Fähigkeiten, Beanspruchbarkeit), psychische Merkmale (geistige Leistungsfähigkeit, Arbeitsverhalten, psychomotorische Fähigkeiten).' },
    { id: 'c7-3', text: "Wie wird der Eignungswert eij im Zuordnungsproblem berechnet?", a: 'eij = Σk |fik − ajk|, die Summe der absoluten Abweichungen zwischen dem Fähigkeitsprofil fik des Arbeitnehmers i (über alle Merkmale k) und dem Anforderungsprofil ajk des Arbeitsplatzes j.' },
    { id: 'c7-4', text: "Nenne die Nebenbedingungen des Zuordnungsproblems (algorithmisch).", a: 'Zielfunktion: Σi Σj eij·xij → min (bzw. max). Nebenbedingungen: Σi xij = 1 für jeden Arbeitsplatz j (jeder Platz genau einmal besetzt), Σj xij = 1 für jede Person i (jede Person genau einem Platz zugeordnet), xij ∈ {0,1}, und n = m (gleiche Anzahl Personen/Plätze).' },
    { id: 'c7-5', text: "Nenne die 4 Teilaufgaben der Personaleinsatzplanung.", a: 'Organisatorische Dimension (Arbeitsplatz-Mitarbeiter-Zuordnung), zeitliche Dimension (Arbeitszeitpolitik), globale Dimension (Einsatzort), soziale Dimension (Mitarbeiterinteressen).' },
  ] },
  { id: 'c8', title: 'Kap. 8 · Betriebliche Qualifizierung', sub: 'Qualifikations-/Potentialanalyse, Personalentwicklungsmaßnahmen, Humankapital als Investition', lernplan: [
    { id: 'c8-1', text: "Was unterscheidet Qualifikationsanalyse von Potentialanalyse?", a: 'Qualifikationsanalyse: Analyse der AKTUELLEN Leistung/Fähigkeiten (Personalakten, Beurteilungen, Mitarbeitergespräche). Potentialanalyse: Einschätzung für ZUKÜNFTIGE Aufgaben (v.a. Testverfahren).' },
    { id: 'c8-2', text: "Nenne die 3 Kategorien von Personalentwicklungsmaßnahmen mit je einem Beispiel.", a: 'Stellengebunden (on-the-job): Job Enlargement/Enrichment. Stellenübergreifend: Qualitätszirkel, Stellvertretungen, Laufbahnentwicklung. Stellenungebunden: Lehrgänge, Planspiele, Rollenspiele (intern/extern).' },
    { id: 'c8-3', text: "Wann lohnt sich eine Humankapitalinvestition (Formel und Bedingung)?", a: 'Wenn gilt: C0 + J0 ≤ Σ[t=1 bis T] (Kt−Jt)/(1+r)^t. C0 = direkte Kosten, Jt = indirekte Kosten (entgangenes Einkommen ohne HK), Kt = Einkommen mit HK, r = Zinssatz/Diskontfaktor, T = Verrentungszeitpunkt. Die Investition lohnt sich, wenn der Barwert der zukünftigen Einkommensdifferenzen die Investitionskosten übersteigt.' },
    { id: 'c8-4', text: "Was unterscheidet allgemeines von (betriebs-)spezifischem Humankapital?", a: 'Allgemeines Humankapital: auch in anderen Betrieben produktiv einsetzbar (z.B. Fremdsprachen). Spezifisches Humankapital: nur im Ausbildungsbetrieb einsetzbar (z.B. betriebsspezifische Software/Prozesse).' },
    { id: 'c8-5', text: "Wie wird der Entwicklungsbedarf anhand von Leistung/Qualifikation und Potential bestimmt?", a: 'Über eine 2x2-Matrix (Portfolio): Kombination von aktueller Leistung/Qualifikation und Leistungs-/Entwicklungspotential – daraus werden je Quadrant unterschiedliche Entwicklungsmaßnahmen abgeleitet, unter Berücksichtigung der Bereitschaft des AN und der Zieladäquatheit.' },
  ] },
  { id: 'c9', title: 'Kap. 9 · Leistungsbeurteilung und Beförderungen', sub: 'Relative Leistungsturniere, Lohnspreizung, subjektive Leistungsbeurteilung/Biases', lernplan: [
    { id: 'c9-1', text: "Nenne die 2 Funktionen von (Beförderungs-)Turnieren.", a: 'Anreizfunktion (Motivation durch Aussicht auf den Turnierpreis) und Selektionsfunktion (Identifikation der leistungsfähigsten Mitarbeiter).' },
    { id: 'c9-2', text: "Wie wirkt sich die Lohnspreizung (Turnierpreisdifferenz) auf das Anstrengungsniveau aus (und Grenzen)?", a: 'Höhere Lohnspreizung erhöht monetäre Anreize und Anstrengungsniveau – darf aber nicht zu hoch sein (zusätzlicher Output muss die zusätzlichen Lohnkosten übersteigen) und nicht zu niedrig (Teilnahmebedingung).' },
    { id: 'c9-3', text: "Wie reagiert die Unternehmensleitung typischerweise auf höhere individuelle Zufallseinflüsse (Rauschen)?", a: 'Individuelle Zufallseinflüsse senken die Gewinnwahrscheinlichkeit durch eigene Leistung und damit das Anstrengungsniveau der Teilnehmer – die Unternehmensleitung reagiert häufig mit einer Erhöhung der Turnierpreisdifferenz, um den Anreizeffekt aufrechtzuerhalten.' },
    { id: 'c9-4', text: "Nenne 4 Probleme relativer Leistungsturniere.", a: 'Individuelle Zufallseinflüsse senken Leistungsbereitschaft, Kollusionsgefahr zwischen AN, weniger Anreizwirkung bei heterogenen Teilnehmern, Zielkonflikt zu Teamarbeit, Anreize für unkooperatives/sabotierendes Verhalten.' },
    { id: 'c9-5', text: "Nenne 4 typische Verzerrungen (Biases) bei subjektiven Leistungsbeurteilungen.", a: 'Ähnlichkeitsphänomen, Primacy-Effekt (früher Eindruck dominiert), Halo-Effekt (ein positives Merkmal färbt auf alle anderen ab), Leniency Bias (zu milde Beurteilung), Centrality Bias (Tendenz zur Mitte).' },
    { id: 'c9-6', text: "Warum sind objektive Leistungsmaße oft unzureichend (2 Gründe)?", a: 'Multitasking-Probleme (objektive Maße erfassen oft nur einen Teil der tatsächlichen Leistung) und Trittbrettfahrerprobleme (objektive Maße messen oft nur die Leistung einer größeren Gruppe, nicht des Individuums).' },
  ] },
  { id: 'c10', title: 'Kap. 10 · Teams', sub: 'Formen der Gruppenarbeit, Trittbrettfahrerproblem, Anreizverträge in Teams', lernplan: [
    { id: 'c10-1', text: "Nenne je 3 Beispiele für Gruppenarbeit als Ergänzung bzw. als Form der regulären Arbeitsorganisation.", a: 'Als Ergänzung: Problemlösungsgruppen, Qualitätszirkel, Projektgruppen. Als reguläre Form: Fertigungsteams, teilautonome Arbeitsgruppen, integrierte Arbeitsgruppen.' },
    { id: 'c10-2', text: "Erkläre das Grundproblem des Trittbrettfahrerverhaltens (Moral Hazard) in Teams formal.", a: 'Individuelle Leistungsbeiträge ei sind nicht beobachtbar. Bei gleichmäßiger Aufteilung des Teamergebnisses π erhält jedes Mitglied nur π/n, trägt aber die vollen Kosten ci(ei) seiner Anstrengung selbst → im Nash-Gleichgewicht wird weniger Anstrengung gewählt als beim pareto-effizienten Ergebnis (das die Summe aller ci(ei) berücksichtigt).' },
    { id: 'c10-3', text: "Nenne 4 Lösungsansätze für das Trittbrettfahrerproblem in Teams.", a: 'Strafe bei Unterschreitung eines Sollwerts (Nullgewinn-Budgetbedingung), optimaler linearer Anreizvertrag (wi = α + β·π), Gruppendruck (ki(ei)), dauerhafte Interaktion, Turniere zwischen Teams.' },
    { id: 'c10-4', text: "Nenne 3 grundsätzliche Vorteile von Gruppenarbeit.", a: 'Komplementaritäten (sich ergänzende Fähigkeiten), Spezialisierungsvorteile, Wissenstransfer zwischen Mitgliedern.' },
    { id: 'c10-5', text: "Nenne 2 weitere mögliche Probleme von Teams neben dem Trittbrettfahrerverhalten.", a: 'Group-think-Phänomen (unkritische Konformität in Gruppenentscheidungen) und Risiko-Schub-Phänomen (Gruppen treffen tendenziell riskantere Entscheidungen als Einzelpersonen).' },
  ] },
  { id: 'c11', title: 'Kap. 11 · Entlohnung', sub: 'Entlohnungskomponenten, Anforderungs-/Qualifikations-/Leistungsgerechtigkeit, Akkord-/Prämienlohn, intrinsische Motivation', lernplan: [
    { id: 'c11-1', text: "Nenne die 3 Kriterien für Entlohnung.", a: 'Anforderungsgerechte Entlohnung (basierend auf Arbeitsplatzanforderungen, z.B. Hay-Methode), Qualifikationsgerechte Entlohnung (basierend auf Fähigkeiten, z.B. Multiskill-/Knowledge-based-Pay), Leistungsgerechte Entlohnung (basierend auf tatsächlicher Leistung).' },
    { id: 'c11-2', text: "Nenne die 4 Schritte der anforderungsgerechten Entlohnung.", a: '1) Beschreibung des Arbeitsplatzes/der Arbeit. 2) Bestimmung von Art/Höhe der Anforderungen. 3) Ermittlung des Gesamtarbeitswertes. 4) Zuordnung der Löhne/Gehälter zu den Gesamtarbeitswerten.' },
    { id: 'c11-3', text: "Formuliere die Formeln für Geldakkord und Zeitakkord.", a: 'Geldakkord: L = M · Ge (M = erarbeitete Menge, Ge = Geldsatz je Mengeneinheit). Zeitakkord: L = M · te · fg (te = Vorgabezeit je Mengeneinheit/Stückzeit, fg = Geldfaktor je Einheit der Vorgabezeit/Minutenfaktor).' },
    { id: 'c11-4', text: "Was zeigt die Fallstudie Safelite Glass Corp. zum Wechsel von Stunden- auf Stücklöhne?", a: 'Der Wechsel von Stundenlöhnen auf Stücklöhne (mit garantiertem Mindestverdienst) führte zu einer Produktivitätssteigerung von 44% pro AN – durch einen Anreizeffekt (bestehende AN strengen sich mehr an) UND einen Selektionseffekt (produktivere AN werden angezogen/bleiben, weniger produktive verlassen das Unternehmen).' },
    { id: 'c11-5', text: "Nenne 2 typische Probleme von Stücklöhnen.", a: 'Qualitätsprobleme (Anreiz zu schnellem statt sorgfältigem Arbeiten), Kosten der Outputmessung und Qualitätssicherung (relevant ist letztlich die Lohnstückkosten-Entwicklung, nicht nur die Lohnkosten selbst).' },
    { id: 'c11-6', text: "Wann werden Strafzahlungen und wann Bonuszahlungen eingesetzt (Faustregel)?", a: 'Strafzahlungen: wenn ein Mindestniveau sichergestellt werden soll und zusätzliche Leistung keinen zusätzlichen Wert generiert. Bonuszahlungen: wenn eine größere Leistung erreicht werden soll und die Unterschreitung eines Niveaus nicht mit besonderen Kosten verbunden ist.' },
    { id: 'c11-7', text: "Was besagt der Verdrängungseffekt bei intrinsischer vs. extrinsischer Motivation?", a: 'Intrinsische Motivation liegt vor, wenn die Aktivität selbst die Entlohnung darstellt (Deci 1971). Monetäre Belohnungen/Bestrafungen können intrinsische Motivation verdrängen – der Verdrängungseffekt hängt von der Darstellung ab (Bonuszahlung wirkt weniger verdrängend als ein Lohnabzug).' },
  ] },
  { id: 'c12', title: 'Kap. 12 · Personalfreisetzung', sub: 'Maßnahmen, Seniorität, adverse Selektion bei Abfindungen', lernplan: [
    { id: 'c12-1', text: "Nenne 3 'weiche' Maßnahmen der Personalfreisetzung vor Entlassungen.", a: 'Arbeitszeitvariation (Abbau Überstunden, Kurzarbeit, Vollzeit→Teilzeit, Langzeiturlaub), kurzfristige Beschäftigungsvariation (Versetzungen, Nichtverlängerung befristeter Verträge), Frühverrentung/Outplacement/Aufhebungsverträge.' },
    { id: 'c12-2', text: "Nenne die 3 Arten von Entlassungen.", a: 'Personenbedingt (z.B. Krankheit/fehlende Eignung), verhaltensbedingt (Fehlverhalten), betriebsbedingt (unternehmerische Gründe wie Auftragsrückgang).' },
    { id: 'c12-3', text: "Wann sollte der Anteil jüngerer Arbeitnehmer in der Belegschaft hoch sein?", a: 'Bei starkem technologischem Wandel, hohem Anteil an in formaler Ausbildung erwerbbaren Fähigkeiten, niedrigem Anteil betriebsspezifischer Technologien (wenig spezifisches Humankapital nötig).' },
    { id: 'c12-4', text: "Warum sind bei älteren AN eher Aufhebungsverträge, bei jüngeren eher Entlassungen sinnvoll?", a: 'Ältere AN: stärkerer Kündigungsschutz, Gefahr von Reputationsverlusten für das Unternehmen → Aufhebungsverträge+Abfindungen bevorzugt. Jüngere AN: weniger rechtliche Restriktionen, weniger spezifisches Humankapital → Entlassungen eher sinnvoll.' },
    { id: 'c12-5', text: "Erkläre das Problem der adversen Selektion bei Abfindungsangeboten.", a: 'Wenn das Unternehmen Produktivitätsunterschiede zwischen AN nicht beobachten kann, nehmen die PRODUKTIVEN AN (mit besseren externen Chancen/höherem externem Einkommen) das Abfindungsangebot eher an, während weniger produktive AN im Unternehmen verbleiben – Lösung: gezieltes Halten von AN mit hohem spezifischem Humankapital.' },
  ] },
];

  c5: { label: 'Kap. 5 · Informationsbewertung', sub: 'Informationswert, Satz von Bayes, A-priori/A-posteriori-Erwartungswerte', questions: [
    { le: 'c5', q: "Wie wird der Informationswert (IW) definiert?", opts: [
        "IW = E** (a posteriori) − E* (a priori)", "IW = E* − E**", "IW = E* + E**", "IW = E* · E**"
      ], correct: 0, explain: "IW ist der Zusatznutzen aus zusätzlicher Information: erwartetes Ergebnis MIT Information (E**) minus erwartetes Ergebnis OHNE (E*)." },
    { le: 'c5', q: "Warum kann der Informationswert nie negativ werden?", opts: [
        "Man könnte bei jeder Nachricht immer mindestens die a-priori-optimale Handlung wählen – zusätzliche Info kann also nur helfen oder neutral sein", "Weil Informationen immer perfekt sind", "Weil die Nachrichtenwahrscheinlichkeiten immer 1 sind", "Weil Prinzipale stets risikoavers sind"
      ], correct: 0, explain: "Da man bei jeder Nachricht immer auf die a-priori-optimale Handlung a* zurückgreifen könnte, kann zusätzliche Information den Entscheider nie schlechter stellen." },
    { le: 'c5', q: "Rechenaufgabe (Informationswert): E* (a priori, beste Handlung ohne Info) = 45; E** (a posteriori, mit Info) = 52. Wie hoch ist der Informationswert IW?", opts: [
        "IW = 52 − 45 = 7", "IW = 45 − 52 = -7", "IW = 52 + 45 = 97", "IW = 52 / 45 ≈ 1,16"
      ], correct: 0, calc: true, explain: "IW = E** − E* = 52 − 45 = 7." },
    { le: 'c5', q: "Welches Element bezeichnet qm/s in der Notation der Informationsbewertung?", opts: [
        "Die bedingte Wahrscheinlichkeit (Likelihood), Nachricht m zu erhalten, wenn Zustand s eintritt", "Die A-posteriori-Wahrscheinlichkeit von Zustand s bei Nachricht m", "Die A-priori-Wahrscheinlichkeit von Zustand s", "Den Erwartungswert bei Wahl von Handlung a"
      ], correct: 0, explain: "qm/s = Likelihood (bedingte Wahrscheinlichkeit für Nachricht m gegeben Zustand s). Ps/m (A-posteriori) wird daraus über Bayes berechnet: Ps/m = Ps·qm/s / qm." },
    { le: 'c5', q: "Welche Aussagen zum Vorgehen der Informationswertberechnung treffen zu? (mehrere richtig)", multi: true, opts: [
        "Zuerst wird der A-priori-Erwartungswert als Maximum über alle Handlungsalternativen berechnet", "Die A-posteriori-Wahrscheinlichkeiten werden über den Satz von Bayes ermittelt", "Bei jeder Nachricht wird stets zufällig eine Handlung gewählt", "Der A-posteriori-Erwartungswert gewichtet die bedingten Erwartungswerte mit den Nachrichtenwahrscheinlichkeiten"
      ], correct: [0,1,3], explain: "Bei jeder Nachricht m wird NICHT zufällig, sondern die Handlung mit dem höchsten bedingten Erwartungswert gewählt – das ist gerade der Kern des Optimierungskalküls." },
  ] },

/* ============================================================
   QUIZ ENGINE HELPERS (shared by Quiz + Formelkarten)
   ============================================================ */
function quizRandInt(min, max, step) {
  step = step || 1;
  const n = Math.floor(Math.random() * ((max - min) / step + 1));
  return min + n * step;
}
function quizShuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function quizDe(n) { return Math.round(n).toLocaleString('de-DE'); }
function quizDe1(n) { return n.toLocaleString('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }
function quizBuildExprOptions(correctExpr, distractorExprs) {
  const values = quizShuffle([correctExpr, ...distractorExprs]);
  const correct = values.indexOf(correctExpr);
  return { opts: values, correct };
}
function quizShuffleOptions(item, idxs) {
  if (item.type === 'match') return item;
  const newCorrect = item.multi
    ? item.correct.map(oldIdx => idxs.indexOf(oldIdx))
    : idxs.indexOf(item.correct);
  return {
    q: item.q, opts: idxs.map(i => item.opts[i]), correct: newCorrect,
    explain: item.explain, calc: item.calc, multi: item.multi, diagramKey: item.diagramKey, formula: item.formula
  };
}
// Liefert die (einmal pro Frage feste) Options-Reihenfolge, damit sich die Zuordnung
// zwischen Klick und Anzeige des Ergebnisses nicht durch erneutes Mischen verschiebt.
function quizGetOptOrder(key, srcIdx, item) {
  if (item.type === 'match') return [];
  const ck = key + '_' + srcIdx;
  if (!quizState.optOrder[ck]) {
    quizState.optOrder[ck] = quizShuffle(item.opts.map((_, i) => i));
  }
  return quizState.optOrder[ck];
}
// Liefert die (einmal pro Frage feste) gemischte Reihenfolge der Begriffe (Dropdown-Optionen)
// einer Zuordnungsaufgabe – eindeutige Begriffe aus item.pairs, ggf. + extraTerms als Distraktoren.
function quizGetMatchTermOrder(key, srcIdx, item) {
  const ck = key + '_' + srcIdx + '_terms';
  if (!quizState.optOrder[ck]) {
    const terms = [...new Set(item.pairs.map(p => p.term))].concat(item.extraTerms || []);
    quizState.optOrder[ck] = quizShuffle(terms);
  }
  return quizState.optOrder[ck];
}

/* ============================================================
   QUIZ_DATA – Teil A-D (13 Lehreinheiten)

const quizState = {
  active: null,
  order: {}, index: {}, answer: {}, stats: {}, filterLE: {}, optOrder: {}, onlyWrong: {}
};
// Liefert die Indizes der Fragen eines Teils, die zum aktuell gewählten LE-Filter passen
// (oder alle, falls Filter = 'all'). Reihenfolge = Original-Reihenfolge im Array.
function quizFilteredIndices(key) {
  const filter = quizState.filterLE[key] || 'all';
  let idxs = QUIZ_DATA[key].questions.map((_, i) => i);
  if (filter !== 'all') idxs = idxs.filter(i => QUIZ_DATA[key].questions[i].le === filter);
  if (quizState.onlyWrong[key]) {
    const stats = quizStats[key] || {};
    idxs = idxs.filter(i => stats[quizBaseId(key, i)] && stats[quizBaseId(key, i)].lastWrong);
  }
  return idxs;
}
// Anzahl der zuletzt falsch beantworteten Fragen im aktuellen LE-Filter (unabhängig vom onlyWrong-Toggle selbst)
function quizWrongCount(key) {
  const filter = quizState.filterLE[key] || 'all';
  let idxs = QUIZ_DATA[key].questions.map((_, i) => i);
  if (filter !== 'all') idxs = idxs.filter(i => QUIZ_DATA[key].questions[i].le === filter);
  const stats = quizStats[key] || {};
  return idxs.filter(i => stats[quizBaseId(key, i)] && stats[quizBaseId(key, i)].lastWrong).length;
}
function quizEnsureOrder(key) {
  if (!quizState.order[key]) {
    if (!quizStats[key]) quizStats[key] = {};
    const idxs = quizFilteredIndices(key);
    const stats = quizStats[key];
    const wrongFirst = idxs.filter(i => stats[quizBaseId(key, i)] && stats[quizBaseId(key, i)].lastWrong);
    const rest = idxs.filter(i => !(stats[quizBaseId(key, i)] && stats[quizBaseId(key, i)].lastWrong));
    quizState.order[key] = quizShuffle(wrongFirst).concat(quizShuffle(rest));
  }
  return quizState.order[key];
}
function quizBaseId(key, srcIdx) { return key + srcIdx; }
// Liste der in einem Teil vorkommenden LE-Kürzel, in Auftrittsreihenfolge (z.B. ['le01','le02','le03'])
function quizLEsInTeil(key) {
  const seen = [];
  QUIZ_DATA[key].questions.forEach(q => { if (q.le && !seen.includes(q.le)) seen.push(q.le); });
  return seen;
}
function quizLETitle(leId) {
  const mod = MODULES.find(m => m.id === leId);
  return mod ? mod.title : leId;
}
function renderQuizTabs() {
  const el = document.getElementById('quizTabs');
  el.innerHTML = '';
  Object.keys(QUIZ_DATA).forEach(key => {
    quizEnsureOrder(key);
    const st = quizStats[key] || {};
    const correct = Object.values(st).reduce((s, v) => s + (v.correct || 0), 0);
    const wrong = Object.values(st).reduce((s, v) => s + (v.wrong || 0), 0);
    const div = document.createElement('div');
    div.className = 'quiz-tab' + (quizState.active === key ? ' active' : '');
    div.innerHTML = `<p class="quiz-tab-title">${QUIZ_DATA[key].label}</p><p class="quiz-tab-sub">${QUIZ_DATA[key].sub}</p><p class="quiz-tab-stats">${QUIZ_DATA[key].questions.length} Fragen · ✓${correct} ✗${wrong}</p>`;
    div.onclick = () => { quizState.active = key; renderQuiz(); };
    el.appendChild(div);
  });
}
function renderQuizControls() {
  const wrap = document.getElementById('quizControls');
  const key = quizState.active;
  if (!key) { wrap.innerHTML = ''; return; }
  const les = quizLEsInTeil(key);
  const filter = quizState.filterLE[key] || 'all';
  const leOptions = les.map(le => `<option value="${le}" ${filter === le ? 'selected' : ''}>${quizLETitle(le)}</option>`).join('');
  const count = quizFilteredIndices(key).length;
  const wrongCount = quizWrongCount(key);
  const onlyWrong = !!quizState.onlyWrong[key];
  wrap.innerHTML = `
    <select id="quizLeSelect"><option value="all" ${filter === 'all' ? 'selected' : ''}>Alle ${QUIZ_DATA[key].label.replace('Teil ' + key + ' · ', '')} (${QUIZ_DATA[key].questions.length} Fragen)</option>${leOptions}</select>
    <label><input type="checkbox" id="quizOnlyWrongCheck" ${onlyWrong ? 'checked' : ''} ${wrongCount === 0 && !onlyWrong ? 'disabled' : ''}> Nur falsche wiederholen (${wrongCount})</label>
    <span class="kk-progress-inline">${count} Frage${count === 1 ? '' : 'n'} in dieser Auswahl</span>
  `;
  document.getElementById('quizLeSelect').addEventListener('change', (e) => {
    quizState.filterLE[key] = e.target.value;
    quizState.order[key] = null;
    quizState.index[key] = 0;
    quizState.answer[key] = null;
    quizState.answer[key + '_multi'] = [];
    renderQuiz();
  });
  document.getElementById('quizOnlyWrongCheck').addEventListener('change', (e) => {
    quizState.onlyWrong[key] = e.target.checked;
    quizState.order[key] = null;
    quizState.index[key] = 0;
    quizState.answer[key] = null;
    quizState.answer[key + '_multi'] = [];
    renderQuiz();
  });
}
function renderQuizPanel() {
  const panel = document.getElementById('quizPanel');
  panel.innerHTML = '';
  const key = quizState.active;
  if (!key) return;
  const order = quizEnsureOrder(key);
  const idx = quizState.index[key] || 0;
  if (!quizStats[key]) quizStats[key] = {};
  const total = QUIZ_DATA[key].questions.length;

  if (order.length === 0 && quizState.onlyWrong[key]) {
    panel.innerHTML = `
      <div class="quiz-summary">
        🎉 Keine offenen Fehler in dieser Auswahl – alles zuletzt richtig beantwortet!<br>
        <span class="quiz-reset-btn" id="quizAllBtn">Zurück zu allen Fragen</span>
      </div>`;
    document.getElementById('quizAllBtn').onclick = () => {
      quizState.onlyWrong[key] = false;
      quizState.order[key] = null; quizState.index[key] = 0; quizState.answer[key] = null;
      renderQuiz();
    };
    return;
  }

  if (idx >= order.length) {
    let c = 0, w = 0;
    order.forEach(i => { const s = quizStats[key][quizBaseId(key, i)]; if (s) { c += s.correct || 0; w += s.wrong || 0; } });
    panel.innerHTML = `
      <div class="quiz-summary">
        ${QUIZ_DATA[key].label} durchgespielt: <strong>${c} richtig / ${w} falsch</strong> (insgesamt seit Beginn).<br>
        <span class="quiz-reset-btn" id="quizRestartBtn">Neu mischen &amp; nochmal üben</span>
      </div>`;
    document.getElementById('quizRestartBtn').onclick = () => {
      quizState.order[key] = null; quizState.index[key] = 0; quizState.answer[key] = null;
      Object.keys(quizState.optOrder).forEach(ck => { if (ck.startsWith(key + '_')) delete quizState.optOrder[ck]; });
      renderQuiz();
    };
    return;
  }

  const srcIdx = order[idx];
  const raw = QUIZ_DATA[key].questions[srcIdx];
  const optIdxs = quizGetOptOrder(key, srcIdx, raw);
  const q = quizShuffleOptions(raw, optIdxs);
  const baseId = quizBaseId(key, srcIdx);
  const answer = quizState.answer[key];

  const progressText = document.createElement('div');
  progressText.className = 'flashcard-progress-text';
  progressText.textContent = `Frage ${idx + 1} von ${order.length} (von ${total} in diesem Teil)`;
  panel.appendChild(progressText);

  if (q.type === 'match') {
    const termOrder = quizGetMatchTermOrder(key, srcIdx, q);
    const matchAnswer = quizState.answer[key + '_match'] || {};
    const submitted = answer !== null;

    const mcard = document.createElement('div');
    mcard.className = 'quiz-card';
    mcard.innerHTML = `
      <div class="quiz-q-head"><div>${q.q}</div><span class="quiz-match-badge">Zuordnung</span></div>
      <div class="quiz-match-rows"></div>
      <div class="quiz-explain ${submitted ? 'show' : ''}">${q.explain}</div>
    `;
    const rowsWrap = mcard.querySelector('.quiz-match-rows');
    q.pairs.forEach((pair, pi) => {
      const row = document.createElement('div');
      let cls = 'quiz-match-row';
      const chosen = matchAnswer[pi];
      if (submitted) cls += (chosen === pair.term) ? ' correct' : ' wrong';
      row.className = cls;
      const optionsHtml = ['<option value="">– wählen –</option>'].concat(
        termOrder.map(t => `<option value="${t.replace(/"/g, '&quot;')}" ${chosen === t ? 'selected' : ''}>${t}</option>`)
      ).join('');
      row.innerHTML = `<span class="quiz-match-def">${pair.def}</span><select class="quiz-match-select" ${submitted ? 'disabled' : ''}>${optionsHtml}</select>`;
      if (!submitted) {
        row.querySelector('select').addEventListener('change', (e) => {
          matchAnswer[pi] = e.target.value;
          quizState.answer[key + '_match'] = matchAnswer;
          renderQuiz();
        });
      } else if (chosen !== pair.term) {
        const hint = document.createElement('div');
        hint.className = 'quiz-match-correct-hint';
        hint.textContent = 'Richtig: ' + pair.term;
        row.appendChild(hint);
      }
      rowsWrap.appendChild(row);
    });
    panel.appendChild(mcard);

    if (!submitted) {
      const allAnswered = q.pairs.every((_, pi) => matchAnswer[pi]);
      const submitWrap = document.createElement('div');
      submitWrap.className = 'flashcard-actions';
      submitWrap.innerHTML = `<button class="flashcard-btn show" ${allAnswered ? '' : 'disabled'}>Antwort prüfen</button>`;
      submitWrap.querySelector('button').onclick = () => {
        if (!q.pairs.every((_, pi) => matchAnswer[pi])) return;
        const isRight = q.pairs.every((pair, pi) => matchAnswer[pi] === pair.term);
        if (!quizStats[key][baseId]) quizStats[key][baseId] = { correct: 0, wrong: 0 };
        if (isRight) { quizStats[key][baseId].correct++; quizStats[key][baseId].lastWrong = false; }
        else { quizStats[key][baseId].wrong++; quizStats[key][baseId].lastWrong = true; }
        quizState.answer[key] = true;
        saveStats();
        renderQuiz();
      };
      panel.appendChild(submitWrap);
    } else {
      const nextWrap = document.createElement('div');
      nextWrap.className = 'flashcard-actions';
      nextWrap.innerHTML = `<button class="flashcard-btn show">Nächste Frage →</button>`;
      nextWrap.querySelector('button').onclick = () => {
        delete quizState.optOrder[key + '_' + srcIdx + '_terms'];
        quizState.index[key] = idx + 1;
        quizState.answer[key] = null;
        quizState.answer[key + '_match'] = {};
        renderQuiz();
      };
      panel.appendChild(nextWrap);
    }
    return;
  }

  const card = document.createElement('div');
  card.className = 'quiz-card';
  card.innerHTML = `
    <div class="quiz-q-head"><div>${q.q}</div>${q.multi ? '<span class="quiz-calc-badge">Mehrfachauswahl</span>' : (q.calc ? '<span class="quiz-calc-badge">Rechenaufgabe</span>' : '')}</div>
    <div class="quiz-opts"></div>
    <div class="quiz-explain ${answer !== null ? 'show' : ''}">${q.explain}</div>
  `;
  const optsWrap = card.querySelector('.quiz-opts');
  const selectedMulti = (quizState.answer[key + '_multi']) || [];

  if (q.multi) {
    q.opts.forEach((optText, oi) => {
      const optDiv = document.createElement('div');
      let cls = 'quiz-opt';
      const isSelected = selectedMulti.includes(oi);
      const submitted = answer !== null;
      if (submitted) {
        cls += ' disabled-look';
        if (q.correct.includes(oi)) cls += ' correct';
        else if (isSelected) cls += ' wrong';
      } else if (isSelected) {
        cls += ' selected';
      }
      optDiv.className = cls;
      const letter = String.fromCharCode(65 + oi);
      let dotContent = letter;
      if (submitted && q.correct.includes(oi)) dotContent = '✓';
      else if (submitted && isSelected) dotContent = '✗';
      optDiv.innerHTML = `<span class="quiz-dot">${dotContent}</span><span>${optText}</span>`;
      if (!submitted) {
        optDiv.onclick = () => {
          const idx2 = selectedMulti.indexOf(oi);
          if (idx2 === -1) selectedMulti.push(oi); else selectedMulti.splice(idx2, 1);
          quizState.answer[key + '_multi'] = selectedMulti;
          renderQuiz();
        };
      }
      optsWrap.appendChild(optDiv);
    });
    if (answer === null) {
      const submitWrap = document.createElement('div');
      submitWrap.className = 'flashcard-actions';
      submitWrap.innerHTML = `<button class="flashcard-btn show">Antwort prüfen</button>`;
      submitWrap.querySelector('button').onclick = () => {
        const correctSet = new Set(q.correct);
        const selSet = new Set(selectedMulti);
        const isRight = correctSet.size === selSet.size && [...correctSet].every(x => selSet.has(x));
        if (!quizStats[key][baseId]) quizStats[key][baseId] = { correct: 0, wrong: 0 };
        if (isRight) { quizStats[key][baseId].correct++; quizStats[key][baseId].lastWrong = false; }
        else { quizStats[key][baseId].wrong++; quizStats[key][baseId].lastWrong = true; }
        quizState.answer[key] = selectedMulti.slice();
        saveStats();
        renderQuiz();
      };
      panel.appendChild(card);
      panel.appendChild(submitWrap);
      return;
    }
  } else {
    q.opts.forEach((optText, oi) => {
      const optDiv = document.createElement('div');
      let cls = 'quiz-opt';
      if (answer !== null) {
        cls += ' disabled-look';
        if (oi === q.correct) cls += ' correct';
        else if (oi === answer) cls += ' wrong';
      }
      optDiv.className = cls;
      const letter = String.fromCharCode(65 + oi);
      let dotContent = letter;
      if (answer !== null && oi === q.correct) dotContent = '✓';
      else if (answer !== null && oi === answer) dotContent = '✗';
      optDiv.innerHTML = `<span class="quiz-dot">${dotContent}</span><span>${optText}</span>`;
      if (answer === null) {
        optDiv.onclick = () => {
          quizState.answer[key] = oi;
          if (!quizStats[key][baseId]) quizStats[key][baseId] = { correct: 0, wrong: 0 };
          if (oi === q.correct) { quizStats[key][baseId].correct++; quizStats[key][baseId].lastWrong = false; }
          else { quizStats[key][baseId].wrong++; quizStats[key][baseId].lastWrong = true; }
          saveStats();
          renderQuiz();
        };
      }
      optsWrap.appendChild(optDiv);
    });
  }
  panel.appendChild(card);

  if (answer !== null) {
    const nextWrap = document.createElement('div');
    nextWrap.className = 'flashcard-actions';
    nextWrap.innerHTML = `<button class="flashcard-btn show">Nächste Frage →</button>`;
    nextWrap.querySelector('button').onclick = () => {
      delete quizState.optOrder[key + '_' + srcIdx];
      quizState.index[key] = idx + 1;
      quizState.answer[key] = null;
      quizState.answer[key + '_multi'] = [];
      renderQuiz();
    };
    panel.appendChild(nextWrap);
  } else if (!q.multi) {
    const hint = document.createElement('div');
    hint.className = 'flashcard-hint';
    hint.textContent = 'Antwort auswählen, um Erklärung zu sehen.';
    panel.appendChild(hint);
  }
}
function renderQuiz() {
  if (!quizState.active) quizState.active = Object.keys(QUIZ_DATA)[0];
  Object.keys(QUIZ_DATA).forEach(k => { if (!(k in quizState.index)) quizState.index[k] = 0; if (!(k in quizState.answer)) quizState.answer[k] = null; });
  renderQuizTabs();
  renderQuizControls();
  renderQuizPanel();
}

/* ============================================================
   AWI_FORMULA_QUIZ – Rechenaufgaben (Formelkarten)
   ============================================================ */



const ebwlCardState = {
  active: null,
  order: {}, instance: {}, index: {}, answer: {}, stats: {}, qstats: {}, filterLE: {}, onlyWrong: {}
};
// Fragen (bzw. Formel-Vorlagen), die beim letzten Versuch falsch beantwortet wurden,
// kommen bei einer neuen Runde zuerst dran.
function ebwlFilteredIndices(key) {
  const filter = ebwlCardState.filterLE[key] || 'all';
  let idxs = AWI_FORMULA_QUIZ[key].questions.map((_, i) => i);
  if (filter !== 'all') idxs = idxs.filter(i => AWI_FORMULA_QUIZ[key].questions[i].le === filter);
  if (ebwlCardState.onlyWrong[key]) {
    const qs = ebwlCardState.qstats[key] || {};
    idxs = idxs.filter(i => qs[i] && qs[i].lastWrong);
  }
  return idxs;
}
// Anzahl der zuletzt falsch beantworteten Aufgaben im aktuellen LE-Filter (unabhängig vom onlyWrong-Toggle selbst)
function ebwlWrongCount(key) {
  const filter = ebwlCardState.filterLE[key] || 'all';
  let idxs = AWI_FORMULA_QUIZ[key].questions.map((_, i) => i);
  if (filter !== 'all') idxs = idxs.filter(i => AWI_FORMULA_QUIZ[key].questions[i].le === filter);
  const qs = ebwlCardState.qstats[key] || {};
  return idxs.filter(i => qs[i] && qs[i].lastWrong).length;
}
function ebwlLEsInTeil(key) {
  const seen = [];
  AWI_FORMULA_QUIZ[key].questions.forEach(q => { if (q.le && !seen.includes(q.le)) seen.push(q.le); });
  return seen;
}
function ebwlEnsureOrder(key) {
  if (!ebwlCardState.order[key]) {
    const all = ebwlFilteredIndices(key);
    const qs = ebwlCardState.qstats[key] || {};
    const wrongFirst = all.filter(i => qs[i] && qs[i].lastWrong);
    const rest = all.filter(i => !(qs[i] && qs[i].lastWrong));
    ebwlCardState.order[key] = quizShuffle(wrongFirst).concat(quizShuffle(rest));
    if (!ebwlCardState.instance[key]) ebwlCardState.instance[key] = {};
  }
  return ebwlCardState.order[key];
}
function ebwlGetQuestion(key, srcIdx) {
  const src = AWI_FORMULA_QUIZ[key].questions[srcIdx];
  if (src.genKey) {
    if (!ebwlCardState.instance[key]) ebwlCardState.instance[key] = {};
    if (!ebwlCardState.instance[key][srcIdx]) {
      ebwlCardState.instance[key][srcIdx] = AWI_CALC_GENERATORS[src.genKey]();
    }
    return ebwlCardState.instance[key][srcIdx];
  }
  return src;
}
function renderEbwlCardsTabs() {
  const el = document.getElementById('ebwlTabs');
  el.innerHTML = '';
  Object.keys(AWI_FORMULA_QUIZ).forEach(key => {
    const order = ebwlEnsureOrder(key);
    if (!ebwlCardState.stats[key]) ebwlCardState.stats[key] = { correct: 0, wrong: 0 };
    const div = document.createElement('div');
    div.className = 'quiz-tab' + (ebwlCardState.active === key ? ' active' : '');
    div.innerHTML = `<p class="quiz-tab-title">${AWI_FORMULA_QUIZ[key].label}</p><p class="quiz-tab-sub">${AWI_FORMULA_QUIZ[key].sub}</p>`;
    div.onclick = () => { ebwlCardState.active = key; renderEbwlCards(); };
    el.appendChild(div);
  });
}
function renderEbwlCardsControls() {
  const wrap = document.getElementById('ebwlControls');
  const key = ebwlCardState.active;
  if (!key) { wrap.innerHTML = ''; return; }
  const les = ebwlLEsInTeil(key);
  const filter = ebwlCardState.filterLE[key] || 'all';
  const leOptions = les.map(le => `<option value="${le}" ${filter === le ? 'selected' : ''}>${quizLETitle(le)}</option>`).join('');
  const count = ebwlFilteredIndices(key).length;
  const wrongCount = ebwlWrongCount(key);
  const onlyWrong = !!ebwlCardState.onlyWrong[key];
  wrap.innerHTML = `
    <select id="ebwlLeSelect"><option value="all" ${filter === 'all' ? 'selected' : ''}>Alle ${AWI_FORMULA_QUIZ[key].label.replace('Formeln ', '')} (${AWI_FORMULA_QUIZ[key].questions.length} Aufgaben)</option>${leOptions}</select>
    <label><input type="checkbox" id="ebwlOnlyWrongCheck" ${onlyWrong ? 'checked' : ''} ${wrongCount === 0 && !onlyWrong ? 'disabled' : ''}> Nur falsche wiederholen (${wrongCount})</label>
    <span class="kk-progress-inline">${count} Aufgabe${count === 1 ? '' : 'n'} in dieser Auswahl</span>
  `;
  document.getElementById('ebwlLeSelect').addEventListener('change', (e) => {
    ebwlCardState.filterLE[key] = e.target.value;
    ebwlCardState.order[key] = null;
    ebwlCardState.index[key] = 0;
    ebwlCardState.answer[key] = null;
    renderEbwlCards();
  });
  document.getElementById('ebwlOnlyWrongCheck').addEventListener('change', (e) => {
    ebwlCardState.onlyWrong[key] = e.target.checked;
    ebwlCardState.order[key] = null;
    ebwlCardState.index[key] = 0;
    ebwlCardState.answer[key] = null;
    renderEbwlCards();
  });
}
function renderEbwlCardsPanel() {
  const panel = document.getElementById('ebwlPanel');
  panel.innerHTML = '';
  const key = ebwlCardState.active;
  if (!key) return;
  const order = ebwlEnsureOrder(key);
  const idx = ebwlCardState.index[key] || 0;
  const stats = ebwlCardState.stats[key];
  const total = AWI_FORMULA_QUIZ[key].questions.length;

  if (order.length === 0 && ebwlCardState.onlyWrong[key]) {
    panel.innerHTML = `
      <div class="quiz-summary">
        🎉 Keine offenen Fehler in dieser Auswahl – alles zuletzt richtig gerechnet!<br>
        <span class="quiz-reset-btn" id="ebwlAllBtn">Zurück zu allen Aufgaben</span>
      </div>`;
    document.getElementById('ebwlAllBtn').onclick = () => {
      ebwlCardState.onlyWrong[key] = false;
      ebwlCardState.order[key] = null; ebwlCardState.index[key] = 0; ebwlCardState.answer[key] = null;
      renderEbwlCards();
    };
    return;
  }

  if (idx >= order.length) {
    panel.innerHTML = `
      <div class="quiz-summary">
        ${AWI_FORMULA_QUIZ[key].label} durchgerechnet: <strong>${stats.correct} / ${order.length}</strong> richtig.<br>
        <span class="quiz-reset-btn" id="ebwlCardsRestartBtn">Neu mischen &amp; nochmal rechnen</span>
      </div>`;
    document.getElementById('ebwlCardsRestartBtn').onclick = () => {
      ebwlCardState.order[key] = null; ebwlCardState.index[key] = 0; ebwlCardState.answer[key] = null;
      ebwlCardState.stats[key] = { correct: 0, wrong: 0 };
      renderEbwlCards();
    };
    return;
  }

  const srcIdx = order[idx];
  const q = ebwlGetQuestion(key, srcIdx);
  const answer = ebwlCardState.answer[key];

  const progressText = document.createElement('div');
  progressText.className = 'flashcard-progress-text';
  progressText.textContent = `Aufgabe ${idx + 1} von ${order.length} (von ${total} in diesem Kapitel)`;
  panel.appendChild(progressText);

  const card = document.createElement('div');
  card.className = 'quiz-card';
  card.innerHTML = `
    <div class="quiz-q-head"><div>${q.q}</div>${q.calc ? '<span class="quiz-calc-badge">Rechenaufgabe</span>' : '<span class="quiz-calc-badge">Formel</span>'}</div>
    <div class="quiz-opts"></div>
    <div class="quiz-explain ${answer !== null ? 'show' : ''}">${q.explain}</div>
  `;
  const optsWrap = card.querySelector('.quiz-opts');
  q.opts.forEach((optText, oi) => {
    const optDiv = document.createElement('div');
    let cls = 'quiz-opt';
    if (answer !== null) {
      cls += ' disabled-look';
      if (oi === q.correct) cls += ' correct';
      else if (oi === answer) cls += ' wrong';
    }
    optDiv.className = cls;
    const letter = String.fromCharCode(65 + oi);
    let dotContent = letter;
    if (answer !== null && oi === q.correct) dotContent = '✓';
    else if (answer !== null && oi === answer) dotContent = '✗';
    optDiv.innerHTML = `<span class="quiz-dot">${dotContent}</span><span>${optText}</span>`;
    if (answer === null) {
      optDiv.onclick = () => {
        ebwlCardState.answer[key] = oi;
        if (!ebwlCardState.qstats[key]) ebwlCardState.qstats[key] = {};
        if (!ebwlCardState.qstats[key][srcIdx]) ebwlCardState.qstats[key][srcIdx] = {};
        if (oi === q.correct) { stats.correct++; ebwlCardState.qstats[key][srcIdx].lastWrong = false; }
        else { stats.wrong++; ebwlCardState.qstats[key][srcIdx].lastWrong = true; }
        renderEbwlCards();
      };
    }
    optsWrap.appendChild(optDiv);
  });
  panel.appendChild(card);

  if (answer !== null) {
    const nextWrap = document.createElement('div');
    nextWrap.className = 'flashcard-actions';
    nextWrap.innerHTML = `<button class="flashcard-btn show">Nächste Aufgabe →</button>`;
    nextWrap.querySelector('button').onclick = () => { ebwlCardsNext(key); };
    panel.appendChild(nextWrap);
  } else {
    const hint = document.createElement('div');
    hint.className = 'flashcard-hint';
    hint.textContent = 'Erst die richtige Rechnung erkennen, dann auswählen. Danach zeige ich dir Formel + Ergebnis.';
    panel.appendChild(hint);
  }

  const statsEl = document.createElement('div');
  statsEl.className = 'flashcard-stats';
  statsEl.textContent = `Richtig: ${stats.correct} · Falsch: ${stats.wrong}`;
  panel.appendChild(statsEl);
}
function ebwlCardsNext(key) {
  ebwlCardState.index[key] = (ebwlCardState.index[key] || 0) + 1;
  ebwlCardState.answer[key] = null;
  renderEbwlCards();
}
function renderEbwlCards() {
  if (!ebwlCardState.active) ebwlCardState.active = Object.keys(AWI_FORMULA_QUIZ)[0];
  Object.keys(AWI_FORMULA_QUIZ).forEach(k => {
    if (!(k in ebwlCardState.index)) ebwlCardState.index[k] = 0;
    if (!(k in ebwlCardState.answer)) ebwlCardState.answer[k] = null;
    if (!ebwlCardState.stats[k]) ebwlCardState.stats[k] = { correct: 0, wrong: 0 };
  });
  renderEbwlCardsTabs();
  renderEbwlCardsControls();
  renderEbwlCardsPanel();
}

/* ============================================================
   NAV / INIT
   ============================================================ */
function resetQuizEngineState() {
  quizState.active = null;
  quizState.order = {}; quizState.index = {}; quizState.answer = {};
  quizState.stats = {}; quizState.filterLE = {}; quizState.optOrder = {}; quizState.onlyWrong = {};
  ebwlCardState.active = null;
  ebwlCardState.order = {}; ebwlCardState.instance = {}; ebwlCardState.index = {};
  ebwlCardState.answer = {}; ebwlCardState.stats = {}; ebwlCardState.qstats = {};
  ebwlCardState.filterLE = {}; ebwlCardState.onlyWrong = {};
}
function switchCourse(id) {
  const c = COURSES[id];
  if (!c) return;

  MODULES = c.MODULES;
  DAYPLAN = c.DAYPLAN;
  QUIZ_DATA = c.QUIZ_DATA;
  AWI_FORMULA_QUIZ = c.AWI_FORMULA_QUIZ;
  AWI_CALC_GENERATORS = c.AWI_CALC_GENERATORS;
  LS_PROGRESS = c.lsProgress;
  LS_STATS = c.lsStats;
  EXAM_DATE = new Date(c.examDateISO);

  document.title = c.title;
  document.getElementById('topLabel').innerHTML = c.label;
  document.getElementById('mainH1').innerHTML = c.title;
  document.getElementById('mainSubtitle').innerHTML = c.subtitle;
  document.getElementById('examName').innerHTML = c.examName;
  document.getElementById('examDateLabel').innerHTML = c.examDateLabel;
  document.getElementById('tabQuizLabel').innerHTML = c.tabQuiz;
  document.getElementById('tabFormelnLabel').innerHTML = c.tabFormeln;
  document.getElementById('infoModule').innerHTML = c.infoModule;
  document.getElementById('infoQuiz').innerHTML = c.infoQuiz;
  document.getElementById('infoFormeln').innerHTML = c.infoFormeln;

  document.querySelectorAll('.course-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.course === id);
  });

  resetQuizEngineState();
  loadLocal();
  showView('view-module', 'tab-module');
  renderCountdown();
  render();
  renderQuiz();
  renderEbwlCards();
  loadRemote();

  localStorage.setItem('dashboard_activeCourse', id);
}
function showView(viewId, tabId) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
  document.getElementById(viewId).classList.add('active');
  document.getElementById(tabId).classList.add('active');
}
document.getElementById('tab-module').addEventListener('click', () => { showView('view-module', 'tab-module'); renderModules(); });
document.getElementById('tab-tagesplan').addEventListener('click', () => { showView('view-tagesplan', 'tab-tagesplan'); renderDayplan(); });
document.getElementById('tab-quiz').addEventListener('click', () => { showView('view-quiz', 'tab-quiz'); renderQuiz(); });
document.getElementById('tab-formeln').addEventListener('click', () => { showView('view-formeln', 'tab-formeln'); renderEbwlCards(); });
document.querySelectorAll('.course-btn').forEach(btn => {
  btn.addEventListener('click', () => switchCourse(btn.dataset.course));
});

function render() {
  renderModules();
  renderDayplan();
}

loadTagesplanState();
const savedCourse = localStorage.getItem('dashboard_activeCourse') || 'stat';
switchCourse(savedCourse);
setInterval(renderCountdown, 60000);
loadTagesplanRemote();
</script>
