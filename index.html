<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Uni – Klausuren-Dashboard</title>
<style>
  :root {
    --bg: #0e1016;
    --card: #171a24;
    --card-border: #262a38;
    --text-primary: #eef0f5;
    --text-secondary: #9096ab;
    --text-muted: #666c80;
    --accent: #5b8def;
    --green: #34d399;
    --amber: #f5a623;
    --pill-bg: #1f2433;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1.25rem 4rem;
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #app { max-width: 1100px; margin: 0 auto; }
  .top-label {
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  h1 { font-size: 26px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { font-size: 14px; color: var(--text-secondary); margin: 0 0 1.75rem; }

  .next-exam {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 0.9rem 1.2rem;
    margin-bottom: 1.5rem;
  }
  .next-exam-label {
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 2px;
  }
  .next-exam-name { font-size: 16px; font-weight: 600; }
  .next-exam-date { font-size: 13px; color: var(--text-secondary); margin-left: 8px; }
  .next-exam-countdown {
    font-size: 20px;
    font-weight: 700;
    color: var(--amber);
    white-space: nowrap;
  }
  .next-exam-countdown span {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-left: 4px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 1.25rem 1.35rem 1.5rem;
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }
  .card-title { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .card-sub { font-size: 12.5px; color: var(--text-secondary); }
  .ring-wrap { position: relative; width: 54px; height: 54px; flex-shrink: 0; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-label {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--pill-bg);
    color: var(--amber);
    font-size: 12px;
    font-weight: 500;
    padding: 5px 10px;
    border-radius: 8px;
    margin-bottom: 14px;
  }
  .section-label {
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin: 14px 0 6px;
  }
  .item-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 5px 0;
    cursor: pointer;
    font-size: 13.5px;
  }
  .check {
    width: 17px; height: 17px;
    border-radius: 50%;
    border: 1.5px solid var(--text-muted);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s ease;
  }
  .check.on {
    background: var(--green);
    border-color: var(--green);
  }
  .check.on svg { width: 10px; height: 10px; }
  .item-text { color: var(--text-primary); }
  .item-text.done { color: var(--green); text-decoration: line-through; text-decoration-color: var(--text-muted); }

  .plan-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 7px 0;
    cursor: pointer;
  }
  .plan-num {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 1.5px solid var(--text-muted);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-top: 1px;
    transition: all 0.15s ease;
  }
  .plan-num.on {
    background: var(--green);
    border-color: var(--green);
    color: #0e1016;
  }
  .plan-num.on svg { width: 10px; height: 10px; }
  .plan-body { flex: 1; }
  .plan-range {
    font-size: 12px;
    color: var(--text-muted);
  }
  .plan-desc {
    font-size: 13.5px;
    color: var(--text-primary);
    line-height: 1.35;
  }
  .plan-desc.done { color: var(--green); text-decoration: line-through; text-decoration-color: var(--text-muted); }
  .divider { border-top: 1px solid var(--card-border); margin: 14px 0; }
  .reset-btn {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--text-secondary);
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 2rem;
    margin-right: 8px;
  }
  .reset-btn:hover { background: var(--pill-bg); }

  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 1.5rem;
  }
  .tab-btn {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--text-secondary);
    font-size: 13.5px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
  }
  .tab-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .view { display: none; }
  .view.active { display: block; }

  .week-title {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin: 1.5rem 0 8px;
    text-transform: uppercase;
  }
  .week-title:first-child { margin-top: 0; }
  .day-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 0.9rem 1.1rem;
    margin-bottom: 10px;
  }
  .day-card.exam { border-color: var(--amber); }
  .day-card.travel { opacity: 0.65; }
  .day-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .day-card-date { font-weight: 600; font-size: 14px; }
  .exam-badge {
    font-size: 11px;
    font-weight: 500;
    background: var(--pill-bg);
    color: var(--amber);
    padding: 3px 8px;
    border-radius: 6px;
  }
  .travel-badge { font-size: 11px; color: var(--text-muted); }
  .task-row {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    padding: 4px 0;
    cursor: pointer;
    font-size: 13.5px;
  }
  .task-mod {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    margin-right: 4px;
  }

  .notes-list { margin-bottom: 8px; }
  .note-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 5px 0;
    font-size: 13px;
    border-bottom: 1px solid var(--card-border);
  }
  .note-row:last-child { border-bottom: none; }
  .note-text { color: var(--text-primary); flex: 1; }
  .note-del {
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 2px 4px;
    flex-shrink: 0;
  }
  .note-del:hover { color: var(--text-primary); }
  .note-empty {
    font-size: 12.5px;
    color: var(--text-muted);
    padding: 4px 0 8px;
  }
  .note-add {
    display: flex;
    gap: 6px;
  }
  .note-input {
    flex: 1;
    background: var(--pill-bg);
    border: 1px solid var(--card-border);
    color: var(--text-primary);
    font-size: 13px;
    padding: 7px 10px;
    border-radius: 8px;
    outline: none;
  }
  .note-input::placeholder { color: var(--text-muted); }
  .note-add-btn {
    background: var(--accent);
    border: none;
    color: #fff;
    font-size: 13px;
    font-weight: 500;
    padding: 7px 12px;
    border-radius: 8px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .quiz-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .quiz-tab {
    flex: 1; min-width: 150px; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--card-border); background: var(--card); cursor: pointer; text-align: left;
  }
  .quiz-tab.active { border: 2px solid var(--accent); }
  .quiz-tab.locked { cursor: not-allowed; opacity: 0.55; }
  .quiz-tab-title { font-weight: 600; font-size: 14px; margin: 0 0 2px; color: var(--text-primary); }
  .quiz-tab-sub { font-size: 12px; color: var(--text-secondary); margin: 0; }
  .quiz-tab-score { font-size: 12px; color: var(--accent); font-weight: 600; margin-top: 4px; }
  .quiz-lock-note { font-size: 12px; color: var(--amber); margin-top: 4px; }
  .quiz-progress { height: 6px; border-radius: 3px; background: var(--card-border); overflow: hidden; margin-bottom: 20px; }
  .quiz-progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }
  .quiz-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; margin-bottom: 14px; overflow: hidden; }
  .quiz-q-head {
    background: rgba(255,255,255,0.02); padding: 14px 16px; font-size: 14.5px; font-weight: 500;
    border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; gap: 12px; color: var(--text-primary);
  }
  .quiz-q-num { color: var(--text-muted); font-weight: 600; margin-right: 6px; }
  .quiz-opt {
    display: flex; align-items: center; gap: 10px; padding: 13px 16px; font-size: 14px;
    border-bottom: 1px solid var(--card-border); cursor: pointer; color: var(--text-primary);
  }
  .quiz-opt:last-child { border-bottom: none; }
  .quiz-opt:hover { background: rgba(255,255,255,0.03); }
  .quiz-opt .quiz-dot {
    width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--text-muted); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff;
  }
  .quiz-opt.correct { background: rgba(52,211,153,0.12); }
  .quiz-opt.correct .quiz-dot { background: var(--green); border-color: var(--green); }
  .quiz-opt.wrong { background: rgba(239,68,68,0.12); }
  .quiz-opt.wrong .quiz-dot { background: #ef4444; border-color: #ef4444; }
  .quiz-opt.disabled-look { cursor: default; }
  .quiz-dot-square { border-radius: 4px; }
  .quiz-opt.selected { background: rgba(91,141,239,0.14); }
  .quiz-opt.selected .quiz-dot { background: var(--accent); border-color: var(--accent); }
  .quiz-opt.missed { background: rgba(245,166,35,0.14); }
  .quiz-opt.missed .quiz-dot { background: var(--amber); border-color: var(--amber); color: #0e1016; }
  .quiz-check-wrap { padding: 10px 16px 14px; border-top: 1px solid var(--card-border); }
  .quiz-check-btn {
    background: var(--accent); border: none; color: #fff; font-size: 13px; font-weight: 500;
    padding: 8px 16px; border-radius: 8px; cursor: pointer;
  }
  .quiz-explain {
    font-size: 13px; color: var(--text-secondary); padding: 12px 16px;
    background: rgba(255,255,255,0.02); border-top: 1px solid var(--card-border); display: none;
  }
  .quiz-explain.show { display: block; }
  .quiz-diagram-wrap {
    padding: 12px 16px 4px; background: rgba(255,255,255,0.015); border-bottom: 1px solid var(--card-border);
  }
  .quiz-diagram-wrap svg { width: 100%; height: auto; display: block; margin: 0 auto; max-width: 560px; }
  .quiz-calc-badge {
    font-size: 11px; font-weight: 600; color: var(--accent); background: var(--pill-bg);
    padding: 2px 8px; border-radius: 20px; white-space: nowrap; align-self: flex-start;
  }
  .quiz-summary {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px;
    text-align: center; font-size: 14px; margin-top: 4px; color: var(--text-primary);
  }
  .quiz-reset-btn {
    display: inline-block; margin-top: 10px; padding: 8px 16px; border-radius: 8px;
    border: 1px solid var(--card-border); background: var(--pill-bg); color: var(--text-primary); cursor: pointer; font-size: 13px;
  }

  .flashcard-progress-text { text-align: center; font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; }
  .flashcard-wrap { display: flex; justify-content: center; margin-bottom: 16px; }
  .flashcard {
    width: 100%; max-width: 560px; min-height: 180px; background: var(--card);
    border: 1px solid var(--card-border); border-radius: 14px; padding: 24px;
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-size: 16px; line-height: 1.5; color: var(--text-primary); cursor: pointer;
  }
  .flashcard-back { color: var(--text-secondary); }
  .flashcard-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .flashcard-btn {
    border: none; border-radius: 10px; padding: 10px 18px; font-size: 13px; font-weight: 500;
    cursor: pointer; color: #fff;
  }
  .flashcard-btn.show { background: var(--accent); }
  .flashcard-btn.again { background: #ef4444; }
  .flashcard-btn.know { background: var(--green); }
  .flashcard-btn.restart { background: var(--pill-bg); color: var(--text-primary); border: 1px solid var(--card-border); }
  .flashcard-stats { text-align: center; font-size: 13px; color: var(--text-secondary); margin-top: 10px; }
  .flashcard-hint { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 8px; }

  #lock-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 1.5rem;
  }
  .lock-box {
    max-width: 320px;
    width: 100%;
    text-align: center;
  }
  .lock-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .lock-sub {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 1.25rem;
  }
  .lock-input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text-primary);
    font-size: 15px;
    padding: 10px 14px;
    border-radius: 10px;
    outline: none;
    text-align: center;
    margin-bottom: 10px;
    box-sizing: border-box;
  }
  .lock-btn {
    width: 100%;
    background: var(--accent);
    border: none;
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
  }
  .lock-error {
    color: #ef4444;
    font-size: 12.5px;
    margin-top: 8px;
    min-height: 16px;
  }
  #app { display: none; }
  #app.unlocked { display: block; }
</style>
</head>

<script>
const STORAGE_KEY = 'uni-dashboard-progress';
const NOTES_KEY = 'uni-dashboard-notes';

const SUPABASE_URL = 'https://lusgeshniirqehnfytnl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_PxTl1rdS-GVDLxp5NYQ1og_qun86eXD';
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

let notes = {};

async function loadNotes() {
  // Erst lokalen Cache laden, damit sofort etwas angezeigt wird
  try {
    const raw = localStorage.getItem(NOTES_KEY);
    notes = raw ? JSON.parse(raw) : {};
  } catch (e) { notes = {}; }

  if (!sb) return;
  try {
    const { data, error } = await sb.from('app_data').select('value').eq('key', 'notes').single();
    if (error) throw error;
    if (data && data.value) {
      notes = data.value;
      try { localStorage.setItem(NOTES_KEY, JSON.stringify(notes)); } catch (e) {}
    }
  } catch (e) {
    console.error('Cloud-Notizen laden fehlgeschlagen, nutze lokalen Stand', e);
  }
}

async function saveNotes() {
  try { localStorage.setItem(NOTES_KEY, JSON.stringify(notes)); }
  catch (e) { console.error('Lokal speichern fehlgeschlagen', e); }

  if (!sb) return;
  try {
    const { error } = await sb.from('app_data')
      .update({ value: notes, updated_at: new Date().toISOString() })
      .eq('key', 'notes');
    if (error) throw error;
  } catch (e) {
    console.error('Cloud-Notizen speichern fehlgeschlagen', e);
  }
}

let state = {};

async function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    state = raw ? JSON.parse(raw) : {};
  } catch (e) { state = {}; }

  if (!sb) return;
  try {
    const { data, error } = await sb.from('app_data').select('value').eq('key', 'progress').single();
    if (error) throw error;
    if (data && data.value) {
      state = data.value;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }
  } catch (e) {
    console.error('Cloud-Fortschritt laden fehlgeschlagen, nutze lokalen Stand', e);
  }
}
async function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { console.error('Lokal speichern fehlgeschlagen', e); }

  if (!sb) return;
  try {
    const { error } = await sb.from('app_data')
      .update({ value: state, updated_at: new Date().toISOString() })
      .eq('key', 'progress');
    if (error) throw error;
  } catch (e) {
    console.error('Cloud-Fortschritt speichern fehlgeschlagen', e);
  }
}

// ---------- EBWL-Quiz-Statistiken (Schwachstellen-Priorisierung) ----------
// Merkt sich pro Frage (stabile baseId, unabhängig von Mischreihenfolge/Zufallszahlen),
// wie oft sie richtig/falsch beantwortet wurde. Fragen mit mehr Fehlern werden beim
// nächsten Üben weiter vorne einsortiert, ALLE Fragen bleiben aber immer im Pool
// (volle Theorie-Abdeckung, keine Frage fällt jemals raus).
const QUIZ_STATS_KEY = 'ebwl-quiz-stats';
let quizStats = {};

async function loadQuizStats() {
  try {
    const raw = localStorage.getItem(QUIZ_STATS_KEY);
    quizStats = raw ? JSON.parse(raw) : {};
  } catch (e) { quizStats = {}; }

  if (!sb) return;
  try {
    const { data, error } = await sb.from('app_data').select('value').eq('key', 'quizStats').single();
    if (error) throw error;
    if (data && data.value) {
      quizStats = data.value;
      try { localStorage.setItem(QUIZ_STATS_KEY, JSON.stringify(quizStats)); } catch (e) {}
    }
  } catch (e) {
    console.error('Cloud-Quiz-Statistik laden fehlgeschlagen (evtl. noch nicht angelegt), nutze lokalen Stand', e);
  }
}

async function saveQuizStats() {
  try { localStorage.setItem(QUIZ_STATS_KEY, JSON.stringify(quizStats)); }
  catch (e) { console.error('Lokal speichern fehlgeschlagen', e); }

  if (!sb) return;
  try {
    const { error } = await sb.from('app_data')
      .upsert({ key: 'quizStats', value: quizStats, updated_at: new Date().toISOString() }, { onConflict: 'key' });
    if (error) throw error;
  } catch (e) {
    console.error('Cloud-Quiz-Statistik speichern fehlgeschlagen', e);
  }
}

function quizRecordStat(key, baseId, isCorrect) {
  if (!baseId) return;
  if (!quizStats[key]) quizStats[key] = {};
  if (!quizStats[key][baseId]) quizStats[key][baseId] = { correct: 0, wrong: 0 };
  if (isCorrect) quizStats[key][baseId].correct++; else quizStats[key][baseId].wrong++;
  saveQuizStats();
}

function daysUntil(dateStr) {
  const target = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  const nowMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((target - nowMid) / 86400000);
}

function allIds(mod) {
  const set = new Set();
  mod.lernplan.forEach(block => block.ids.forEach(id => set.add(id)));
  mod.altklausuren.forEach(item => item.ids.forEach(id => set.add(id)));
  return [...set];
}

function planRow(mod, i, block) {
  const on = block.ids.every(id => state[id]);
  const doneCount = block.ids.filter(id => state[id]).length;
  const desc = block.daily ? `${block.desc} (${doneCount}/${block.ids.length} Tage)` : block.desc;
  return `<div class="plan-row" data-ids="${block.ids.join(',')}">
    <div class="plan-num ${on ? 'on' : ''}">${on ? checkIcon() : (i+1)}</div>
    <div class="plan-body">
      <div class="plan-range">${block.range}</div>
      <div class="plan-desc ${on ? 'done' : ''}">${desc}</div>
    </div>
  </div>`;
}

function ring(pct) {
  const r = 22, c = 2*Math.PI*r;
  const off = c - (pct/100)*c;
  return `<div class="ring-wrap">
    <svg width="54" height="54" viewBox="0 0 54 54">
      <circle cx="27" cy="27" r="${r}" fill="none" stroke="#262a38" stroke-width="5"/>
      <circle cx="27" cy="27" r="${r}" fill="none" stroke="var(--green)" stroke-width="5"
        stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/>
    </svg>
    <div class="ring-label">${pct}%</div>
  </div>`;
}

function checkIcon() {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="#0e1016" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
}

function itemRow(item) {
  const on = item.ids.every(id => state[id]);
  return `<div class="item-row" data-ids="${item.ids.join(',')}">
    <div class="check ${on ? 'on' : ''}">${on ? checkIcon() : ''}</div>
    <span class="item-text ${on ? 'done' : ''}">${item.text}</span>
  </div>`;
}

function render() {
  const grid = document.getElementById('grid');
  const sorted = [...MODULES].sort((a,b) => daysUntil(a.date) - daysUntil(b.date));

  grid.innerHTML = sorted.map(mod => {
    const ids = allIds(mod);
    const done = ids.filter(id => state[id]).length;
    const pct = ids.length ? Math.round(done/ids.length*100) : 0;
    const days = daysUntil(mod.date);
    const dateLabel = new Date(mod.date+'T00:00:00').toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit', year:'2-digit' });
    const daysLabel = days < 0 ? 'vorbei' : (days === 0 ? 'heute' : 'noch ' + days + ' Tage');

    return `
    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">${mod.name}</div>
          <div class="card-sub">${done} von ${ids.length} Punkten fertig</div>
        </div>
        ${ring(pct)}
      </div>
      <div class="badge">${dateLabel} · ${daysLabel}</div>

      <div class="section-label">ALTKLAUSUREN</div>
      ${mod.altklausuren.map(item => itemRow(item)).join('')}

      <div class="divider"></div>
      <div class="section-label">NICHT VERSTANDEN ODER WIEDERHOLEN</div>
      <div class="notes-list">
        ${(notes[mod.id] && notes[mod.id].length) ? notes[mod.id].map((n, ni) => `
          <div class="note-row">
            <span class="note-text">${n}</span>
            <button class="note-del" data-mod="${mod.id}" data-idx="${ni}" aria-label="Eintrag entfernen">×</button>
          </div>
        `).join('') : '<div class="note-empty">Noch nichts eingetragen</div>'}
      </div>
      <div class="note-add">
        <input class="note-input" type="text" placeholder="z. B. Fehlerfortpflanzung nicht verstanden" data-mod-input="${mod.id}" />
        <button class="note-add-btn" data-mod-add="${mod.id}">Hinzufügen</button>
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('.item-row, .plan-row').forEach(row => {
    row.addEventListener('click', () => {
      const ids = row.dataset.ids.split(',');
      const allOn = ids.every(id => state[id]);
      ids.forEach(id => { state[id] = !allOn; });
      saveState();
      render();
      renderDay();
    });
  });

  grid.querySelectorAll('.note-del').forEach(btn => {
    btn.addEventListener('click', () => {
      const modId = btn.dataset.mod;
      const idx = parseInt(btn.dataset.idx, 10);
      notes[modId].splice(idx, 1);
      saveNotes();
      render();
    });
  });

  grid.querySelectorAll('.note-add-btn').forEach(btn => {
    btn.addEventListener('click', () => addNote(btn.dataset.modAdd));
  });
  grid.querySelectorAll('.note-input').forEach(input => {
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addNote(input.dataset.modInput);
    });
  });
}

function addNote(modId) {
  const input = document.querySelector(`.note-input[data-mod-input="${modId}"]`);
  const text = input.value.trim();
  if (!text) return;
  if (!notes[modId]) notes[modId] = [];
  notes[modId].push(text);
  saveNotes();
  render();
}

function renderDay() {
  const el = document.getElementById('dayplan');
  el.innerHTML = DAYPLAN.map(week => `
    <div class="week-title">${week.title}</div>
    ${week.days.map(day => `
      <div class="day-card ${day.exam ? 'exam' : ''} ${day.travel ? 'travel' : ''}">
        <div class="day-card-header">
          <span class="day-card-date">${day.label}</span>
          ${day.exam ? `<span class="exam-badge">${day.exam}</span>` : ''}
          ${day.travel ? `<span class="travel-badge">Reisetag</span>` : ''}
        </div>
        ${day.tasks.map((t, ti) => {
          const id = 'day-' + day.date + '-' + ti;
          const on = !!state[id];
          return `<div class="task-row" data-id="${id}">
            <div class="check ${on ? 'on' : ''}">${on ? checkIcon() : ''}</div>
            <span>${t.mod ? `<span class="task-mod">${t.mod}:</span>` : ''}<span class="item-text ${on ? 'done' : ''}">${t.text}</span></span>
          </div>`;
        }).join('')}
      </div>
    `).join('')}
  `).join('');

  el.querySelectorAll('.task-row').forEach(row => {
    row.addEventListener('click', () => {
      const id = row.dataset.id;
      state[id] = !state[id];
      saveState();
      renderDay();
      render();
    });
  });
}

function showView(viewId, tabId) {
  ['view-module', 'view-day', 'view-quiz', 'view-wk1cards', 'view-ebwlcards'].forEach(id => {
    document.getElementById(id).classList.toggle('active', id === viewId);

  ['tab-module', 'tab-day', 'tab-quiz', 'tab-wk1cards', 'tab-ebwlcards'].forEach(id => {
    document.getElementById(id).classList.toggle('active', id === tabId);
  });
}

const quizVariantFrom = new Date(2026,7,3);
const quizVariantMode = quizToday >= quizVariantFrom;

function quizRandInt(min, max, step) {
  step = step || 1;
  const n = Math.floor(Math.random() * ((max - min) / step + 1));
  return min + n * step;
}
function quizShuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function quizDe(n) { return Math.round(n).toLocaleString('de-DE'); }
function quizMakeDistinct(correctVal, rawDistractors, gap) {
  const used = [correctVal];
  const result = [];
  rawDistractors.forEach(raw => {
    let v = Math.round(raw);
    let guard = 0;
    while (used.indexOf(v) !== -1) {
      guard++;
      const step = gap * Math.ceil(guard / 2);
      v = Math.round(raw) + (guard % 2 === 0 ? -step : step);
      if (guard > 30) { v = correctVal + Math.round((Math.random() * 20 - 10) * gap); }
    }
    used.push(v);
    result.push(v);
  });
  return result;
}
function quizBuildOptions(correctVal, distractors, suffix) {
  const values = quizShuffle([correctVal, ...distractors]);
  const opts = values.map(v => (v < 0 ? '−' : '') + quizDe(Math.abs(v)) + suffix);
  const correct = values.indexOf(correctVal);
  return { opts, correct };
}

const QUIZ_CALC_GENERATORS = {
  kapitalwert: function () {
    const invest = quizRandInt(20000, 45000, 5000);
    const kosten = quizRandInt(3000, 8000, 500);
    const umsatz = quizRandInt(15000, 32000, 1000);
    const zinsPct = quizRandInt(5, 15, 1);
    const t = quizRandInt(2, 4, 1);
    const i = zinsPct / 100;
    const gewinn = umsatz - kosten;
    let npv = -invest;
    for (let k = 1; k <= t; k++) npv += gewinn / Math.pow(1 + i, k);
    const correctVal = Math.round(npv);
    const rawDistractors = [
      gewinn * t - invest,
      -invest + gewinn / (1 + i),
      invest - gewinn * t
    ];
    const distractors = quizMakeDistinct(correctVal, rawDistractors, 350);
    const built = quizBuildOptions(correctVal, distractors, ' €');
    return {
      q: `Rechenaufgabe: Anschaffung ${quizDe(invest)} €, fixe + variable Kosten ${quizDe(kosten)} €/Jahr, Umsatzerlöse ${quizDe(umsatz)} €/Jahr, Zins ${zinsPct} %, t = ${t} Jahre. Wie hoch ist der Kapitalwert?`,
      opts: built.opts, correct: built.correct, calc: true,
      explain: `Gewinn/Jahr = ${quizDe(gewinn)} €. Kapitalwert = −${quizDe(invest)} + Summe Gewinn/(1+${i.toString().replace('.', ',')})^t über ${t} Jahre ≈ ${quizDe(correctVal)} €.`
    };
  },
  ccc: function () {
    const ukTag = quizRandInt(400, 800, 50);
    const uTag = quizRandInt(ukTag + 50, 900, 50);
    const vorraete = quizRandInt(20000, 50000, 1000);
    const forderungen = quizRandInt(10000, 30000, 1000);
    const verbindlichkeiten = quizRandInt(10000, 30000, 1000);
    const dio = vorraete / ukTag;
    const dso = forderungen / uTag;
    const dpo = verbindlichkeiten / ukTag;
    const correctVal = Math.round(dio + dso - dpo);
    const rawDistractors = [dio + dso + dpo, dio - dso + dpo, dio + dpo];
    const distractors = quizMakeDistinct(correctVal, rawDistractors, 8);
    const built = quizBuildOptions(correctVal, distractors, ' Tage');
    return {
      q: `Rechenaufgabe: Umsatzkosten pro Tag ${quizDe(ukTag)} €, Umsatz pro Tag ${quizDe(uTag)} €, durchschn. Vorräte ${quizDe(vorraete)} €, durchschn. Forderungen ${quizDe(forderungen)} €, durchschn. Verbindlichkeiten ${quizDe(verbindlichkeiten)} €. Wie hoch ist der Cash Conversion Cycle (CCC) in Tagen?`,
      opts: built.opts, correct: built.correct, calc: true,
      explain: `DIO = ${quizDe(vorraete)}/${quizDe(ukTag)} ≈ ${Math.round(dio)}. DSO = ${quizDe(forderungen)}/${quizDe(uTag)} ≈ ${Math.round(dso)}. DPO = ${quizDe(verbindlichkeiten)}/${quizDe(ukTag)} ≈ ${Math.round(dpo)}. CCC = DIO + DSO − DPO ≈ ${quizDe(correctVal)} Tage.`
    };
  },
  andler: function () {
    const m = quizRandInt(50000, 150000, 10000);
    const kB = quizRandInt(8, 20, 1);
    const w = quizRandInt(5, 50, 5) / 100;
    const iSatz = quizRandInt(5, 20, 1) / 100;
    const q = Math.sqrt(2 * m * kB / (w * iSatz));
    const correctVal = Math.round(q);
    const rawDistractors = [
      Math.sqrt(m * kB / (w * iSatz)),
      Math.sqrt(2 * m * kB / w),
      q * 1.5
    ];
    const distractors = quizMakeDistinct(correctVal, rawDistractors, 200);
    const built = quizBuildOptions(correctVal, distractors, ' Stück');
    return {
      q: `Rechenaufgabe (Andlerformel): Jährlicher Bedarf ${quizDe(m)} Stück, Bestellkosten ${kB} €, Einkaufspreis ${w.toFixed(2).replace('.', ',')} €, Lagerkostensatz ${iSatz.toFixed(2).replace('.', ',')}. Wie hoch ist die optimale Bestellmenge?`,
      opts: built.opts, correct: built.correct, calc: true,
      explain: `q = √(2·${quizDe(m)}·${kB} / (${w.toFixed(2).replace('.', ',')}·${iSatz.toFixed(2).replace('.', ',')})) ≈ ${quizDe(correctVal)} Stück.`
    };
  },
  breakeven: function () {
    const fix = quizRandInt(80000, 200000, 10000);
    const preis = quizRandInt(10, 25, 1);
    const varK = quizRandInt(Math.round(preis * 0.3), Math.round(preis * 0.7), 1);
    const margin = preis - varK;
    const correctVal = Math.round(fix / margin);
    const rawDistractors = [fix / preis, fix / varK, fix * margin / 1000];
    const distractors = quizMakeDistinct(correctVal, rawDistractors, 400);
    const built = quizBuildOptions(correctVal, distractors, ' Stück');
    return {
      q: `Rechenaufgabe: Fixkosten ${quizDe(fix)} €, Verkaufspreis ${preis} €/Stück, variable Kosten ${varK} €/Stück. Wie hoch ist der Break-Even-Point in Stück?`,
      opts: built.opts, correct: built.correct, calc: true,
      explain: `BEP = Fixkosten / (Preis − variable Kosten) = ${quizDe(fix)} / (${preis} − ${varK}) ≈ ${quizDe(correctVal)} Stück.`
    };
  }
};

function quizShuffleOptions(item) {
  const idxs = quizShuffle(item.opts.map((_, i) => i));
  const newCorrect = item.multi
    ? item.correct.map(oldIdx => idxs.indexOf(oldIdx))
    : idxs.indexOf(item.correct);
  return {
    q: item.q,
    opts: idxs.map(i => item.opts[i]),
    correct: newCorrect,
    explain: item.explain,
    calc: item.calc,
    multi: item.multi,
    diagramKey: item.diagramKey,
    formula: item.formula
  };
}

// Formeln müssen "sitzen": Formel-Fragen bekommen einen festen Bonus auf ihren Fehler-Score,
// damit sie so lange bevorzugt vorne im Quiz auftauchen, bis sie mehrfach hintereinander
// richtig beantwortet wurden (jede richtige Antwort senkt den Score um 0.5) – aber auch sie
// werden nie aus dem Pool entfernt, sie werden nur priorisiert.
const QUIZ_FORMULA_BOOST = 3;

function quizWeightedOrder(key, list) {
  // Zufällig vormischen (sorgt für Zufall unter gleich gewichteten Fragen, da sort() stabil ist),
  // dann nach "Fehlerquote" (+ Formel-Bonus) absteigend sortieren: oft falsch beantwortete / noch
  // nie geübte Fragen und alle Formel-Fragen kommen zuerst dran, sicher gewusste rutschen nach
  // hinten – aber NICHTS wird je entfernt, die komplette Theorie bleibt jede Session vollständig.
  const stats = quizStats[key] || {};
  const shuffled = quizShuffle(list);
  return shuffled
    .map((item, i) => ({ item, i }))
    .sort((a, b) => {
      const sa = stats[a.item.baseId] || { correct: 0, wrong: 0 };
      const sb = stats[b.item.baseId] || { correct: 0, wrong: 0 };
      const scoreA = sa.wrong - sa.correct * 0.5 + (a.item.formula ? QUIZ_FORMULA_BOOST : 0);
      const scoreB = sb.wrong - sb.correct * 0.5 + (b.item.formula ? QUIZ_FORMULA_BOOST : 0);
      if (scoreB !== scoreA) return scoreB - scoreA;
      return a.i - b.i;
    })
    .map(x => x.item);
}

function quizBuildVariant(key) {
  const base = QUIZ_DATA[key].questions;
  const list = base.map((it, i) => {
    const built = (quizVariantMode && it.genKey) ? QUIZ_CALC_GENERATORS[it.genKey]() : quizShuffleOptions(it);
    built.baseId = key + i;
    built.formula = it.formula || built.formula;
    return built;
  });
  return quizWeightedOrder(key, list);
}

const quizState = { active: 'A', answers: { A: {}, B: {}, C: {} }, variant: { A: null, B: null, C: null }, pending: { A: {}, B: {}, C: {} } };

function quizEnsureVariant(key) {
  if (!quizState.variant[key]) quizState.variant[key] = quizBuildVariant(key);
  return quizState.variant[key];
}

function quizIsLocked(key) {
  const d = QUIZ_DATA[key].unlockDate;
  if (!d) return false;
  return quizToday < d;
}
function quizFmtDate(d) {
  return d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
}

function renderQuizTabs() {
  const el = document.getElementById('quizTabs');
  el.innerHTML = '';
  Object.keys(QUIZ_DATA).forEach(key => {
    const locked = quizIsLocked(key);
    const div = document.createElement('div');
    div.className = 'quiz-tab' + (quizState.active === key ? ' active' : '') + (locked ? ' locked' : '');
    const answered = Object.keys(quizState.answers[key]).length;
    const total = QUIZ_DATA[key].questions.length;
    const correctCount = Object.values(quizState.answers[key]).filter(v => v.correct).length;
    div.innerHTML = `
      <p class="quiz-tab-title">${locked ? '🔒 ' : ''}${QUIZ_DATA[key].label}</p>
      <p class="quiz-tab-sub">${QUIZ_DATA[key].sub}</p>
      ${locked ? `<p class="quiz-lock-note">ab ${quizFmtDate(QUIZ_DATA[key].unlockDate)}</p>` :
        `<p class="quiz-tab-score">${answered > 0 ? correctCount + ' / ' + answered + ' richtig' : total + ' Fragen'}</p>`}
    `;
    if (!locked) div.onclick = () => { quizState.active = key; renderQuiz(); };
    el.appendChild(div);
  });
}

function renderQuizPanel() {
  const panel = document.getElementById('quizPanel');
  panel.innerHTML = '';
  const key = quizState.active;
  if (quizIsLocked(key)) {
    panel.innerHTML = `<div class="quiz-summary">Dieser Teil ist laut deinem Lernplan erst ab ${quizFmtDate(QUIZ_DATA[key].unlockDate)} dran.</div>`;
    document.getElementById('quizProgressFill').style.width = '0%';
    return;
  }
  const qs = quizEnsureVariant(key);
  qs.forEach((item, qi) => {
    const card = document.createElement('div');
    card.className = 'quiz-card';
    const isMulti = !!item.multi;
    const answered = quizState.answers[key][qi];
    const multiHint = isMulti ? '<span class="quiz-calc-badge">Mehrfachauswahl</span>' : '';
    card.innerHTML = `
      <div class="quiz-q-head"><div><span class="quiz-q-num">${qi + 1}.</span>${item.q}</div>${item.calc ? '<span class="quiz-calc-badge">Rechenaufgabe</span>' : multiHint}</div>
      ${item.diagramKey && QUIZ_DIAGRAMS[item.diagramKey] ? `<div class="quiz-diagram-wrap">${QUIZ_DIAGRAMS[item.diagramKey]}</div>` : ''}
      <div class="quiz-opts"></div>
      <div class="quiz-explain ${answered !== undefined ? 'show' : ''}">${item.explain}</div>
    `;
    const optsWrap = card.querySelector('.quiz-opts');

    if (!isMulti) {
      item.opts.forEach((optText, oi) => {
        const optDiv = document.createElement('div');
        let cls = 'quiz-opt';
        if (answered !== undefined) {
          cls += ' disabled-look';
          if (oi === item.correct) cls += ' correct';
          else if (oi === answered.idx) cls += ' wrong';
        }
        optDiv.className = cls;
        const letter = String.fromCharCode(65 + oi);
        let dotContent = letter;
        if (answered !== undefined && oi === item.correct) dotContent = '✓';
        else if (answered !== undefined && oi === answered.idx) dotContent = '✗';
        optDiv.innerHTML = `<span class="quiz-dot">${dotContent}</span><span>${optText}</span>`;
        if (answered === undefined) {
          optDiv.onclick = () => {
            const isCorrect = oi === item.correct;
            quizState.answers[key][qi] = { idx: oi, correct: isCorrect };
            quizRecordStat(key, item.baseId, isCorrect);
            renderQuiz();
          };
        }
        optsWrap.appendChild(optDiv);
      });
    } else {
      if (!quizState.pending[key][qi]) quizState.pending[key][qi] = [];
      const pending = quizState.pending[key][qi];
      item.opts.forEach((optText, oi) => {
        const optDiv = document.createElement('div');
        let cls = 'quiz-opt';
        const isSelected = pending.includes(oi);
        const isCorrectOpt = item.correct.includes(oi);
        if (answered !== undefined) {
          cls += ' disabled-look';
          const wasSelected = answered.selected.includes(oi);
          if (isCorrectOpt && wasSelected) cls += ' correct';
          else if (!isCorrectOpt && wasSelected) cls += ' wrong';
          else if (isCorrectOpt && !wasSelected) cls += ' missed';
        } else if (isSelected) {
          cls += ' selected';
        }
        optDiv.className = cls;
        let dotContent = '';
        if (answered !== undefined) {
          const wasSelected = answered.selected.includes(oi);
          if (isCorrectOpt && wasSelected) dotContent = '✓';
          else if (!isCorrectOpt && wasSelected) dotContent = '✗';
          else if (isCorrectOpt && !wasSelected) dotContent = '!';
        } else if (isSelected) {
          dotContent = '✓';
        }
        optDiv.innerHTML = `<span class="quiz-dot quiz-dot-square">${dotContent}</span><span>${optText}</span>`;
        if (answered === undefined) {
          optDiv.onclick = () => {
            const idx = pending.indexOf(oi);
            if (idx === -1) pending.push(oi); else pending.splice(idx, 1);
            renderQuiz();
          };
        }
        optsWrap.appendChild(optDiv);
      });
      if (answered === undefined) {
        const checkWrap = document.createElement('div');
        checkWrap.className = 'quiz-check-wrap';
        checkWrap.innerHTML = `<button class="quiz-check-btn" ${pending.length === 0 ? 'disabled' : ''}>Antwort prüfen</button>`;
        checkWrap.querySelector('button').onclick = () => {
          const selSorted = [...pending].sort((a,b)=>a-b);
          const corrSorted = [...item.correct].sort((a,b)=>a-b);
          const isRight = selSorted.length === corrSorted.length && selSorted.every((v,i) => v === corrSorted[i]);
          quizState.answers[key][qi] = { selected: selSorted, correct: isRight };
          quizRecordStat(key, item.baseId, isRight);
          delete quizState.pending[key][qi];
          renderQuiz();
        };
        card.appendChild(checkWrap);
      }
    }
    panel.appendChild(card);
  });

  const answeredCount = Object.keys(quizState.answers[key]).length;
  const total = qs.length;
  const correctCount = Object.values(quizState.answers[key]).filter(v => v.correct).length;
  document.getElementById('quizProgressFill').style.width = (answeredCount / total * 100) + '%';

  if (answeredCount === total) {
    const summary = document.createElement('div');
    summary.className = 'quiz-summary';
    const stats = quizStats[key] || {};
    const masteredCount = QUIZ_DATA[key].questions.filter((it, i) => {
      const s = stats[key + i];
      return s && s.correct >= 2 && s.wrong === 0;
    }).length;
    summary.innerHTML = `${QUIZ_DATA[key].label} abgeschlossen: <strong>${correctCount} / ${total}</strong> richtig.<br><span style="font-size:12px;color:var(--text-muted);">Sicher gewusst (≥2× richtig, nie falsch): ${masteredCount} / ${QUIZ_DATA[key].questions.length}</span><br><span class="quiz-reset-btn" id="quizResetBtn">${quizVariantMode ? 'Neue Fragen üben' : 'Nochmal üben'}</span>`;
    panel.appendChild(summary);
    document.getElementById('quizResetBtn').onclick = () => {
      quizState.answers[key] = {};
      quizState.pending[key] = {};
      quizState.variant[key] = quizBuildVariant(key);
      renderQuiz();
    };
  }
}

function renderQuiz() {
  renderQuizTabs();
  renderQuizPanel();
}

const wk1State = {
  active: 'kristall',
  order: { kristall: null, riss: null, kriechen: null },
  index: { kristall: 0, riss: 0, kriechen: 0 },
  flipped: { kristall: false, riss: false, kriechen: false },
  stats: { kristall: { know: 0, again: 0 }, riss: { know: 0, again: 0 }, kriechen: { know: 0, again: 0 } }
};

function wk1EnsureOrder(key) {
  if (!wk1State.order[key]) wk1State.order[key] = quizShuffle(WK1_CARDS[key].cards.map((_, i) => i));
  return wk1State.order[key];
}

function renderWk1Tabs() {
  const el = document.getElementById('wk1Tabs');
  el.innerHTML = '';
  Object.keys(WK1_CARDS).forEach(key => {
    const order = wk1EnsureOrder(key);
    const idx = Math.min(wk1State.index[key], order.length);
    const div = document.createElement('div');
    div.className = 'quiz-tab' + (wk1State.active === key ? ' active' : '');
    div.innerHTML = `
      <p class="quiz-tab-title">${WK1_CARDS[key].label}</p>
      <p class="quiz-tab-sub">${WK1_CARDS[key].sub}</p>
      <p class="quiz-tab-score">${idx} / ${order.length} Karten</p>
    `;
    div.onclick = () => { wk1State.active = key; renderWk1(); };
    el.appendChild(div);
  });
}

function wk1NextCard(key) {
  wk1State.index[key]++;
  wk1State.flipped[key] = false;
  renderWk1();
}

function renderWk1Panel() {
  const panel = document.getElementById('wk1Panel');
  panel.innerHTML = '';
  const key = wk1State.active;
  const order = wk1EnsureOrder(key);
  const idx = wk1State.index[key];
  const stats = wk1State.stats[key];

  if (idx >= order.length) {
    panel.innerHTML = `
      <div class="quiz-summary">
        ${WK1_CARDS[key].label} durchgearbeitet: <strong>${stats.know} / ${order.length}</strong> direkt gewusst.<br>
        <span class="quiz-reset-btn" id="wk1RestartBtn">Neu mischen &amp; nochmal üben</span>
      </div>
    `;
    document.getElementById('wk1RestartBtn').onclick = () => {
      wk1State.order[key] = null;
      wk1State.index[key] = 0;
      wk1State.flipped[key] = false;
      wk1State.stats[key] = { know: 0, again: 0 };
      renderWk1();
    };
    return;
  }

  const card = WK1_CARDS[key].cards[order[idx]];
  const flipped = wk1State.flipped[key];

  const progressText = document.createElement('div');
  progressText.className = 'flashcard-progress-text';
  progressText.textContent = `Karte ${idx + 1} von ${order.length}`;
  panel.appendChild(progressText);

  const wrap = document.createElement('div');
  wrap.className = 'flashcard-wrap';
  const cardDiv = document.createElement('div');
  cardDiv.className = 'flashcard';
  cardDiv.innerHTML = flipped ? `<div class="flashcard-back">${card.back}</div>` : `<div>${card.front}</div>`;
  if (!flipped) cardDiv.onclick = () => { wk1State.flipped[key] = true; renderWk1(); };
  wrap.appendChild(cardDiv);
  panel.appendChild(wrap);

  const actions = document.createElement('div');
  actions.className = 'flashcard-actions';
  if (!flipped) {
    actions.innerHTML = `<button class="flashcard-btn show">Antwort zeigen</button>`;
    actions.querySelector('.show').onclick = () => { wk1State.flipped[key] = true; renderWk1(); };
  } else {
    actions.innerHTML = `<button class="flashcard-btn again">Nochmal 🔁</button><button class="flashcard-btn know">Weiß ich ✓</button>`;
    actions.querySelector('.again').onclick = () => {
      stats.again++;
      order.push(order[idx]);
      wk1NextCard(key);
    };
    actions.querySelector('.know').onclick = () => {
      stats.know++;
      wk1NextCard(key);
    };
  }
  panel.appendChild(actions);

  const hint = document.createElement('div');
  hint.className = 'flashcard-hint';
  hint.textContent = flipped ? '' : 'Karte anklicken oder Button drücken, um die Antwort zu sehen.';
  panel.appendChild(hint);

  const statsEl = document.createElement('div');
  statsEl.className = 'flashcard-stats';
  statsEl.textContent = `Gewusst: ${stats.know} · Nochmal: ${stats.again}`;
  panel.appendChild(statsEl);
}

function renderWk1() {
  renderWk1Tabs();
  renderWk1Panel();
}

      explain: "Eigenkapital = 25 % von 1.200 Mio. = 300 Mio. €. Gewinnmarge = 200/1.700 ≈ 11,76 % ≈ 12 %. Kapitalumschlag = 1.700/1.200 ≈ 141,67 % ≈ 142 %. EK-Multiplikator = 1.200/300 = 400 %. ROE = 0,1176 · 1,4167 · 4 ≈ 0,667 = 66,7 % ≈ 67 %. Kontrolle: ROE = Nettogewinn/EK = 200/300 ≈ 66,7 % ✓." }
  ]}
};

const ebwlCardState = {
  active: 'invest',
  order: { invest: null, produktion: null, controlling: null },
  instance: { invest: {}, produktion: {}, controlling: {} },
  index: { invest: 0, produktion: 0, controlling: 0 },
  answer: { invest: null, produktion: null, controlling: null },
  stats: { invest: { correct: 0, wrong: 0 }, produktion: { correct: 0, wrong: 0 }, controlling: { correct: 0, wrong: 0 } }
};

function ebwlEnsureOrder(key) {
  if (!ebwlCardState.order[key]) {
    ebwlCardState.order[key] = quizShuffle(EBWL_FORMULA_QUIZ[key].questions.map((_, i) => i));
    ebwlCardState.instance[key] = {};
  }
  return ebwlCardState.order[key];
}

// Liefert die tatsächlich anzuzeigende Frage: bei genKey wird einmal pro Durchlauf
// frisch generiert (neue Zahlen), sonst die statische Formel-/Rechenaufgabe.
function ebwlGetQuestion(key, srcIdx) {
  const src = EBWL_FORMULA_QUIZ[key].questions[srcIdx];
  if (src.genKey) {
    if (!ebwlCardState.instance[key][srcIdx]) {
      ebwlCardState.instance[key][srcIdx] = QUIZ_CALC_GENERATORS[src.genKey]();
    }
    return ebwlCardState.instance[key][srcIdx];
  }
  return src;
}

function renderEbwlCardsTabs() {
  const el = document.getElementById('ebwlTabs');
  el.innerHTML = '';
  Object.keys(EBWL_FORMULA_QUIZ).forEach(key => {
    const order = ebwlEnsureOrder(key);
    const idx = Math.min(ebwlCardState.index[key], order.length);
    const div = document.createElement('div');
    div.className = 'quiz-tab' + (ebwlCardState.active === key ? ' active' : '');
    div.innerHTML = `
      <p class="quiz-tab-title">${EBWL_FORMULA_QUIZ[key].label}</p>
      <p class="quiz-tab-sub">${EBWL_FORMULA_QUIZ[key].sub}</p>
      <p class="quiz-tab-score">${idx} / ${order.length} Aufgaben</p>
    `;
    div.onclick = () => { ebwlCardState.active = key; renderEbwlCards(); };
    el.appendChild(div);
  });
}

function ebwlCardsNext(key) {
  ebwlCardState.index[key]++;
  ebwlCardState.answer[key] = null;
  renderEbwlCards();
}

function renderEbwlCardsPanel() {
  const panel = document.getElementById('ebwlPanel');
  panel.innerHTML = '';
  const key = ebwlCardState.active;
  const order = ebwlEnsureOrder(key);
  const idx = ebwlCardState.index[key];
  const stats = ebwlCardState.stats[key];
  const total = EBWL_FORMULA_QUIZ[key].questions.length;

  if (idx >= order.length) {
    panel.innerHTML = `
      <div class="quiz-summary">
        ${EBWL_FORMULA_QUIZ[key].label} durchgerechnet: <strong>${stats.correct} / ${order.length}</strong> richtig.<br>
        <span class="quiz-reset-btn" id="ebwlCardsRestartBtn">Neu mischen &amp; nochmal rechnen</span>
      </div>
    `;
    document.getElementById('ebwlCardsRestartBtn').onclick = () => {
      ebwlCardState.order[key] = null;
      ebwlCardState.index[key] = 0;
      ebwlCardState.answer[key] = null;
      ebwlCardState.stats[key] = { correct: 0, wrong: 0 };
      renderEbwlCards();
    };
    return;
  }

  const q = ebwlGetQuestion(key, order[idx]);
  const answer = ebwlCardState.answer[key];

  const progressText = document.createElement('div');
  progressText.className = 'flashcard-progress-text';
  progressText.textContent = `Aufgabe ${idx + 1} von ${order.length} (von ${total} in diesem Kapitel)`;
  panel.appendChild(progressText);

  const card = document.createElement('div');
  card.className = 'quiz-card';
  card.innerHTML = `
    <div class="quiz-q-head"><div>${q.q}</div>${q.calc ? '<span class="quiz-calc-badge">Rechenaufgabe</span>' : '<span class="quiz-calc-badge">Formel</span>'}</div>
    ${q.diagramKey && QUIZ_DIAGRAMS[q.diagramKey] ? `<div class="quiz-diagram-wrap">${QUIZ_DIAGRAMS[q.diagramKey]}</div>` : ''}
    <div class="quiz-opts"></div>
    <div class="quiz-explain ${answer !== null ? 'show' : ''}">${q.explain}</div>
  `;
  const optsWrap = card.querySelector('.quiz-opts');
  q.opts.forEach((optText, oi) => {
    const optDiv = document.createElement('div');
    let cls = 'quiz-opt';
    if (answer !== null) {
      cls += ' disabled-look';
      if (oi === q.correct) cls += ' correct';
      else if (oi === answer) cls += ' wrong';
    }
    optDiv.className = cls;
    const letter = String.fromCharCode(65 + oi);
    let dotContent = letter;
    if (answer !== null && oi === q.correct) dotContent = '✓';
    else if (answer !== null && oi === answer) dotContent = '✗';
    optDiv.innerHTML = `<span class="quiz-dot">${dotContent}</span><span>${optText}</span>`;
    if (answer === null) {
      optDiv.onclick = () => {
        ebwlCardState.answer[key] = oi;
        if (oi === q.correct) stats.correct++; else stats.wrong++;
        renderEbwlCards();
      };
    }
    optsWrap.appendChild(optDiv);
  });
  panel.appendChild(card);

  if (answer !== null) {
    const nextWrap = document.createElement('div');
    nextWrap.className = 'flashcard-actions';
    nextWrap.innerHTML = `<button class="flashcard-btn show">Nächste Aufgabe →</button>`;
    nextWrap.querySelector('button').onclick = () => ebwlCardsNext(key);
    panel.appendChild(nextWrap);
  } else {
    const hint = document.createElement('div');
    hint.className = 'flashcard-hint';
    hint.textContent = 'Erst rechnen, dann Antwort auswählen. Danach zeige ich dir die passende Formel.';
    panel.appendChild(hint);
  }

  const statsEl = document.createElement('div');
  statsEl.className = 'flashcard-stats';
  statsEl.textContent = `Richtig: ${stats.correct} · Falsch: ${stats.wrong}`;
  panel.appendChild(statsEl);
}

function renderEbwlCards() {
  renderEbwlCardsTabs();
  renderEbwlCardsPanel();
}

document.getElementById('reset').addEventListener('click', () => {
  if (confirm('Wirklich den gesamten Fortschritt zurücksetzen?')) {
    state = {};
    saveState();
    render();
    renderDay();
  }
});

function renderNextExam() {
  const el = document.getElementById('next-exam');
  const upcoming = [...MODULES]
    .map(m => ({ ...m, days: daysUntil(m.date) }))
    .filter(m => m.days >= 0)
    .sort((a, b) => a.days - b.days);

  if (!upcoming.length) {
    el.innerHTML = '<div class="next-exam-name">Alle Klausuren geschrieben 🎉</div>';
    return;
  }

  const next = upcoming[0];
  const dateLabel = new Date(next.date + 'T00:00:00').toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit', year:'2-digit' });
  const countdown = next.days === 0 ? 'heute' : next.days;
  const unit = next.days === 0 ? '' : (next.days === 1 ? 'Tag' : 'Tage');

  el.innerHTML = `
    <div>
      <div class="next-exam-label">NÄCHSTE KLAUSUR</div>
      <span class="next-exam-name">${next.name}</span>
      <span class="next-exam-date">${dateLabel}</span>
    </div>
    <div class="next-exam-countdown">${countdown}${unit ? ` <span>${unit}</span>` : ''}</div>
  `;
}

async function initApp() {
  await Promise.all([loadState(), loadNotes(), loadQuizStats()]);
  render();
  renderDay();
  renderNextExam();
}
initApp();

const SITE_PASSWORD = 'Gamechanger2.0';
const UNLOCK_KEY = 'dashboard-unlocked';

function unlockApp() {
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('app').classList.add('unlocked');
}

function tryUnlock() {
  const input = document.getElementById('lock-input');
  const error = document.getElementById('lock-error');
  if (input.value === SITE_PASSWORD) {
    try { localStorage.setItem(UNLOCK_KEY, '1'); } catch (e) {}
    unlockApp();
  } else {
    error.textContent = 'Falsches Passwort';
    input.value = '';
    input.focus();
  }
}

document.getElementById('lock-btn').addEventListener('click', tryUnlock);
document.getElementById('lock-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') tryUnlock();
});

try {
  if (localStorage.getItem(UNLOCK_KEY) === '1') {
    unlockApp();
  } else {
    document.getElementById('lock-input').focus();
  }
} catch (e) {
  document.getElementById('lock-input').focus();
}
</script>
